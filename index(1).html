<!DOCTYPE html>

<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pear Phone OS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}

.hotspot{position:absolute!important;display:block!important;border:0!important;background:transparent!important;padding:0!important;margin:0!important;border-radius:50%;cursor:pointer;touch-action:manipulation;z-index:100!important;pointer-events:auto!important}.hotspot:active{background:rgba(255,255,255,.18)!important;transform:scale(.93)}
#messages{left:43.1%;top:25.7%;width:9.6%;aspect-ratio:1}#camera{left:54%;top:25.7%;width:9.6%;aspect-ratio:1}#splashface{left:38%;top:36.1%;width:9.6%;aspect-ratio:1}#stocks{left:47.5%;top:36.1%;width:9.6%;aspect-ratio:1}#maps{left:57%;top:36.1%;width:9.6%;aspect-ratio:1}#photos{left:38%;top:46.9%;width:9.6%;aspect-ratio:1}#weather{left:47.5%;top:46.9%;width:9.6%;aspect-ratio:1}#notes{left:57%;top:46.9%;width:9.6%;aspect-ratio:1}#peartunes{left:32%;top:55.9%;width:9.6%;aspect-ratio:1}#settings{left:42%;top:55.9%;width:9.6%;aspect-ratio:1}#clock{left:52%;top:55.9%;width:9.6%;aspect-ratio:1}#videos{left:62%;top:55.9%;width:9.6%;aspect-ratio:1}#phone{left:32%;top:65.9%;width:9.6%;aspect-ratio:1}#mail{left:42%;top:65.9%;width:9.6%;aspect-ratio:1}#compass{left:52%;top:65.9%;width:9.6%;aspect-ratio:1}#music{left:62%;top:65.9%;width:9.6%;aspect-ratio:1}#home{position:absolute;left:46%;top:78.8%;width:8.2%;aspect-ratio:1;border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:100;touch-action:manipulation}
#overlay{position:fixed;inset:0;z-index:1000;display:none;background:#f4f5f7}#overlay.open{display:flex}#app-window{width:100vw;height:100dvh;background:#f4f5f7;color:#111;display:flex;flex-direction:column}.window-header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 13px 10px;background:linear-gradient(#fff,#e7e8ea);border-bottom:1px solid #ccc;font-size:18px;font-weight:900}.window-body{flex:1;min-height:0;overflow-y:auto;padding:16px;padding-bottom:30px}.back,.button{font:inherit}.back{width:36px;height:36px;border-radius:50%;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-size:25px}.button{padding:10px 14px;border-radius:12px;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-weight:700;cursor:pointer}.button:active{transform:scale(.96)}input,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:12px;outline:none}textarea{width:100%;min-height:150px}.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:13px;margin-bottom:9px}.bubble{padding:10px 13px;max-width:82%;background:#dedfe3;border-radius:18px;margin-bottom:8px}.bubble.me{margin-left:auto;background:linear-gradient(#58b9ff,#1389df);color:#fff}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.stock{display:flex;justify-content:space-between;padding:12px;margin-bottom:8px;background:#fff;border:1px solid #ddd;border-radius:14px;cursor:pointer}.map{height:220px;border-radius:18px;background:repeating-linear-gradient(45deg,#eef1ed,#eef1ed 14px,#e2e7e1 14px,#e2e7e1 28px);display:flex;align-items:center;justify-content:center;font-size:58px}.setting{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#fff;border:1px solid #ddd;border-radius:13px}.small{font-size:12px;color:#777}
@media(max-width:600px){#phone-container{width:100vw;transform:scale(.68)}}@media(max-height:700px){#phone-container{width:100vw;transform:scale(.68)}}
