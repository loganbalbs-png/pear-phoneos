<script>

/* ============================================================

   CORE

============================================================ */

const phone =

  document.getElementById("phone-container");

const overlay =

  document.getElementById("overlay");

const appWindow =

  document.getElementById("app-window");

let currentPage = 1;

let cameraStream = null;

let keyboardTarget = null;

let keyboardShift = false;

let audioContext = null;

/* ============================================================

   HTML ESCAPE

============================================================ */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

/* ============================================================

   PAGE SWITCHING

============================================================ */

function showPage(page){

  currentPage = page;

  if(page === 2){

    phone.classList.add("page-two");

  }else{

    phone.classList.remove("page-two");

  }

}

function goHome(){

  closeApp();

  showPage(1);

}

/* ============================================================

   SWIPE DETECTION

   IMPORTANT:

   NEVER PROCESS SWIPES WHEN CLICKING AN APP

============================================================ */

let touchStartX = 0;

let touchStartY = 0;

let touchTarget = null;

phone.addEventListener(

  "touchstart",

  function(e){

    if(!e.touches.length) return;

    touchStartX =

      e.touches[0].clientX;

    touchStartY =

      e.touches[0].clientY;

    touchTarget =

      e.target;

  },

  {passive:true}

);

phone.addEventListener(

  "touchend",

  function(e){

    if(!e.changedTouches.length) return;

    const x = e.changedTouches[0].clientX;
    const y = e.changedTouches[0].clientY;
    const dx = x - touchStartX;
    const dy = y - touchStartY;

    /* SIDE TO SIDE = SLAPP.COM */
    if(
      Math.abs(dx) > 70 &&
      Math.abs(dx) > Math.abs(dy)
    ){
      window.location.href = "https://slapp.com";
      return;
    }

    /* UP / DOWN = PAGE SWITCH */
    if(
      Math.abs(dy) > 70 &&
      Math.abs(dy) > Math.abs(dx)
    ){
      if(dy < 0){
        showPage(2);
      }else{
        showPage(1);
      }
    }

  },

  {passive:true}

);

/* MOUSE */

let mouseStartX = 0;

let mouseStartY = 0;

let mouseTarget = null;

let mouseDown = false;

phone.addEventListener("mousedown",function(e){

  if(e.button !== 0) return;

  mouseDown = true;

  mouseStartX = e.clientX;

  mouseStartY = e.clientY;

  mouseTarget = e.target;

});

phone.addEventListener("mouseup",function(e){

  if(!mouseDown) return;

  mouseDown = false;

  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;

  /* SIDE TO SIDE = SLAPP.COM */
  if(
    Math.abs(dx) > 80 &&
    Math.abs(dx) > Math.abs(dy)
  ){
    window.location.href = "https://slapp.com";
    return;
  }

  /* UP / DOWN = PAGE SWITCH */
  if(
    Math.abs(dy) > 80 &&
    Math.abs(dy) > Math.abs(dx)
  ){
    if(dy < 0){
      showPage(2);
    }else{
      showPage(1);
    }
  }

});

/* ============================================================

   APP OPEN / CLOSE

============================================================ */

function openApp(title,content){

  stopCamera();

  appWindow.innerHTML = `

    <div class="app-header">

      <button

        class="back-button"

        id="app-back"

        type="button"

      >

        ‹

      </button>

      <strong>

        ${escapeHTML(title)}

      </strong>

    </div>

    <div class="app-content">

      ${content}

    </div>

  `;

  overlay.classList.add("open");

  document.getElementById("app-back")

    .onclick = closeApp;

  setupKeyboardFields();

}

function closeApp(){

  stopCamera();

  overlay.classList.remove("open");

  appWindow.innerHTML = "";

  hidePearKeyboard();

}

/* ============================================================

   CUSTOM KEYBOARD

============================================================ */

function setupKeyboardFields(){

  document

    .querySelectorAll(

      "#app-window input, #app-window textarea"

    )

    .forEach(field => {

      field.addEventListener(

        "focus",

        function(){

          keyboardTarget = this;

          showPearKeyboard(this);

        }

      );

    });

}

function showPearKeyboard(field){

  keyboardTarget = field;

  let keyboard =

    document.getElementById("pear-keyboard");

  if(!keyboard){

    keyboard =

      document.createElement("div");

    keyboard.id = "pear-keyboard";

    keyboard.innerHTML = `

      <div class="pear-keyboard-row">

        ${"QWERTYUIOP".split("").map(

          x =>

          `<button

             type="button"

             data-key="${x}"

           >${x}</button>`

        ).join("")}

      </div>

      <div class="pear-keyboard-row">

        ${"ASDFGHJKL".split("").map(

          x =>

          `<button

             type="button"

             data-key="${x}"

           >${x}</button>`

        ).join("")}

      </div>

      <div class="pear-keyboard-row">

        <button

          type="button"

          id="pear-shift"

        >

          ⇧

        </button>

        ${"ZXCVBNM".split("").map(

          x =>

          `<button

             type="button"

             data-key="${x}"

           >${x}</button>`

        ).join("")}

        <button

          type="button"

          id="pear-backspace"

        >

          ⌫

        </button>

      </div>

      <div class="pear-keyboard-row bottom">

        <button

          type="button"

          id="pear-number"

        >

          123

        </button>

        <button

          type="button"

          id="pear-space"

        >

          SPACE

        </button>

        <button

          type="button"

          id="pear-enter"

        >

          ↵

        </button>

      </div>

    `;

    overlay.appendChild(keyboard);

    keyboard

      .querySelectorAll("[data-key]")

      .forEach(button => {

        button.addEventListener(

          "pointerdown",

          function(e){

            e.preventDefault();

            if(!keyboardTarget) return;

            insertText(

              keyboardTarget,

              keyboardShift

                ? this.dataset.key

                : this.dataset.key.toLowerCase()

            );

          }

        );

      });

    document.getElementById("pear-shift")

      .onclick = function(){

        keyboardShift =

          !keyboardShift;

        this.style.background =

          keyboardShift

            ? "#9fd3ff"

            : "#f5f5f7";

      };

    document.getElementById("pear-backspace")

      .onclick = keyboardBackspace;

      .onclick = keyboardSpace;

    document.getElementById("pear-enter")

      .onclick = keyboardEnter;

    document.getElementById("pear-number")

      .onclick = keyboardNumber;

function insertText(field,text){

  if(!field) return;

  const start =

    field.selectionStart ??

    field.value.length;

  const end =

    field.selectionEnd ??

    field.value.length;

  field.value =

    field.value.substring(0,start) +

    text +

    field.value.substring(end);

  field.selectionStart =

    field.selectionEnd =

    start + text.length;

  field.dispatchEvent(

    new Event("input",{bubbles:true})

  );

}

function keyboardBackspace(){

  const field =

    keyboardTarget;

  if(!field) return;

  const start =

    field.selectionStart;

  const end =

    field.selectionEnd;

  if(start !== end){

    field.value =

      field.value.substring(0,start) +

      field.value.substring(end);

    field.selectionStart =

      field.selectionEnd =

      start;

  }else if(start > 0){

    field.value =

      field.value.substring(0,start-1) +

      field.value.substring(end);

    field.selectionStart =

      field.selectionEnd =

      start-1;

  }

}

function keyboardNumber(){

function playTone(

  frequency=440,

  duration=.1

){

  try{

    if(

      localStorage.getItem(

        "pear-sound"

      ) === "false"

    ){

      return;

    }

    audioContext =

      audioContext ||

      new (

        window.AudioContext ||

        window.webkitAudioContext

      )();

    const oscillator =

      audioContext.createOscillator();

    const gain =

      audioContext.createGain();

    oscillator.frequency.value =

      frequency;

    gain.gain.setValueAtTime(

      .08,

      audioContext.currentTime

    );

    gain.gain.exponentialRampToValueAtTime(

      .001,

      audioContext.currentTime +

      duration

    );

    oscillator.connect(gain);

    gain.connect(

      audioContext.destination

    );

    oscillator.start();

    oscillator.stop(

      audioContext.currentTime +

      duration

    );

  }catch(e){}

}

async function startCamera(){

  const video =

    document.getElementById(

      "camera-preview"

    );

  if(!video) return;

  try{
    stopCamera();

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){
      throw new Error("Camera API unavailable");
    }

    const initialStream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
      });

    initialStream.getTracks().forEach(track => track.stop());

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    const cameras = devices.filter(
      device => device.kind === "videoinput"
    );

    const freenove =
      cameras.find(device =>
        /freenove/i.test(device.label)
      );

    const selectedCamera =
      freenove || cameras[0];

    if(!selectedCamera){
      throw new Error("No camera found");
    }

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          deviceId:{exact:selectedCamera.deviceId}
        },
        audio:false
      });

    video.srcObject = cameraStream;

    await video.play().catch(() => {});

  }catch(error){

    const result =

      document.getElementById(

        "camera-result"

      );

    if(result){

      result.innerHTML =

        `<div class="result">

          Camera could not be started. Check that the Freenove camera is connected and camera permission is allowed.

        </div>`;

    }

  }

}

function captureCamera(){

  const video =

    document.getElementById(

      "camera-preview"

    );

  const canvas =

    document.getElementById(

      "camera-canvas"

    );

  if(

    !video ||

    !canvas ||

    !video.videoWidth

  ){

    return;

  }

  canvas.width =

    video.videoWidth;

  canvas.height =

    video.videoHeight;

  canvas

    .getContext("2d")

    .drawImage(

      video,

      0,

      0,

      canvas.width,

      canvas.height

    );

  const image =

    document.createElement("img");

  image.src =

    canvas.toDataURL(

      "image/jpeg",

      .9

    );

  image.style.width =

    "100%";

  image.style.borderRadius =

    "12px";

  document.getElementById(

    "camera-result"

  ).innerHTML =

    "<p>📸 Captured!</p>";

  document.getElementById(

    "camera-result"

  ).appendChild(image);

}

function stopCamera(){

  if(cameraStream){

    cameraStream

      .getTracks()

      .forEach(track =>

        track.stop()

      );

    cameraStream = null;

  }

}

        </div>

        <p>

          Tap enable to use your device orientation.

        </p>

        <button

          class="app-button"

          id="compass-start"

        >

          🧭 Enable

        </button>

      </div>

    `

  );

  document.getElementById(

    "compass-start"

  ).onclick = function(){

    window.addEventListener(

      "deviceorientation",

      updateCompass

    );

  };

}

function updateCompass(event){

  let heading =

    event.webkitCompassHeading;

  if(heading == null){

    heading =

      event.alpha == null

        ? 0

        : 360-event.alpha;

  }

  const display =

    document.getElementById(

      "heading"

    );

  if(display){

    display.textContent =

      Math.round(heading) +

      "°";

  }

}

/* CHRONO */

function chronoApp(){

  openApp(

    "Chrono",

    `

      <div class="card">

        <h2>⏱️ Chrono</h2>

        <div

          class="big-display"

          id="chrono-display"

        >

          00:00.0

        </div>

        <button

          class="app-button"

          id="chrono-start"

        >

          ▶ Start

        </button>

        <button

          class="app-button"

          id="chrono-stop"

        >

          ⏸ Stop

        </button>

        <button

          class="app-button"

          id="chrono-reset"

        >

          ↺ Reset

        </button>

      </div>

    `

  );

  let start = 0;

  let elapsed = 0;

  let timer = null;

  function render(){

    const total =

      elapsed +

      (

        timer

          ? Date.now()-start

          : 0

      );

    const seconds =

      Math.floor(total/1000);

    const minutes =

      Math.floor(seconds/60);

    const secs =

      seconds%60;

    const tenths =

      Math.floor(

        (total%1000)/100

      );

    document.getElementById(

      "chrono-display"

    ).textContent =

      String(minutes).padStart(2,"0") +

      ":" +

      String(secs).padStart(2,"0") +

      "." +

      tenths;

  }

  document.getElementById(

    "chrono-start"

  ).onclick = function(){

    if(timer) return;

    start = Date.now();

    timer =

      setInterval(

        render,

        50

      );

  };

  document.getElementById(

    "chrono-stop"

  ).onclick = function(){

    if(!timer) return;

    elapsed +=

      Date.now()-start;

    clearInterval(timer);

    timer = null;

    render();

  };

  document.getElementById(

    "chrono-reset"

  ).onclick = function(){

    if(timer){

      clearInterval(timer);

    }

    timer = null;

    elapsed = 0;

    render();

  };

}
