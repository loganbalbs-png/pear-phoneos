<script>
// ============================================================

// PEAR PHONE OS — FULL APP.JS

// ============================================================

const phone = document.getElementById("phone-container");

const overlay = document.getElementById("overlay");

const appWindow = document.getElementById("app-window");

const pageDots = document.getElementById("page-dots");

let currentPage = 1;

// ============================================================

// PAGE SWITCHING

// SWIPE UP = PAGE 2

// SWIPE DOWN = PAGE 1

// ============================================================

let touchStartX = 0;

let touchStartY = 0;

let touchMoved = false;

let mouseStartX = 0;

let mouseStartY = 0;

let mouseDragging = false;

let swipeLocked = false;

function showPage(page) {

  if (page !== 1 && page !== 2) return;
  if (page === currentPage) return;

  currentPage = page;

  phone.classList.remove("page-switch-up", "page-switch-down");
  phone.classList.toggle("page-two", page === 2);

  const pageOne = document.getElementById("page1");
  const pageTwo = document.getElementById("page2");

  if (pageOne && pageTwo) {
    pageOne.style.display = page === 1 ? "block" : "none";
    pageTwo.style.display = page === 2 ? "grid" : "none";
  }

  if (pageDots) {
    pageDots.textContent = page === 2 ? "○ ●" : "● ○";
  }

  closeApp();
}

document.addEventListener("keydown", e => {

  if (e.target.matches("input, textarea, select")) return;

  if (e.key === "ArrowUp" && currentPage === 1) {

    e.preventDefault();

    showPage(2);

  }

  if (e.key === "ArrowDown" && currentPage === 2) {

    e.preventDefault();

    showPage(1);

  }

});

let swipeStartX = 0;
let swipeStartY = 0;
let swipeTracking = false;

function beginSwipe(x, y) {
  if (overlay && overlay.classList.contains("open")) return;
  swipeStartX = x;
  swipeStartY = y;
  swipeTracking = true;
}

function finishSwipe(x, y) {
  if (!swipeTracking) return;
  swipeTracking = false;

  if (overlay && overlay.classList.contains("open")) return;

  const dx = x - swipeStartX;
  const dy = y - swipeStartY;

  if (Math.abs(dy) < 60 || Math.abs(dy) <= Math.abs(dx)) return;

  if (dy < 0 && currentPage === 1) showPage(2);
  if (dy > 0 && currentPage === 2) showPage(1);
}

document.addEventListener("touchstart", e => {
  if (!e.touches || !e.touches[0]) return;
  beginSwipe(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true, capture: true });

document.addEventListener("touchend", e => {
  if (!e.changedTouches || !e.changedTouches[0]) return;
  finishSwipe(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, { passive: true, capture: true });

document.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  beginSwipe(e.clientX, e.clientY);
}, true);

document.addEventListener("mouseup", e => {
  if (e.button !== 0) return;
  finishSwipe(e.clientX, e.clientY);
}, true);

// The home button must work even while the camera/app overlay is open.
document.addEventListener("pointerup", e => {
  const home = document.getElementById("home");
  if (!home) return;

  const r = home.getBoundingClientRect();
  if (
    e.clientX >= r.left && e.clientX <= r.right &&
    e.clientY >= r.top && e.clientY <= r.bottom
  ) {
    e.preventDefault();
    e.stopPropagation();
    closeApp();
  }
}, true);

// Also support browsers/touchscreens that do not deliver pointer events reliably.
document.addEventListener("touchend", e => {
  const t = e.changedTouches && e.changedTouches[0];
  const home = document.getElementById("home");
  if (!t || !home) return;

  const r = home.getBoundingClientRect();
  if (
    t.clientX >= r.left && t.clientX <= r.right &&
    t.clientY >= r.top && t.clientY <= r.bottom
  ) {
    e.preventDefault();
    e.stopPropagation();
    closeApp();
  }
}, { capture: true, passive: false });

// ============================================================

// CUSTOM PEAR KEYBOARD

// ============================================================

let keyboardVisible = false;

let keyboardShift = false;

let activeKeyboardField = null;

function addKeyboardSupport() {

  setTimeout(() => {

    const fields = appWindow.querySelectorAll(

      "input[type='text'], input:not([type]), textarea"

    );

    fields.forEach(field => {

      field.addEventListener("pointerdown", () => {

        activeKeyboardField = field;

      });

      field.addEventListener("click", () => {

        activeKeyboardField = field;

        field.focus({ preventScroll: true });

        showPearKeyboard(field);

      });

    });

  }, 50);

}

function showPearKeyboard(input) {

  if (!input) return;

  activeKeyboardField = input;

  keyboardVisible = true;

  let keyboard = document.getElementById(

    "pear-keyboard"

  );

  if (!keyboard) {

    keyboard = document.createElement("div");

    keyboard.id = "pear-keyboard";

    keyboard.innerHTML = `

      <div class="pear-keyboard-row">

        ${"QWERTYUIOP".split("").map(k =>

          `<button type="button" onclick="keyboardKey('${k}')">${k}</button>`

        ).join("")}

      </div>

      <div class="pear-keyboard-row">

        ${"ASDFGHJKL".split("").map(k =>

          `<button type="button" onclick="keyboardKey('${k}')">${k}</button>`

        ).join("")}

      </div>

      <div class="pear-keyboard-row">

        <button type="button" onclick="keyboardShiftKey()">⇧</button>

        ${"ZXCVBNM".split("").map(k =>

          `<button type="button" onclick="keyboardKey('${k}')">${k}</button>`

        ).join("")}

        <button type="button" onclick="keyboardBackspace()">⌫</button>

      </div>

      <div class="pear-keyboard-row bottom">

        <button type="button" onclick="keyboardNumber()">123</button>

        <button type="button" onclick="keyboardSpace()">SPACE</button>

        <button type="button" onclick="keyboardEnter()">↵</button>

      </div>

    `;

    overlay.appendChild(keyboard);

    keyboard.addEventListener("pointerdown", e => {
      e.preventDefault();
    });

    keyboard.addEventListener("mousedown", e => {
      e.preventDefault();
    });

    keyboard.addEventListener("touchstart", e => {
      e.preventDefault();
    }, { passive: false });

  }

  keyboard.style.display = "grid";

  setTimeout(() => {

    keyboard.classList.add("keyboard-show");

  }, 10);

}

function hidePearKeyboard(immediate = false) {

  activeKeyboardField = null;

  const keyboard =

    document.getElementById("pear-keyboard");

  if (!keyboard) {
    keyboardVisible = false;
    return;
  }

  keyboard.classList.remove("keyboard-show");

  keyboardVisible = false;

  if (immediate) {
    keyboard.style.display = "none";
    return;
  }

  setTimeout(() => {
    if (!keyboardVisible) keyboard.style.display = "none";
  }, 250);

}

function getFocusedField() {

  if (

    activeKeyboardField &&

    document.body.contains(activeKeyboardField) &&

    (

      activeKeyboardField.tagName === "INPUT" ||

      activeKeyboardField.tagName === "TEXTAREA"

    )

  ) {

    return activeKeyboardField;

  }

  const active = document.activeElement;

  if (

    active &&

    (

      active.tagName === "INPUT" ||

      active.tagName === "TEXTAREA"

    )

  ) {

    activeKeyboardField = active;

    return active;

  }

  return null;

}

// ============================================================

// MESSAGES

// ============================================================

const messageContacts = {

  Chloe: [

    "Heyyy 👋",

    "What are you doing?",

    "HAHA wait 😭",

    "Okayyy sounds good"

  ],

  Sam: [

    "Yo!",

    "Are you free later?",

    "That's actually crazy 😂",

    "See you soon"

  ],

  Cat: [

    "meow",

    "feed me",

    "MEOWWW",

    "😼"

  ]

};

function messagesApp() {

  openApp(

    "Messages",

    `

      <div class="card">

        <h2>💬 Messages</h2>

        <div id="contact-list">

          ${Object.keys(messageContacts).map(name => `

            <button onclick="openChat('${name}')">

              💬 ${name}

            </button>

          `).join("")}

        </div>

        <button onclick="newMessage()">

          ✏️ New Message

        </button>

        <button onclick="alert('3 unread messages')">

          🔴 Unread Messages

        </button>

      </div>

    `

  );

}

function openChat(name) {

  const messages =

    messageContacts[name] || [];

  openApp(

    name,

    `

      <div class="card">

        <div id="chat-box">

          ${messages.slice(0, 2).map(msg => `

            <div class="message received">

              ${escapeHTML(msg)}

            </div>

          `).join("")}

        </div>

        <input

          id="message-input"

          placeholder="Message..."

        >

        <button onclick="sendMessage('${name}')">

          Send

        </button>

        <button onclick="randomReply('${name}')">

          🤖 Random Reply

        </button>

      </div>

    `

  );

}

function sendMessage(name) {

  const input =

    document.getElementById("message-input");

  const chat =

    document.getElementById("chat-box");

  if (!input || !chat || !input.value.trim()) {

    return;

  }

  chat.innerHTML += `

    <div class="message sent">

      ${escapeHTML(input.value)}

    </div>

  `;

  input.value = "";

  setTimeout(() => randomReply(name), 600);

}

function randomReply(name) {

  const chat =

    document.getElementById("chat-box");

  if (!chat) return;

  const replies =

    messageContacts[name] || ["Okay!"];

  const reply =

    replies[Math.floor(Math.random() * replies.length)];

  chat.innerHTML += `

let cameraStream = null;

let cameraFacing = "user";

function cameraApp() {

  openApp(

    "Camera",

    `

      <div class="card camera-box">

        <video

          id="camera-video"

          autoplay

          playsinline

        ></video>

        <button onclick="startCamera()">

          📷 Start Camera

        </button>

        <button onclick="capturePhoto()">

          ⭕ Take Photo

        </button>

        <button onclick="flipCamera()">

          🔄 Flip Camera

        </button>

        <div id="camera-photo"></div>

        <canvas id="camera-canvas"></canvas>

      </div>

    `

  );

  startCamera();

}

async function startCamera() {

  try {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

      alert("Camera access requires a browser with camera support and HTTPS (or localhost).");
      return;

    }

    stopCamera();

    const video = document.getElementById("camera-video");
    if (!video) return;

    // First ask the browser for any camera. This is important because
    // USB/Freenove camera names are often hidden until permission is granted.
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 1280 },
        height: { ideal: 720 },
        facingMode: cameraFacing
      },
      audio: false
    });

    video.srcObject = cameraStream;
    video.muted = true;
    video.setAttribute("playsinline", "");
    try { await video.play(); } catch (playError) { console.warn("Camera video play was blocked:", playError); }

    // After permission, look for the Freenove/USB camera specifically.
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter(device => device.kind === "videoinput");
      const currentTrack = cameraStream.getVideoTracks()[0];
      const currentDeviceId = currentTrack?.getSettings?.().deviceId || "";
      const freenove = cameras.find(device =>
        /freenove/i.test(device.label)
      ) || cameras.find(device =>
        /usb|webcam|camera/i.test(device.label)
      );

      if (freenove && freenove.deviceId && freenove.deviceId !== currentDeviceId) {
        currentTrack?.stop();
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId: { exact: freenove.deviceId },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = cameraStream;
        video.muted = true;
        video.setAttribute("playsinline", "");
        try { await video.play(); } catch (playError) { console.warn("Preferred camera video play was blocked:", playError); }
      }
    } catch (deviceError) {
      console.warn("Could not select the named USB/Freenove camera; using the active camera instead.", deviceError);
    }

  } catch (error) {

    console.error("Pear Phone camera error:", error);

    alert("Camera access was not available. Make sure the Freenove camera is connected, allowed in the browser, and the site is running over HTTPS or localhost.");

  }

}

function flipCamera() {

  cameraFacing =

    cameraFacing === "user"

      ? "environment"

      : "user";

  startCamera();

}

function capturePhoto() {

  const video =

    document.getElementById("camera-video");

  const canvas =

    document.getElementById("camera-canvas");

  const preview =

    document.getElementById("camera-photo");

  if (!video || !canvas || !preview) return;

  canvas.width =

    video.videoWidth || 640;

  canvas.height =

    video.videoHeight || 480;

  const ctx =

    canvas.getContext("2d");

  ctx.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );

  preview.innerHTML = `

    <img

      src="${canvas.toDataURL("image/png")}"

      style="width:100%;border-radius:12px"

    >

  `;

}

function stopCamera() {

  if (!cameraStream) return;

  cameraStream.getTracks().forEach(track => {

    track.stop();

  });

  cameraStream = null;

}

function playDemoTone() {

  const AudioContext =

    window.AudioContext ||

    window.webkitAudioContext;

  if (!AudioContext) return;

  const context =

    new AudioContext();

  const oscillator =

    context.createOscillator();

  const gain =

    context.createGain();

  oscillator.frequency.value = 440;

  oscillator.connect(gain);

  gain.connect(context.destination);

  oscillator.start();

  gain.gain.exponentialRampToValueAtTime(

    0.0001,

    context.currentTime + 1

  );

  oscillator.stop(

    context.currentTime + 1

  );

}

let stopwatchInterval = null;

let stopwatchSeconds = 0;

let timerInterval = null;

let timerSeconds = 60;

function clockApp() {

  openApp(

    "Clock",

    `

      <div class="card">

        <h2>🕐 Clock</h2>

        <div id="live-clock"

             style="font-size:32px">

          ${new Date().toLocaleTimeString()}

        </div>

        <hr>

        <h3>Stopwatch</h3>

        <div id="stopwatch">

          00:00

        </div>

        <button onclick="startStopwatch()">

          Start

        </button>

        <button onclick="stopStopwatch()">

          Stop

        </button>

        <button onclick="resetStopwatch()">

          Reset

        </button>

        <h3>Timer</h3>

        <input

          id="timer-input"

          type="number"

          value="60"

          min="1"

        >

        <div id="timer">

          01:00

        </div>

        <button onclick="startTimer()">

          Start

        </button>

        <button onclick="resetTimer()">

          Reset

        </button>

        <h3>Alarm</h3>

        <input

          id="alarm-time"

          type="time"

        >

        <button onclick="setAlarm()">

          Set Alarm

        </button>

      </div>

    `

  );

  updateClock();

}

function updateClock() {

  const clock =

    document.getElementById("live-clock");

  if (clock) {

    clock.textContent =

      new Date().toLocaleTimeString();

  }

}

setInterval(updateClock, 1000);

function startStopwatch() {

  if (stopwatchInterval) return;

  stopwatchInterval =

    setInterval(() => {

      stopwatchSeconds++;

      const el =

        document.getElementById(

          "stopwatch"

        );

      if (el) {

        el.textContent =

          formatTime(stopwatchSeconds);

      }

    }, 1000);

}

function stopStopwatch() {

  clearInterval(stopwatchInterval);

  stopwatchInterval = null;

}

function resetStopwatch() {

  stopStopwatch();

  stopwatchSeconds = 0;

  const el =

    document.getElementById(

      "stopwatch"

    );

  if (el) {

    el.textContent = "00:00";

  }

}

function startTimer() {

  if (timerInterval) return;

  const input =

    document.getElementById(

      "timer-input"

    );

  if (input) {

    timerSeconds =

      Math.max(

        1,

        Number(input.value) || 60

      );

  }

  timerInterval =

    setInterval(() => {

      timerSeconds--;

      const el =

        document.getElementById(

          "timer"

        );

      if (el) {

        el.textContent =

          formatTime(timerSeconds);

      }

      if (timerSeconds <= 0) {

        clearInterval(timerInterval);

        timerInterval = null;

        alert(

          "⏰ Timer finished!"

        );

      }

    }, 1000);

}

function resetTimer() {

  clearInterval(timerInterval);

  timerInterval = null;

  timerSeconds = 60;

  const el =

    document.getElementById("timer");

  if (el) {

    el.textContent = "01:00";

  }

}

function setAlarm() {

  const time =

    document.getElementById(

      "alarm-time"

    );

  if (!time || !time.value) {

    alert("Choose an alarm time.");

    return;

  }

  alert(

    "⏰ Alarm set for " +

    time.value

  );

}

function formatTime(seconds) {

  const minutes =

    Math.floor(seconds / 60);

  const secs =

    seconds % 60;

  return (

    String(minutes).padStart(2, "0") +

    ":" +

    String(secs).padStart(2, "0")

  );

}

let typingTimer = null;

let typingStartTime = 0;

let typingSentence = "";

let typingFinished = false;

const typingSentences = [

  "The quick brown fox jumps over the lazy dog.",

  "Pear Phone OS is ready for another adventure.",

  "I can type really fast when I concentrate.",

  "The best ideas sometimes start with a tiny screen.",

  "Welcome to the coolest phone in the world.",

];

function thumbApp() {

}

function tumsApp() {

  typingSentence =

    typingSentences[

      Math.floor(

        Math.random() *

        typingSentences.length

      )

    ];

  typingFinished = false;

  openApp(

    "Tumps",

    `

      <div class="card typing-game">

        <h2>⌨️ Tumps</h2>

        <p>

          Type the sentence as fast and accurately

          as possible.

        </p>

        <div

          id="typing-sentence"

          class="typing-sentence"

        >

          ${escapeHTML(typingSentence)}

        </div>

        <input

          id="typing-input"

          placeholder="Tap START first..."

          disabled

          autocomplete="off"

          autocorrect="off"

          autocapitalize="off"

          spellcheck="false"

          oninput="typingInputChanged()"

        >

        <div class="typing-stats">

          <div>

            ⏱️

            <strong id="typing-time">

              0.0

            </strong>s

          </div>

          <div>

            ⚡

            <strong id="typing-wpm">

              0

            </strong>

            WPM

          </div>

          <div>

            🎯

            <strong id="typing-accuracy">

              100

            </strong>%

          </div>

        </div>

        <button onclick="startTypingGame()">

          ▶ START

        </button>

        <button onclick="newTypingSentence()">

          🔄 NEW SENTENCE

        </button>

        <div id="typing-result"></div>

      </div>

    `

  );

}

function startTypingGame() {

  stopTypingGame();

  const input =

    document.getElementById(

      "typing-input"

    );

  const result =

    document.getElementById(

      "typing-result"

    );

  if (!input) return;

  input.disabled = false;

  input.value = "";

  input.placeholder = "Start typing...";

  if (result) {

    result.innerHTML = "";

  }

  typingFinished = false;

  typingStartTime = Date.now();

  typingTimer =

    setInterval(updateTypingStats, 100);

  input.focus();

  showPearKeyboard(input);

}

function stopTypingGame() {

  if (typingTimer) {

    clearInterval(typingTimer);

    typingTimer = null;

  }

}

function updateTypingStats() {

  if (!typingStartTime) return;

  const elapsed =

    (Date.now() - typingStartTime) / 1000;

  const time =

    document.getElementById(

      "typing-time"

    );

  if (time) {

    time.textContent =

      elapsed.toFixed(1);

  }

  updateTypingCalculations(elapsed);

}

function typingInputChanged() {

  if (typingFinished) return;

  const input =

    document.getElementById(

      "typing-input"

    );

  if (!input) return;

  const typed = input.value;

  updateTypingCalculations(

    (Date.now() - typingStartTime) / 1000

  );

  if (

    typed === typingSentence

  ) {

    finishTypingGame();

  }

}

function updateTypingCalculations(elapsed) {

  const input =

    document.getElementById(

      "typing-input"

    );

  if (!input) return;

  const typed =

    input.value;

  let correct = 0;

  for (

    let i = 0;

    i < typed.length &&

    i < typingSentence.length;

    i++

  ) {

    if (

      typed[i] ===

      typingSentence[i]

    ) {

      correct++;

    }

  }

  const accuracy =

    typed.length === 0

      ? 100

      : Math.round(

          (correct /

            typed.length) *

          100

        );

  const words =

    correct / 5;

  const minutes =

    elapsed / 60;

  const wpm =

    minutes > 0

      ? Math.round(

          words / minutes

        )

      : 0;

  const accuracyEl =

    document.getElementById(

      "typing-accuracy"

    );

  const wpmEl =

    document.getElementById(

      "typing-wpm"

    );

  if (accuracyEl) {

    accuracyEl.textContent =

      Math.max(

        0,

        Math.min(

          100,

          accuracy

        )

      );

  }

  if (wpmEl) {

    wpmEl.textContent =

      wpm;

  }

  highlightTyping();

}

function highlightTyping() {

  const sentence =

    document.getElementById(

      "typing-sentence"

    );

  const input =

    document.getElementById(

      "typing-input"

    );

  if (!sentence || !input) return;

  const typed = input.value;

  sentence.innerHTML =

    typingSentence

      .split("")

      .map((char, index) => {

        if (index >= typed.length) {

          return `

            <span>

              ${escapeHTML(char)}

            </span>

          `;

        }

        if (

          typed[index] === char

        ) {

          return `

            <span style="color:green">

              ${escapeHTML(char)}

            </span>

          `;

        }

        return `

          <span style="color:red">

            ${escapeHTML(char)}

          </span>

        `;

      })

      .join("");

}

function finishTypingGame() {

  if (typingFinished) return;

  typingFinished = true;

  const elapsed =

    (Date.now() - typingStartTime) / 1000;

  stopTypingGame();

  const input =

    document.getElementById(

      "typing-input"

    );

  if (input) {

    input.disabled = true;

  }

  const wpm =

    Math.round(

      (typingSentence.length / 5) /

      (elapsed / 60)

    );

  const result =

    document.getElementById(

      "typing-result"

    );

  if (result) {

    result.innerHTML = `

      <div class="card">

        <h2>🎉 Finished!</h2>

        <p>

          ⏱️ Time:

          ${elapsed.toFixed(2)} seconds

        </p>

        <p>

          ⚡ Speed:

          ${wpm} WPM

        </p>

        <p>

          🎯 Accuracy:

          100%

        </p>

        <button onclick="newTypingSentence()">

          Play Again

        </button>

      </div>

    `;

  }

  hidePearKeyboard();

}

function newTypingSentence() {

  stopTypingGame();

  typingSentence =

    typingSentences[

      Math.floor(

        Math.random() *

        typingSentences.length

      )

    ];

  tumsApp();

}

let imageRotation = 0;

let imageScale = 1;

function rotateImage() {

  const image =

    document.getElementById(

      "studio-image"

    );

  if (!image) return;

  imageRotation += 90;

  image.style.transform =

    `rotate(${imageRotation}deg)

     scale(${imageScale})`;

function imageZoom(amount) {

  const image =

    document.getElementById(

      "studio-image"

    );

  if (!image) return;

  imageScale *= amount;

  imageScale =

    Math.max(

      .5,

      Math.min(

        3,

        imageScale

      )

    );

  image.style.transform =

    `rotate(${imageRotation}deg)

     scale(${imageScale})`;

}

      "studio-image"

    );

  if (!image) return;

  image.style.filter =

    image.style.filter

      ? ""

      : "grayscale(100%) contrast(1.2)";

}

function chronoApp() {

  openApp(

    "Chrono",

    `

      <div class="card">

        <h2>⏱️ Chrono</h2>

        <div

          id="chrono-time"

          style="font-size:45px"

        >

          00:00

        </div>

        <button onclick="chronoStart()">

          Start

        </button>

        <button onclick="chronoStop()">

          Stop

        </button>

        <button onclick="chronoReset()">

          Reset

        </button>

        <button onclick="chronoChallenge()">

          🎯 Challenge

        </button>

      </div>

    `

  );

}

let chronoSeconds = 0;

let chronoInterval = null;

function chronoStart() {

  if (chronoInterval) return;

  chronoInterval =

    setInterval(() => {

      chronoSeconds++;

      const el =

        document.getElementById(

          "chrono-time"

        );

      if (el) {

        el.textContent =

          formatTime(

            chronoSeconds

          );

      }

    }, 1000);

}

function chronoStop() {

  clearInterval(chronoInterval);

  chronoInterval = null;

}

function chronoReset() {

  chronoStop();

  chronoSeconds = 0;

  const el =

    document.getElementById(

      "chrono-time"

    );

  if (el) {

    el.textContent = "00:00";

  }

}

function chronoChallenge() {

  const target =

    Math.floor(

      Math.random() * 10

    ) + 5;

  alert(

    "Start the stopwatch and try to stop it at exactly " +

    target +

    " seconds!"

  );

}

// REMARK

// ============================================================

let remarks = JSON.parse(

  localStorage.getItem(

    "pear-remarks"

  ) || "[]"

);

function remarkApp() {

  openApp(

    "Remark",

    `

      <div class="card">

        <h2>💭 Remark</h2>

        <textarea

          id="remark-text"

          placeholder="Write something..."

        ></textarea>

        <button onclick="saveRemark()">

          💾 Save

        </button>

        <button onclick="clearRemarks()">

          🗑️ Clear All

        </button>

        <div>

          ${remarks.map((remark, index) => `

            <div class="post">

              ${escapeHTML(remark)}

              <br>

              <button onclick="deleteRemark(${index})">

                Delete

              </button>

            </div>

          `).join("")}

        </div>

      </div>

    `

  );

}

function saveRemark() {

  const text =

    document.getElementById(

      "remark-text"

    );

  if (!text || !text.value.trim()) {

    return;

  }

  remarks.unshift(text.value);

  localStorage.setItem(

    "pear-remarks",

    JSON.stringify(remarks)

  );

  remarkApp();

}

function deleteRemark(index) {

  remarks.splice(index, 1);

  localStorage.setItem(

    "pear-remarks",

    JSON.stringify(remarks)

  );

  remarkApp();

}

function clearRemarks() {

  remarks = [];

  localStorage.removeItem(

    "pear-remarks"

  );

  remarkApp();

}

function connectPage1Apps() {

  const connections = {

    messages: messagesApp,

    camera: cameraApp,

    splashface: splashfaceApp,

    stocks: stocksApp,

    maps: mapsApp,

    photos: photosApp,

    clock: clockApp,

    videos: videosApp,

    phone: phoneApp,

    mail: mailApp,

    compass: compassApp,

    music: pearTunesApp

  };

  Object.keys(connections).forEach(id => {

// ============================================================

// PAGE 2 CONNECTIONS

// ============================================================

function connectPage2Apps() {

  const connections = {
    "p2-lingo": lingoApp,
    "p2-splash": splashfaceApp,
    "p2-thumb": tumsApp,
    "p2-danwarp": danwarpApp,
    "p2-image": imageApp,
    "p2-chrono": chronoApp,
    "p2-zaplook": zaplookApp,
    "p2-weather": weatherApp,
    "p2-music": pearTunesApp,
    "p2-monkey": monkeyApp,
    "p2-remark": remarkApp,
    "p2-settings": settingsApp,
    "p2-phone": phoneApp,
    "p2-mail": mailApp,
    "p2-compass": compassApp,
    "p2-music2": pearTunesApp
  };

  Object.keys(connections).forEach(id => {
    const button = document.getElementById(id);
    if (!button || button.dataset.pearConnected === "1") return;
    button.dataset.pearConnected = "1";
    button.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      connections[id]();
    });
  });

  const pageTwo = document.getElementById("page2");
  if (!pageTwo) return;

  const dataConnections = {
    messages: messagesApp, camera: cameraApp, photos: photosApp,
    weather: weatherApp, maps: mapsApp, videos: videosApp,
    music: pearTunesApp, notes: notesApp, settings: settingsApp,
    clock: clockApp, phone: phoneApp, mail: mailApp,
    compass: compassApp, splashface: splashfaceApp, stocks: stocksApp
  };

  pageTwo.querySelectorAll("button[data-app]").forEach(button => {
    if (button.dataset.pearConnected === "1") return;
    const app = dataConnections[button.dataset.app];
    if (!app) return;
    button.dataset.pearConnected = "1";
    button.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      app();
    });
  });
}

// ============================================================

// UTILITY

// ============================================================

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}
