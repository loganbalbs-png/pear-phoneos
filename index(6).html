<style>

* {

    box-sizing: border-box;

}

html,

body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #111;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

/* =========================================================

   PHONE

   ========================================================= */

#phone-container {

    position: relative;

    width: min(170vh, 1500px);

    height: auto;

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    /* KEEP PHONE FACING THE SAME WAY */

    transform: rotate(90deg);

    touch-action: pan-y;

}

/* =========================================================

   PAGE 2 IMAGE

   ========================================================= */

#page2 {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    background-image: url("page2.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    display: none;

    z-index: 50;

    pointer-events: none;

}

#phone-container.page-two #page2 {

    display: block;

}

/* =========================================================

   HOTSPOTS

   ========================================================= */

.hotspot {

    position: absolute;

    display: block;

    border: none;

    outline: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    z-index: 200;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

}

.hotspot::after {

    content: "";

    position: absolute;

    left: -15%;

    top: -15%;

    width: 130%;

    height: 130%;

    background: transparent;

}

.hotspot:active {

    transform: scale(.90);

}

/* =========================================================

   APP STYLES

   ========================================================= */

.header {

    height: 38px;

    min-height: 38px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 5px 8px;

    background: #eee;

    border-bottom: 1px solid #ccc;

    font-weight: bold;

    position: sticky;

    top: 0;

    z-index: 5;

}

.back {

    border: none;

    background: #ddd;

    border-radius: 6px;

    width: 30px;

    height: 28px;

    font-size: 20px;

    line-height: 20px;

    cursor: pointer;

}

.content {

    padding: 10px;

    font-size: 13px;

}

.button {

    border: none;

    background: #ddd;

    color: #111;

    border-radius: 7px;

    padding: 8px 11px;

    margin: 3px;

    font-size: 12px;

    cursor: pointer;

    touch-action: manipulation;

}

.button:active {

    transform: scale(.94);

}

input,

textarea,

select {

    width: 100%;

    padding: 8px;

    margin: 4px 0;

    border: 1px solid #bbb;

    border-radius: 6px;

    font-family: inherit;

    font-size: 13px;

}

textarea {

    min-height: 65px;

    resize: vertical;

}

.card {

    background: #fff;

    border-radius: 9px;

    padding: 10px;

    margin-bottom: 8px;

    box-shadow:

        0 1px 4px rgba(0,0,0,.12);

    cursor: pointer;

}

.card:active {

    transform: scale(.98);

}

.grid {

    display: grid;

    grid-template-columns:

        repeat(2, 1fr);

    gap: 7px;

}

.big-icon {

    font-size: 55px;

    text-align: center;

    margin: 8px;

}

.message {

    background: #e5e5ea;

    padding: 7px 10px;

    border-radius: 12px;

    margin: 5px 0;

    max-width: 85%;

}

.message.me {

    margin-left: auto;

    background: #cfe8ff;

}

.progress {

    height: 10px;

    background: #ddd;

    border-radius: 10px;

    overflow: hidden;

}

.progress div {

    height: 100%;

    background: #5cb85c;

}

/* =========================================================

   PAGE INDICATOR

   ========================================================= */

#page-dots {

    position: absolute;

    bottom: 3%;

    left: 50%;

    transform: translateX(-50%);

    z-index: 600;

    color: white;

    font-size: 16px;

    pointer-events: none;

    letter-spacing: 5px;

}

#phone-container.page-two #page-dots {

    color: white;

}

/* =========================================================

   RESPONSIVE

   ========================================================= */

@media (orientation: portrait) {

    #phone-container {

        width: min(170vh, 1500px);

        transform: rotate(90deg);

    }

}

@media (orientation: landscape) {

    #phone-container {

        width: min(170vh, 1500px);

        transform: rotate(90deg);

    }

}


/* =========================
   CUSTOM PEAR KEYBOARD
========================= */
#pear-keyboard{position:absolute;left:3%;right:3%;bottom:3%;width:94%;padding:6px;background:rgba(35,35,40,.98);border-radius:11px;z-index:9999;display:none;opacity:0;transform:translateY(120%);transition:transform .28s cubic-bezier(.22,.8,.25,1),opacity .2s ease;box-shadow:0 5px 18px rgba(0,0,0,.55);touch-action:manipulation;}
#pear-keyboard.keyboard-show{opacity:1;transform:translateY(0);}
.pear-keyboard-row{display:flex;gap:3px;margin-bottom:3px;}
.pear-keyboard-row:last-child{margin-bottom:0;}
.pear-keyboard-row button{flex:1;min-width:0;height:29px;border:0;border-radius:5px;background:#f5f5f7;color:#111;font-size:11px;font-weight:800;padding:0;touch-action:manipulation;user-select:none;}
.pear-keyboard-row button:active{transform:scale(.88);background:#cfd0d4;}
.pear-keyboard-row.bottom button:first-child{flex:1.2;}
.pear-keyboard-row.bottom button:nth-child(2){flex:5;}
.pear-keyboard-row.bottom button:last-child{flex:1.2;}
