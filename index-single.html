<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pear Phone OS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#phone-container{position:relative;width:min(82vw,520px);aspect-ratio:1212/1188;background:url("pear-phone.jpg") center/contain no-repeat;background-color:#fff;transform:scale(.78);transform-origin:center;z-index:10;touch-action:manipulation}
.hotspot{position:absolute!important;display:block!important;border:0!important;background:transparent!important;padding:0!important;margin:0!important;border-radius:50%;cursor:pointer;touch-action:manipulation;z-index:100!important;pointer-events:auto!important}.hotspot:active{background:rgba(255,255,255,.18)!important;transform:scale(.93)}
#messages{left:43.1%;top:25.7%;width:9.6%;aspect-ratio:1}#camera{left:54%;top:25.7%;width:9.6%;aspect-ratio:1}#splashface{left:38%;top:36.1%;width:9.6%;aspect-ratio:1}#stocks{left:47.5%;top:36.1%;width:9.6%;aspect-ratio:1}#maps{left:57%;top:36.1%;width:9.6%;aspect-ratio:1}#photos{left:38%;top:46.9%;width:9.6%;aspect-ratio:1}#weather{left:47.5%;top:46.9%;width:9.6%;aspect-ratio:1}#notes{left:57%;top:46.9%;width:9.6%;aspect-ratio:1}#peartunes{left:32%;top:55.9%;width:9.6%;aspect-ratio:1}#settings{left:42%;top:55.9%;width:9.6%;aspect-ratio:1}#clock{left:52%;top:55.9%;width:9.6%;aspect-ratio:1}#videos{left:62%;top:55.9%;width:9.6%;aspect-ratio:1}#phone{left:32%;top:65.9%;width:9.6%;aspect-ratio:1}#mail{left:42%;top:65.9%;width:9.6%;aspect-ratio:1}#compass{left:52%;top:65.9%;width:9.6%;aspect-ratio:1}#music{left:62%;top:65.9%;width:9.6%;aspect-ratio:1}#home{position:absolute;left:46%;top:78.8%;width:8.2%;aspect-ratio:1;border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:100;touch-action:manipulation}
#overlay{position:fixed;inset:0;z-index:1000;display:none;background:#f4f5f7}#overlay.open{display:flex}#app-window{width:100vw;height:100dvh;background:#f4f5f7;color:#111;display:flex;flex-direction:column}.window-header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 13px 10px;background:linear-gradient(#fff,#e7e8ea);border-bottom:1px solid #ccc;font-size:18px;font-weight:900}.window-body{flex:1;min-height:0;overflow-y:auto;padding:16px;padding-bottom:30px}.back,.button{font:inherit}.back{width:36px;height:36px;border-radius:50%;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-size:25px}.button{padding:10px 14px;border-radius:12px;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-weight:700;cursor:pointer}.button:active{transform:scale(.96)}input,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:12px;outline:none}textarea{width:100%;min-height:150px}.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:13px;margin-bottom:9px}.bubble{padding:10px 13px;max-width:82%;background:#dedfe3;border-radius:18px;margin-bottom:8px}.bubble.me{margin-left:auto;background:linear-gradient(#58b9ff,#1389df);color:#fff}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.stock{display:flex;justify-content:space-between;padding:12px;margin-bottom:8px;background:#fff;border:1px solid #ddd;border-radius:14px;cursor:pointer}.map{height:220px;border-radius:18px;background:repeating-linear-gradient(45deg,#eef1ed,#eef1ed 14px,#e2e7e1 14px,#e2e7e1 28px);display:flex;align-items:center;justify-content:center;font-size:58px}.setting{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#fff;border:1px solid #ddd;border-radius:13px}.small{font-size:12px;color:#777}
@media(max-width:600px){#phone-container{width:100vw;transform:scale(.68)}}@media(max-height:700px){#phone-container{width:100vw;transform:scale(.68)}}
</style></head><body>
<div id="phone-container">
<button class="hotspot" id="messages"></button><button class="hotspot" id="camera"></button><button class="hotspot" id="splashface"></button><button class="hotspot" id="stocks"></button><button class="hotspot" id="maps"></button><button class="hotspot" id="photos"></button><button class="hotspot" id="weather"></button><button class="hotspot" id="notes"></button><button class="hotspot" id="peartunes"></button><button class="hotspot" id="settings"></button><button class="hotspot" id="clock"></button><button class="hotspot" id="videos"></button><button class="hotspot" id="phone"></button><button class="hotspot" id="mail"></button><button class="hotspot" id="compass"></button><button class="hotspot" id="music"></button><button id="home"></button>
</div><div id="overlay"><div id="app-window"></div></div><script>
const $=id=>document.getElementById(id), overlay=$('overlay'), win=$('app-window');
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const state={messages:read('pearMessages',[]),notes:read('pearNotes',[]),photos:read('pearPhotos',[]),posts:read('pearPosts',[{user:'Chloe',text:'pear phone day 🍐✨',likes:24,comments:5},{user:'Sam',text:'who put this app on my phone 😭',likes:17,comments:2},{user:'Cat',text:'I FOUND A BUTTON!!! 💕',likes:41,comments:9}]),calls:read('pearCalls',[]),stocks:read('pearStocks',['PEAR','APL','NFLX','NICK','GOOG']),settings:read('pearSettings',{dark:false,large:false,sound:true})};
function toast(m){let t=$('pearToast');if(!t){t=document.createElement('div');t.id='pearToast';Object.assign(t.style,{position:'fixed',left:'50%',bottom:'25px',transform:'translateX(-50%)',background:'#171717',color:'#fff',padding:'10px 16px',borderRadius:'999px',zIndex:99999}) ;document.body.appendChild(t)}t.textContent=m;t.style.opacity=1;clearTimeout(t.x);t.x=setTimeout(()=>t.style.opacity=0,1800)}
function closeApp(){overlay.classList.remove('open');win.innerHTML=''}
function openApp(title,body,init){win.innerHTML=`<div class="window-header"><button class="back" id="back">‹</button><div style="flex:1">${esc(title)}</div><button class="button" id="close">×</button></div><div class="window-body">${body}</div>`;overlay.classList.add('open');$('back').onclick=closeApp;$('close').onclick=closeApp;if(init)init()}
function openMessages(){if(!state.messages.length){state.messages=[{who:'Chloe',me:false,text:'heyyy 😭 what are you doing?',time:now()},{who:'You',me:true,text:'nothing lol what about you',time:now()}];save('pearMessages',state.messages)}openApp('Messages',`<div class="row"><button class="button" id="ch">Chloe</button><button class="button" id="sam">Sam</button><button class="button" id="cat">Cat</button></div><div id="ml"></div><div style="display:flex;gap:7px;position:sticky;bottom:0;background:#f4f5f7;padding-top:8px"><input id="mi" placeholder="iMessage" style="flex:1"><button class="button" id="send">Send</button></div><p class="small">Try “tell me a joke”, “surprise me”, or “send emoji”.</p>`,()=>{const draw=()=>{$('ml').innerHTML=state.messages.map(m=>`<div><div class="small">${esc(m.who)} · ${esc(m.time)}</div><div class="bubble ${m.me?'me':''}">${esc(m.text)}</div></div>`).join('')};const send=()=>{let v=$('mi').value.trim();if(!v)return;state.messages.push({who:'You',me:true,text:v,time:now()});$('mi').value='';save('pearMessages',state.messages);draw();setTimeout(()=>{let l=v.toLowerCase(),r=l.includes('joke')?'Why did the Pear Phone need glasses? It lost its contacts. 🍐🤓':l.includes('surprise')?'SURPRISE! You unlocked absolutely nothing 😂':l.includes('emoji')?'🍐📱✨😭💅':l.includes('hi')?'heyyyy!! 👋':'LOL 😭 wait WHAT';state.messages.push({who:'Chloe',me:false,text:r,time:now()});save('pearMessages',state.messages);draw()},500)};$('send').onclick=send;$('mi').onkeydown=e=>{if(e.key==='Enter')send()};['ch','sam','cat'].forEach(id=>$(id).onclick=()=>toast('Opened chat 💬'));draw()})}
function openCamera(){openApp('Camera',`<video id="cam" autoplay playsinline muted style="width:100%;min-height:260px;background:#111;border-radius:18px;object-fit:cover"></video><div class="row" style="justify-content:center;margin:10px"><button class="button" id="snap">📸 Take Photo</button><button class="button" id="flip">↔ Flip</button></div><div id="cs" class="small" style="text-align:center">Starting camera…</div>`,async()=>{let stream=null,f='environment';const start=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f},audio:false});$('cam').srcObject=stream;$('cs').textContent='Camera ready 📸'}catch{$('cs').textContent='Camera unavailable. Use Photos → Import instead.'}};$('flip').onclick=()=>{f=f==='environment'?'user':'environment';start()};$('snap').onclick=()=>{let v=$('cam');if(!v.videoWidth)return toast('Camera not ready');let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);state.photos.unshift({src:c.toDataURL('image/jpeg',.9),name:'Pear Photo '+(state.photos.length+1),date:new Date().toLocaleDateString()});save('pearPhotos',state.photos);toast('Photo saved 📸')};start()})}
function openPhotos(){openApp('Photos',`<div class="row" style="justify-content:space-between"><b>Camera Roll (${state.photos.length})</b><label class="button">Import<input id="pi" type="file" accept="image/*" multiple hidden></label></div><div class="photos" id="pg" style="margin-top:10px"></div>`,()=>{const render=()=>{$('pg').innerHTML=state.photos.length?state.photos.map((p,i)=>`<button class="pc" data-i="${i}" style="border:0;background:none;padding:0"><img src="${p.src}"></button>`).join(''):'<div style="grid-column:1/-1;text-align:center;padding:30px;color:#777">No photos yet 📸</div>';document.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{let p=state.photos[+b.dataset.i];openApp('Photo',`<img src="${p.src}" style="max-width:100%;max-height:75vh;border-radius:16px"><p>${esc(p.name||'Photo')}</p>`)})};$('pi').onchange=e=>[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{state.photos.unshift({src:r.result,name:f.name,date:new Date().toLocaleDateString()});save('pearPhotos',state.photos);render()};r.readAsDataURL(f)});render()})}
function openSplashFace(){openApp('SplashFace',`<div class="row"><button class="button" id="feed">Feed</button><button class="button" id="friends">Friends</button><button class="button" id="profile">Profile</button></div><div id="sp" style="margin-top:10px"></div>`,()=>{const c=$('sp');const feed=()=>{c.innerHTML=`<textarea id="pt" placeholder="What's happening?"></textarea><button class="button" id="post">Post ✨</button>`+state.posts.map((p,i)=>`<div class="card"><b>${esc(p.user)}</b><p>${esc(p.text)}</p><button class="button like" data-i="${i}">♥ ${p.likes}</button> <button class="button com" data-i="${i}">💬 ${p.comments}</button></div>`).join('');$('post').onclick=()=>{let t=$('pt').value.trim();if(t){state.posts.unshift({user:'You',text:t,likes:0,comments:0});save('pearPosts',state.posts);feed()}};document.querySelectorAll('.like').forEach(b=>b.onclick=()=>{state.posts[+b.dataset.i].likes++;save('pearPosts',state.posts);feed()});document.querySelectorAll('.com').forEach(b=>b.onclick=()=>{let x=prompt('Comment?');if(x){state.posts[+b.dataset.i].comments++;save('pearPosts',state.posts);feed()}})};$('feed').onclick=feed;$('friends').onclick=()=>c.innerHTML=['Sam Puckett','Cat Valentine','Robbie Shapiro','Chloe James'].map(n=>`<div class="card"><b>${n}</b><button class="button" onclick="toast('Friend request sent!')">Add</button></div>`).join('');$('profile').onclick=()=>c.innerHTML='<div class="card" style="text-align:center;font-size:20px">🍐<h2>You</h2>128 friends · 420 pear points</div>';feed()})}
function openStocks(){let prices={PEAR:42.18,APL:235.61,NFLX:117.03,NICK:82.44,GOOG:291.12};openApp('Stocks',`<div class="row"><input id="ticker" placeholder="Ticker e.g. PEAR" style="flex:1"><button class="button" id="add">Add</button></div><div id="sl" style="margin-top:10px"></div>`,()=>{const render=()=>{$('sl').innerHTML=state.stocks.map(s=>`<div class="stock"><b>${esc(s)}</b><span>$${(prices[s]??99).toFixed(2)}<br><small>+${((s.charCodeAt(0)%7)/2).toFixed(2)}%</small></span></div>`).join('')};$('add').onclick=()=>{let s=$('ticker').value.trim().toUpperCase();if(s&&!state.stocks.includes(s)){state.stocks.unshift(s);save('pearStocks',state.stocks);$('ticker').value='';render()}};render()})}
function openMaps(){openApp('Maps',`<div class="row"><input id="place" placeholder="Search a place" style="flex:1"><button class="button" id="go">Go</button></div><div id="mr" style="margin-top:10px"><div class="map">🗺️</div></div><button class="button" id="route">Plan Route</button>`,()=>{$('go').onclick=()=>{let q=$('place').value.trim();$('mr').innerHTML=q?`<div class="card"><b>${esc(q)}</b><div class="map">📍</div><button class="button" onclick="toast('Saved ⭐')">☆ Favorite</button></div>`:'<div class="map">🗺️</div>'};$('route').onclick=()=>toast('Route planned! 🚗')})}
function openWeather(){openApp('Weather',`<div class="card" style="text-align:center"><div style="font-size:70px">☀️</div><div style="font-size:44px;font-weight:800">23°</div><b>Pear City</b><p>Sunny · Feels like 25°</p></div><h3>Forecast</h3>${[['Today','☀️','23°'],['Sat','🌤️','22°'],['Sun','🌧️','18°'],['Mon','☀️','24°']].map(x=>`<div class="card" style="display:flex;justify-content:space-between"><b>${x[0]}</b><span>${x[1]}</span><b>${x[2]}</b></div>`).join('')}<button class="button" onclick="toast('Forecast refreshed!')">↻ Refresh</button>`)}
function openNotes(){openApp('Notes',`<div class="row"><input id="ns" placeholder="Search notes" style="flex:1"><button class="button" id="new">＋ New</button></div><div id="nl" style="margin-top:10px"></div>`,()=>{const render=()=>{$('nl').innerHTML=state.notes.map(n=>`<button class="card note" data-id="${n.id}" style="display:block;width:100%;text-align:left"><b>${esc(n.title||'Untitled')}</b><div class="small">${esc(n.text)}</div></button>`).join('')||'<div class="small">No notes yet.</div>';document.querySelectorAll('.note').forEach(b=>b.onclick=()=>edit(b.dataset.id))};function edit(id){let n=state.notes.find(x=>String(x.id)===String(id));openApp('Edit Note',`<input id="nt" value="${esc(n.title)}" style="width:100%"><textarea id="nx">${esc(n.text)}</textarea><button class="button" id="save">Save</button><button class="button" id="del">Delete</button>`,()=>{$('save').onclick=()=>{n.title=$('nt').value;n.text=$('nx').value;save('pearNotes',state.notes);openNotes()};$('del').onclick=()=>{state.notes=state.notes.filter(x=>x!==n);save('pearNotes',state.notes);openNotes()}})}$('new').onclick=()=>{let n={id:Date.now(),title:'Untitled',text:''};state.notes.unshift(n);save('pearNotes',state.notes);edit(n.id)};$('ns').oninput=()=>render();render()})}
function openPearTunes(){openApp('PearTunes',`<div class="card" style="text-align:center"><div style="font-size:65px">🎵</div><h2 id="song">Nothing Playing</h2><button class="button" id="demo">▶ Demo Beat</button><button class="button" id="stop">■ Stop</button></div><label class="button">Add Audio<input id="af" type="file" accept="audio/*" multiple hidden></label><div id="tracks"></div>`,()=>{let ctx,osc;$('demo').onclick=()=>{try{ctx=new AudioContext;osc=ctx.createOscillator();let g=ctx.createGain();osc.frequency.value=440;g.gain.value=.06;osc.connect(g);g.connect(ctx.destination);osc.start();$('song').textContent='Pear Demo Beat 🎶';toast('Playing')}catch{toast('Audio unavailable')}};$('stop').onclick=()=>{try{osc?.stop();ctx?.close()}catch{}$('song').textContent='Nothing Playing'};$('af').onchange=e=>$('tracks').innerHTML=[...e.target.files].map(f=>`<div class="card"><b>${esc(f.name)}</b><audio controls src="${URL.createObjectURL(f)}"></audio></div>`).join('')})}
function openSettings(){let s=state.settings;openApp('Settings',`<div style="display:grid;gap:8px"><label class="setting">Dark Mode <input id="dark" type="checkbox" ${s.dark?'checked':''}></label><label class="setting">Large Text <input id="large" type="checkbox" ${s.large?'checked':''}></label><label class="setting">Sound Effects <input id="sound" type="checkbox" ${s.sound!==false?'checked':''}></label></div><hr><button class="button" id="reset">Reset Data</button>`,()=>{$('dark').onchange=e=>{s.dark=e.target.checked;save('pearSettings',s);document.body.style.background=s.dark?'#111':'#fff'};$('large').onchange=e=>{s.large=e.target.checked;save('pearSettings',s);document.documentElement.style.fontSize=s.large?'18px':''};$('sound').onchange=e=>{s.sound=e.target.checked;save('pearSettings',s)};$('reset').onclick=()=>{if(confirm('Reset Pear Phone data?')){localStorage.clear();location.reload()}}})}
function openClock(){openApp('Clock',`<div class="row"><button class="button" id="ct">Clock</button><button class="button" id="tt">Timer</button><button class="button" id="st">Stopwatch</button></div><div id="cp" style="margin-top:10px"></div>`,()=>{$('ct').onclick=clock;$('tt').onclick=timer;$('st').onclick=stop;clock()})}let ci;function clock(){clearInterval(ci);$('cp').innerHTML='<div class="card" style="text-align:center"><div id="big" style="font-size:46px;font-weight:800"></div></div>';const t=()=>{$('big').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})};t();ci=setInterval(t,500)}function timer(){clearInterval(ci);let x=60,id;$('cp').innerHTML='<div class="card" style="text-align:center"><div id="td" style="font-size:50px">01:00</div><button class="button" id="ts">Start</button><button class="button" id="tr">Reset</button></div>';const d=()=>$('td').textContent=`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;d();$('ts').onclick=()=>{if(id){clearInterval(id);id=null;$('ts').textContent='Start'}else{id=setInterval(()=>{x--;d();if(x<=0){clearInterval(id);id=null;toast('Timer finished! ⏰')}},1000);$('ts').textContent='Pause'}};$('tr').onclick=()=>{clearInterval(id);id=null;x=60;d()}}function stop(){clearInterval(ci);let x=0,id;$('cp').innerHTML='<div class="card" style="text-align:center"><div id="sw" style="font-size:50px">00:00.00</div><button class="button" id="ss">Start</button><button class="button" id="sr">Reset</button></div>';const d=()=>$('sw').textContent=`${String(Math.floor(x/60000)).padStart(2,'0')}:${String(Math.floor(x/1000)%60).padStart(2,'0')}.${String(Math.floor(x%1000/10)).padStart(2,'0')}`;$('ss').onclick=()=>{if(id){clearInterval(id);id=null;$('ss').textContent='Start'}else{let s=Date.now()-x;id=setInterval(()=>{x=Date.now()-s;d()},30);$('ss').textContent='Stop'}};$('sr').onclick=()=>{clearInterval(id);id=null;x=0;d()};d()}
function openPhone(){let keys=['1','2','3','4','5','6','7','8','9','*','0','#'];openApp('Phone',`<input id="dial" readonly style="width:100%;font-size:28px;text-align:center"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">${keys.map(k=>`<button class="button key" data-k="${k}">${k}</button>`).join('')}</div><button class="button" id="call" style="width:100%;margin-top:8px">📞 Call</button><h3>Recents</h3><div id="rc"></div>`,()=>{let n='';document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{$('dial').value+=b.dataset.k;n=$('dial').value});const draw=()=>{$('rc').innerHTML=state.calls.map(c=>`<div class="card">📞 ${esc(c.number)} <span class="small">${esc(c.time)}</span></div>`).join('')||'<div class="small">No recent calls.</div>'};$('call').onclick=()=>{if(!n)return toast('Enter a number');state.calls.unshift({number:n,time:now()});save('pearCalls',state.calls);toast('Calling '+n+'…');draw()};draw()})}
function openMail(){openApp('Mail',`<div class="row"><button class="button" id="in">Inbox</button><button class="button" id="co">Compose</button></div><div id="mp" style="margin-top:10px"></div>`,()=>{let mail=[['Pear Support','Welcome to Pear Mail','Your Pear Phone is ready! 🍐'],['Chloe','RE: pear phone','why does your phone have 900 buttons 😭'],['PearTunes','Playlist ideas','Add your favourite songs.']];const inbox=()=>{$('mp').innerHTML=mail.map((m,i)=>`<button class="card" data-i="${i}" style="display:block;width:100%;text-align:left"><b>${m[0]}</b><div>${m[1]}</div><div class="small">${m[2]}</div></button>`).join('');document.querySelectorAll('#mp .card').forEach(b=>b.onclick=()=>{let m=mail[+b.dataset.i];openApp(m[1],`<b>From:</b> ${esc(m[0])}<hr><p>${esc(m[2])}</p><button class="button" onclick="toast('Reply opened ✉️')">Reply</button>`)})};$('in').onclick=inbox;$('co').onclick=()=>{$('mp').innerHTML='<input placeholder="To" style="width:100%"><input placeholder="Subject" style="width:100%;margin-top:7px"><textarea placeholder="Message" style="margin-top:7px"></textarea><button class="button" id="sendm">Send ✉️</button>';$('sendm').onclick=()=>{toast('Email sent!');inbox()}};inbox()})}
function openCompass(){openApp('Compass',`<div class="card" style="text-align:center"><div style="font-size:110px">🧭</div><h2 id="deg">0°</h2><button class="button" id="enable">Enable Compass</button></div>`,()=>{$('enable').onclick=async()=>{try{if(DeviceOrientationEvent.requestPermission){let r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0}window.addEventListener('deviceorientation',e=>{let h=e.webkitCompassHeading??(360-(e.alpha||0));$('deg').textContent=Math.round(h)+'°'});toast('Compass enabled')}catch{toast('Compass permission unavailable')}}})}
function openVideos(){openApp('Videos',`<label class="button">Import Videos<input id="vi" type="file" accept="video/*" multiple hidden></label><div id="vl" style="margin-top:10px"></div>`,()=>{$('vi').onchange=e=>$('vl').innerHTML=[...e.target.files].map(f=>`<div class="card"><b>${esc(f.name)}</b><video controls playsinline src="${URL.createObjectURL(f)}" style="width:100%;margin-top:7px;border-radius:12px"></video></div>`).join('')})}
const actions={messages:openMessages,camera:openCamera,splashface:openSplashFace,stocks:openStocks,maps:openMaps,photos:openPhotos,weather:openWeather,notes:openNotes,peartunes:openPearTunes,settings:openSettings,clock:openClock,videos:openVideos,phone:openPhone,mail:openMail,compass:openCompass,music:openPearTunes};
Object.entries(actions).forEach(([id,fn])=>{const e=$(id);if(e)e.onclick=x=>{x.preventDefault();x.stopPropagation();fn()}});$('home').onclick=e=>{e.preventDefault();closeApp()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp()});
if(state.settings.dark)document.body.style.background='#111';if(state.settings.large)document.documentElement.style.fontSize='18px';setTimeout(()=>toast('Tap an app icon to open it 🍐'),700);

</script></body></html>
