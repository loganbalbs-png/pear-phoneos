<!DOCTYPE html>

<title>Pear Phone OS</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* =========================================================
   PEAR PHONE
   ========================================================= */

#phone-container {
  position: relative;

  width: min(170vh, 1500px);
  aspect-ratio: 1212 / 1188;

  transform: rotate(90deg);

  background-image: url("pear-phone.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;

  touch-action: none;
  user-select: none;
}

/* =========================================================
   PAGE 2
   ========================================================= */

#page2 {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  background-image: url("page2.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;

  z-index: 50;

  pointer-events: none;

  opacity: 0;

  transform: translateY(100%) scale(.96);

  transition:
    transform .45s cubic-bezier(.22,.8,.25,1),
    opacity .30s ease;
}

#phone-container.page-two #page2 {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* =========================================================
   HOTSPOTS
   ========================================================= */

.hotspot {
  position: absolute;

  border: none;
  background: transparent;

  padding: 0;
  margin: 0;

  cursor: pointer;

  z-index: 200;

  touch-action: manipulation;

  outline: none;

  -webkit-tap-highlight-color: transparent;
}

/*
   Invisible hover feedback.
   The actual Pear icons underneath remain untouched.
*/

.hotspot:active {
  transform: scale(.94);
}

/* =========================================================
   APP WINDOW
   ========================================================= */

#overlay {
  position: absolute;

  left: 31%;
  top: 22%;

  width: 38%;
  height: 47%;

  background: #f2f2f7;

  z-index: 500;

  display: none;

  overflow: hidden;

  border-radius: 9px;

  box-shadow:
    0 4px 18px rgba(0,0,0,.5);

  color: #111;
}

#overlay.open {
  display: block;

  animation: appOpen .22s ease-out;
}

@keyframes appOpen {
  from {
    opacity: 0;
    transform: scale(.82);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

#app-window {
  width: 100%;
  height: 100%;

  overflow-y: auto;
  overflow-x: hidden;

  background: #f2f2f7;

  color: #111;

  -webkit-overflow-scrolling: touch;
}

#app-window.keyboard-open {
  padding-bottom: 0;
}

/* =========================================================
   APP UI
   ========================================================= */

.app-page {
  width: 100%;
  min-height: 100%;

  background: #f2f2f7;
}

.app-header {
  position: sticky;
  top: 0;

  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 8px;

  background: rgba(245,245,247,.96);

  border-bottom: 1px solid #d1d1d6;

  z-index: 20;
}

.back-btn {
  position: absolute;
  left: 7px;

  width: 28px;
  height: 28px;

  border: 0;
  border-radius: 50%;

  background: #dddde2;

  font-size: 23px;
  line-height: 20px;

  cursor: pointer;
}

.app-content {
  padding: 12px;

  font-size: 12px;

  padding-bottom: 20px;
}

.app-content h1 {
  margin: 5px 0;
}

.app-content h2 {
  margin: 5px 0 8px;
}

.app-content p {
  line-height: 1.4;
}

/* Buttons */

.pear-btn {
  border: none;

  border-radius: 8px;

  padding: 8px 11px;

  margin: 3px;

  background: #d9d9de;

  color: #111;

  font-size: 11px;
  font-weight: bold;

  cursor: pointer;

  transition:
    transform .08s ease,
    background .1s ease;
}

.pear-btn:active {
  transform: scale(.92);
  background: #bbbcc2;
}

.pear-btn.wide {
  width: calc(100% - 6px);
}

.pear-btn.danger {
  background: #ffb5b5;
}

/* Inputs */

.app-content input,
.app-content textarea {
  width: 100%;

  border: 1px solid #c7c7cc;

  border-radius: 8px;

  padding: 8px;

  margin: 4px 0;

  background: white;

  color: #111;

  font-family: Arial, sans-serif;

  font-size: 12px;

  outline: none;
}

.app-content textarea {
  resize: none;
}

.app-content input:focus,
.app-content textarea:focus {
  border-color: #777;
}

/* =========================================================
   MESSAGES
   ========================================================= */

.message-card {
  display: flex;
  justify-content: space-between;

  padding: 9px;

  margin-bottom: 6px;

  background: white;

  border-radius: 9px;

  border: 1px solid #ddd;

  cursor: pointer;
}

.message-card p {
  margin: 3px 0 0;
}

.message-card small {
  color: #777;
}

.bubble {
  background: #dceeff;

  border-radius: 12px;

  padding: 8px;

  margin: 5px 0;

  max-width: 85%;
}

/* =========================================================
   CAMERA
   ========================================================= */

.camera-view {
  height: 150px;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #222,
      #555
    );

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  color: white;

  position: relative;
}

.camera-lens {
  font-size: 35px;
}

.camera-cross {
  position: absolute;

  font-size: 35px;

  opacity: .35;
}

.camera-controls {
  display: flex;

  justify-content: space-around;

  align-items: center;

  margin-top: 10px;
}

.circle-btn {
  width: 30px;
  height: 30px;

  border-radius: 50%;

  border: none;

  background: #ddd;

  cursor: pointer;
}

.shutter {
  width: 52px;
  height: 52px;

  border-radius: 50%;

  border: 5px solid #bbb;

  background: white;

  font-size: 0;

  cursor: pointer;
}

/* =========================================================
   SPLASHFACE
   ========================================================= */

.social-post {
  background: white;

  border-radius: 10px;

  padding: 8px;

  margin-bottom: 8px;

  border: 1px solid #ddd;
}

.social-avatar {
  display: inline-flex;

  width: 28px;
  height: 28px;

  border-radius: 50%;

  align-items: center;
  justify-content: center;

  background: #ddd;

  margin-right: 5px;
}

.fake-photo {
  height: 90px;

  border-radius: 8px;

  background: #dce9ff;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 40px;

  margin: 7px 0;
}

.like-btn {
  border: none;
  background: transparent;

  cursor: pointer;

  font-size: 12px;
}

/* =========================================================
   STOCKS
   ========================================================= */

.stock-main {
  text-align: center;
}

.stock-main h1 {
  font-size: 30px;
}

.up {
  color: #168a3d;
}

.stock-stats {
  display: flex;
  justify-content: space-between;

  background: white;

  border-radius: 8px;

  padding: 8px;

  margin-bottom: 8px;
}

.stock-stats div {
  text-align: center;
}

.stock-stats small,
.stock-stats strong {
  display: block;
}

#stock-chart {
  height: 70px;

  display: flex;

  align-items: end;

  gap: 3px;

  padding: 5px;

  background: white;

  border-radius: 8px;

  margin-top: 8px;
}

#stock-chart i {
  flex: 1;

  background: #3c9;

  border-radius: 2px;
}

/* =========================================================
   MAP
   ========================================================= */

.map-screen {
  height: 130px;

  background:
    linear-gradient(
      30deg,
      #cfe7bd 25%,
      #dce9cf 25%,
      #dce9cf 50%,
      #cfe7bd 50%,
      #cfe7bd 75%,
      #dce9cf 75%
    );

  background-size: 45px 45px;

  border-radius: 10px;

  position: relative;

  overflow: hidden;
}

.map-road {
  position: absolute;

  width: 150%;
  height: 12px;

  background: white;

  transform: rotate(25deg);

  top: 50px;
  left: -20px;
}

.map-road.road2 {
  transform: rotate(-40deg);

  top: 85px;
}

.map-pin {
  position: absolute;

  top: 45px;
  left: 50%;

  font-size: 25px;
}

/* =========================================================
   PHOTOS
   ========================================================= */

.photo-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 5px;
}

.photo-item {
  aspect-ratio: 1;

  background: #ddd;

  border-radius: 7px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 30px;

  cursor: pointer;
}

/* =========================================================
   WEATHER
   ========================================================= */

.weather-big {
  text-align: center;

  padding: 10px;
}

.weather-icon {
  font-size: 42px;
}

.weather-big h1 {
  font-size: 35px;
}

.forecast {
  display: flex;

  justify-content: space-between;

  background: white;

  padding: 8px;

  border-radius: 8px;
}

.forecast div {
  text-align: center;
}

.forecast span,
.forecast small {
  display: block;

  margin-top: 4px;
}

/* =========================================================
   NOTES
   ========================================================= */

.note-card {
  background: white;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 8px;

  margin-top: 6px;

  cursor: pointer;
}

.note-card p {
  margin: 3px 0;

  color: #666;
}

/* =========================================================
   MUSIC
   ========================================================= */

.album-art {
  height: 110px;

  background: linear-gradient(
    135deg,
    #111,
    #888
  );

  border-radius: 10px;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 55px;

  color: white;
}

.music-progress {
  height: 5px;

  background: #ccc;

  border-radius: 5px;

  margin: 10px 0;
}

#music-bar {
  width: 42%;

  height: 100%;

  background: #111;

  border-radius: 5px;
}

.music-controls {
  text-align: center;
}

.song {
  background: white;

  padding: 8px;

  border-radius: 7px;

  margin-top: 4px;

  cursor: pointer;
}

/* =========================================================
   CLOCK
   ========================================================= */

.clock-big {
  text-align: center;

  font-size: 29px;

  font-weight: bold;

  margin-top: 12px;
}

#live-date {
  text-align: center;

  color: #666;
}

.stopwatch {
  font-size: 25px;

  text-align: center;

  margin: 10px;
}

/* =========================================================
   VIDEOS
   ========================================================= */

.video-player {
  height: 130px;

  background: #111;

  border-radius: 9px;

  display: flex;

  justify-content: center;
  align-items: center;
}

#video-screen {
  font-size: 55px;

  transition: transform .3s ease;
}

/* =========================================================
   PHONE
   ========================================================= */

.dial-number {
  height: 32px;

  text-align: center;

  font-size: 20px;

  margin-bottom: 5px;
}

.dialer {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 5px;
}

.dialer button {
  height: 32px;

  border: none;

  border-radius: 50%;

  background: #ddd;

  cursor: pointer;
}

.call-btn {
  width: 100%;

  border: none;

  background: #43b95d;

  color: white;

  padding: 9px;

  border-radius: 9px;

  margin: 7px 0;

  cursor: pointer;
}

/* =========================================================
   MAIL
   ========================================================= */

.mail-card {
  background: white;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 8px;

  margin-bottom: 5px;

  cursor: pointer;
}

.mail-card b,
.mail-card p {
  display: block;

  margin: 3px 0;
}

/* =========================================================
   COMPASS
   ========================================================= */

.compass {
  display: flex;

  justify-content: center;

  margin: 5px;
}

.compass-ring {
  width: 130px;
  height: 130px;

  border: 5px solid #222;

  border-radius: 50%;

  position: relative;

  background: white;
}

.compass-ring span {
  position: absolute;

  font-weight: bold;
}

.north {
  top: 5px;
  left: 50%;
}

.east {
  right: 7px;
  top: 48%;
}

.south {
  bottom: 5px;
  left: 48%;
}

.west {
  left: 7px;
  top: 48%;
}

.needle {
  position: absolute;

  width: 3px;
  height: 85px;

  background: red;

  left: 50%;
  top: 20px;

  transform-origin: center;
}

/* =========================================================
   LINGO
   ========================================================= */

#lingo-result {
  font-weight: bold;

  text-align: center;
}

/* =========================================================
   THUMBS UP
   ========================================================= */

.thumb-score {
  text-align: center;

  font-size: 18px;

  margin: 8px;
}

.giant-thumb {
  display: block;

  width: 100px;
  height: 100px;

  margin: 15px auto;

  border: none;

  border-radius: 50%;

  background: #ffe36e;

  font-size: 55px;

  cursor: pointer;

  transition: transform .08s;
}

.giant-thumb:active {
  transform: scale(.85);
}

/* =========================================================
   DANWARP
   ========================================================= */

.warp-box {
  height: 120px;

  display: flex;

  justify-content: center;
  align-items: center;

  background:
    linear-gradient(
      45deg,
      #111,
      #777,
      #eee,
      #222
    );

  color: white;

  font-size: 22px;
  font-weight: bold;

  border-radius: 10px;

  transition:
    transform .5s ease,
    border-radius .5s ease;
}

/* =========================================================
   IMAGE LAB
   ========================================================= */

.image-canvas {
  height: 120px;

  background: #ddd;

  border-radius: 9px;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  font-size: 45px;

  transition:
    transform .4s ease,
    filter .4s ease;
}

.image-canvas img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

/* =========================================================
   CHRONO
   ========================================================= */

.chrono-time {
  text-align: center;

  font-size: 38px;

  font-weight: bold;

  margin: 15px;
}

/* =========================================================
   MONKEY
   ========================================================= */

.monkey-arena {
  height: 150px;

  background: #d8f1cf;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 45px;

  cursor: pointer;

  transition: all .15s ease;
}

/* =========================================================
   REMARK
   ========================================================= */

.remark-card {
  background: white;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 8px;

  margin-top: 6px;
}

/* =========================================================
   DARK MODE
   ========================================================= */

.dark-app,
.dark-app .app-page,
.dark-app .app-content {
  background: #1c1c1e;

  color: white;
}

.dark-app .app-header {
  background: rgba(30,30,32,.96);

  color: white;

  border-color: #444;
}

.dark-app input,
.dark-app textarea,
.dark-app .message-card,
.dark-app .note-card,
.dark-app .mail-card,
.dark-app .song,
.dark-app .stock-stats,
.dark-app .forecast {
  background: #2c2c2e;

  color: white;

  border-color: #555;
}

/* =========================================================
   SMALL KEYBOARD
   ========================================================= */

#pear-keyboard {
  position: absolute;

  left: 4%;
  right: 4%;
  bottom: 3%;

  width: 92%;

  padding: 7px;

  background: rgba(35,35,40,.97);

  border-radius: 12px;

  z-index: 1000;

  display: none;

  box-shadow:
    0 5px 20px rgba(0,0,0,.55);

  transform: translateY(120%);

  opacity: 0;

  transition:
    transform .28s cubic-bezier(.22,.8,.25,1),
    opacity .2s ease;

  touch-action: manipulation;
}

#pear-keyboard.keyboard-show {
  transform: translateY(0);

  opacity: 1;
}

.pear-keyboard-row {
  display: flex;

  justify-content: center;

  gap: 4px;

  margin-bottom: 4px;
}

.pear-keyboard-row button {
  flex: 1;

  min-width: 0;

  height: 32px;

  border: 0;

  border-radius: 6px;

  background: #f5f5f7;

  color: #111;

  font-size: 12px;

  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;

  transition:
    transform .08s ease,
    background .08s ease;
}

.pear-keyboard-row button:active {
  transform: scale(.88);

  background: #cfcfd4;
}

.pear-keyboard-row.bottom button:first-child {
  flex: 1.3;
}

.pear-keyboard-row.bottom button:nth-child(2) {
  flex: 5;
}

.pear-keyboard-row.bottom button:last-child {
  flex: 1.3;
}

/* =========================================================
   PAGE DOTS
   ========================================================= */

#page-dots {
  position: absolute;

  left: 50%;
  bottom: 2.5%;

  transform: translateX(-50%);

  z-index: 450;

  color: rgba(255,255,255,.8);

  font-size: 10px;

  pointer-events: none;
}

/* =========================================================
   TOAST
   ========================================================= */

#pear-toast {
  pointer-events: none;
}

/* =========================================================
   MOBILE / SMALL SCREEN
   ========================================================= */

@media (max-width: 700px) {

  #phone-container {
    width: 135vw;
  }
