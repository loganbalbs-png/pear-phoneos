<!doctype html>
<html lang="en">
<head>

<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

/* =========================================================
   PEAR PHONE
   ========================================================= */

#phone{
  position:relative;

  /*
    BIG AGAIN.
    The phone is rotated, so the size is based on both
    viewport dimensions instead of being artificially scaled down.
  */
  width:min(94vw,94vh,920px);
  aspect-ratio:1212 / 1188;

  background:
    url("pear-phone.jpg") center/contain no-repeat;

  transform:rotate(90deg);
  transform-origin:center center;

  touch-action:none;
  user-select:none;
}

/* =========================================================
   HOME PAGE LAYERS
   ========================================================= */

.page{
  position:absolute;
  inset:0;

  transition:
    transform .46s cubic-bezier(.22,.8,.25,1),
    opacity .35s ease;

  will-change:transform,opacity;
}

#page1{
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

#page2{
  transform:translateY(100%) scale(.94);
  opacity:0;
  pointer-events:none;

  /*
    Your exact second-page image.
    Keep page2.png beside index.html.
  */
  background:url("page2.png") center/contain no-repeat;
}

#phone.page-two #page1{
  transform:translateY(-100%) scale(.94);
  opacity:0;
  pointer-events:none;
}

#phone.page-two #page2{
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

#phone.page-one #page1{
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

#phone.page-one #page2{
  transform:translateY(100%) scale(.94);
  opacity:0;
  pointer-events:none;
}

/* =========================================================

   ========================================================= */

  background:transparent;
  padding:0;
  margin:0;

  border-radius:50%;

  z-index:20;

  cursor:pointer;
  touch-action:manipulation;

  -webkit-appearance:none;
  appearance:none;
}

.hotspot:active{
  background:rgba(255,255,255,.08);
  transform:scale(.92);
}

/* =========================================================
   HOME BUTTON
   ========================================================= */

#home{
  position:absolute;

  left:46%;
  top:78.8%;

  width:8.2%;
  aspect-ratio:1;

  border:0;
  background:transparent;
  border-radius:50%;

  cursor:pointer;
  z-index:80;
}

/* =========================================================
   APP WINDOW
   IMPORTANT:
   PHONE = ROTATED 90°
   APP = ROTATED BACK -90°
   ========================================================= */

#overlay{
  position:absolute;

  left:18%;
  top:18%;

  width:64%;
  height:64%;

  z-index:300;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.38);

  border-radius:22px;

  overflow:hidden;

  /*
    This is the key fix.
    The phone rotates +90°.
    The app rotates -90° so it is upright.
  */
  transform:rotate(-90deg);
  transform-origin:center center;
}

#overlay.open{
  display:flex;
}

/* =========================================================
   APP WINDOW
   ========================================================= */

#app{
  width:94%;
  height:94%;

  background:#f4f5f7;
  color:#111;

  border:2px solid #333;
  border-radius:17px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  animation:appOpen .22s ease-out;
}

@keyframes appOpen{
  from{
    opacity:0;
    transform:scale(.88);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================================================
   APP HEADER
   ========================================================= */

.head{
  height:44px;
  flex:none;

  display:flex;
  align-items:center;
  gap:8px;

  padding:5px 8px;

  background:
    linear-gradient(#fff,#e5e5e5);

  border-bottom:1px solid #bbb;

  font-weight:900;
  font-size:16px;
}

.head button{
  width:31px;
  height:31px;

  border-radius:50%;

  border:1px solid #aaa;

  background:
    linear-gradient(#fff,#ddd);

  font-size:20px;

  cursor:pointer;
}

/* =========================================================
   APP CONTENT
   ========================================================= */

.body{
  flex:1;

  overflow:auto;

  padding:10px;

  -webkit-overflow-scrolling:touch;
}

.body button{
  border:1px solid #aaa;

  border-radius:9px;

  background:
    linear-gradient(#fff,#ddd);

  padding:8px;

  font-weight:700;

  cursor:pointer;
}

.body button:active{
  transform:scale(.96);
}

.body input,
.body textarea{
  font-size:16px;

  padding:8px;

  border:1px solid #aaa;

  border-radius:9px;

  outline:none;

  font-family:Arial,sans-serif;
}

.body textarea{
  width:100%;
  min-height:110px;
  resize:none;
}

.row{
  display:flex;
  gap:6px;
}

.bubble{
  background:#ddd;

  border-radius:15px;

  padding:8px 10px;

  margin-bottom:6px;

  width:max-content;
  max-width:85%;
}

.me{
  margin-left:auto;

  background:#168ee8;

  color:#fff;
}

.photos{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:5px;
}

.photos img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  border-radius:7px;
}

.video{
  width:100%;

  background:#000;

  border-radius:10px;

  display:block;
}

.stock{
  display:flex;

  justify-content:space-between;

  align-items:center;

  background:#fff;

  border:1px solid #ddd;

  border-radius:9px;

  padding:8px;

  margin-bottom:5px;
}

.big{
  text-align:center;

  font-size:42px;

  font-weight:900;

  padding:20px;
}

.map{
  height:150px;

  display:grid;

  place-items:center;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #d8e8ca,
      #e8dfb5
    );

  font-size:45px;
}

/* =========================================================
   CUSTOM KEYBOARD
   It is also rotated back upright.
   ========================================================= */

#keyboard{
  position:absolute;

  /*
    Narrow/tall in the phone's rotated coordinate system.
    After -90deg it becomes a normal horizontal keyboard.
  */
  left:38%;
  top:25%;

  width:24%;
  height:52%;

  z-index:500;

  display:none;

  grid-template-columns:repeat(10,1fr);

  gap:3px;

  padding:6px;

  background:rgba(32,35,41,.96);

  border-radius:13px;

  transform:
    rotate(-90deg)
    translateZ(0);

  transform-origin:center center;

  transition:
    opacity .22s ease,
    transform .22s ease;

  opacity:0;
}

#keyboard.show{
  display:grid;

  opacity:1;

  transform:
    rotate(-90deg)
    translateZ(0);
}

#keyboard button{
  min-width:0;

  height:26px;

  border:0;

  border-radius:5px;

  font-size:9px;

  font-weight:800;

  background:#f5f5f5;

  color:#111;

  cursor:pointer;
}

#keyboard button:active{
  transform:scale(.9);
  background:#ccc;
}

#keyboard .space{
  grid-column:span 5;
}

#keyboard .wide{
  grid-column:span 2;
}

/* =========================================================
   CAMERA FLASH
   ========================================================= */

#flash{
  position:absolute;

  inset:0;

  z-index:600;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.95),
      rgba(38,125,255,.3),
      transparent 70%
    );
}

#flash.go{
  animation:flash .4s ease;
}

@keyframes flash{
  0%{
    opacity:0;
    transform:scale(.7);
  }

  35%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:scale(1.15);
  }
}

/* =========================================================
   SMALLER SCREENS
   Still stays zoomed in.
   ========================================================= */

@media(max-width:700px){
  #phone{
    width:min(96vw,96vh,820px);
  }
}

@media(max-height:650px){
  #phone{
    width:min(96vw,96vh,780px);
  }
}
</style>
</head>
