  right:4%;

  border-radius:12px;

  z-index:1000;

  box-shadow:

  transform:translateY(120%);

  opacity:0;

  transition:

    opacity .2s ease;

  touch-action:manipulation;
}


/* keyboard appears */

#pear-keyboard.keyboard-show{

  transform:translateY(0);

  opacity:1;

}


/* keyboard rows */

.pear-keyboard-row{

  display:flex;

  justify-content:center;

  gap:4px;

  margin-bottom:4px;

}


/* keyboard buttons */

.pear-keyboard-row button{

  flex:1;

  min-width:0;

  height:32px;

  border:0;

  border-radius:6px;

  background:#f5f5f7;

  color:#111;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;

  touch-action:manipulation;

  transition:
    transform .08s ease,
    background .08s ease;
}


/* button press animation */

.pear-keyboard-row button:active{

  transform:scale(.88);

  background:#cfcfd4;

}


/* bottom row */

.pear-keyboard-row.bottom button:first-child{

  flex:1.3;

}

.pear-keyboard-row.bottom button:nth-child(2){

  flex:5;

}

.pear-keyboard-row.bottom button:last-child{

  flex:1.3;

}


/* make sure keyboard stays above app */

#overlay #pear-keyboard{

  z-index:1000;

}


/* give app content room for keyboard */

#overlay.keyboard-open #app-window{

  padding-bottom:145px;

}


/* keyboard labels */

.pear-keyboard-row button{

  -webkit-tap-highlight-color:transparent;

  user-select:none;

<!-- =========================================================
     KEYBOARD SUPPORT
     ========================================================= -->

<script>

let pearKeyboardVisible = false;

let pearKeyboardShift = false;

let pearKeyboardNumbers = false;

let activeKeyboardField = null;


/* =========================================================
   SHOW KEYBOARD
========================================================= */

function showPearKeyboard(input){

  if(!input) return;

  activeKeyboardField = input;

  pearKeyboardVisible = true;

  let keyboard =
    document.getElementById("pear-keyboard");


  /* Create keyboard if it doesn't exist */

  if(!keyboard){

    keyboard =
      document.createElement("div");

    keyboard.id =
      "pear-keyboard";


    keyboard.innerHTML = `

      <div class="pear-keyboard-row">

        <button onpointerdown="pearKey(event,'Q')">Q</button>
        <button onpointerdown="pearKey(event,'W')">W</button>
        <button onpointerdown="pearKey(event,'E')">E</button>
        <button onpointerdown="pearKey(event,'R')">R</button>
        <button onpointerdown="pearKey(event,'T')">T</button>
        <button onpointerdown="pearKey(event,'Y')">Y</button>
        <button onpointerdown="pearKey(event,'U')">U</button>
        <button onpointerdown="pearKey(event,'I')">I</button>
        <button onpointerdown="pearKey(event,'O')">O</button>
        <button onpointerdown="pearKey(event,'P')">P</button>

      </div>


      <div class="pear-keyboard-row">

        <button onpointerdown="pearKey(event,'A')">A</button>
        <button onpointerdown="pearKey(event,'S')">S</button>
        <button onpointerdown="pearKey(event,'D')">D</button>
        <button onpointerdown="pearKey(event,'F')">F</button>
        <button onpointerdown="pearKey(event,'G')">G</button>
        <button onpointerdown="pearKey(event,'H')">H</button>
        <button onpointerdown="pearKey(event,'J')">J</button>
        <button onpointerdown="pearKey(event,'K')">K</button>
        <button onpointerdown="pearKey(event,'L')">L</button>

      </div>


      <div class="pear-keyboard-row">

        <button onpointerdown="pearKey(event,'Z')">Z</button>
        <button onpointerdown="pearKey(event,'X')">X</button>
        <button onpointerdown="pearKey(event,'C')">C</button>
        <button onpointerdown="pearKey(event,'V')">V</button>
        <button onpointerdown="pearKey(event,'B')">B</button>
        <button onpointerdown="pearKey(event,'N')">N</button>
        <button onpointerdown="pearKey(event,'M')">M</button>

      </div>


      <div class="pear-keyboard-row bottom">

        <button
          onpointerdown="pearShift(event)">
          ⇧
        </button>

        <button
          onpointerdown="pearSpace(event)">
          SPACE
        </button>

        <button
          onpointerdown="pearBackspace(event)">
          ⌫
        </button>

      </div>

    `;


    document
      .getElementById("overlay")
      .appendChild(keyboard);

  }


  keyboard.style.display =
    "block";


  document
    .getElementById("overlay")
    .classList
    .add("keyboard-open");


  requestAnimationFrame(() => {

    keyboard.classList.add(
      "keyboard-show"
    );

  });

}


/* =========================================================
   KEYBOARD INPUT
========================================================= */

function pearKey(event,key){

  event.preventDefault();

  const input =
    activeKeyboardField;

  if(!input) return;


  let character =
    pearKeyboardShift
      ? key.toUpperCase()
      : key.toLowerCase();


  const start =
    input.selectionStart ?? input.value.length;

  const end =
    input.selectionEnd ?? input.value.length;


  input.value =
    input.value.substring(0,start) +
    character +
    input.value.substring(end);


  input.selectionStart =
    input.selectionEnd =
      start + character.length;


  input.dispatchEvent(
    new Event("input",{bubbles:true})
  );


  if(pearKeyboardShift){

    pearKeyboardShift=false;

  }

}


/* =========================================================
   SPACE
========================================================= */

function pearSpace(event){

  event.preventDefault();

  const input =
    activeKeyboardField;

  if(!input) return;


  const start =
    input.selectionStart ?? input.value.length;

  const end =
    input.selectionEnd ?? input.value.length;


  input.value =
    input.value.substring(0,start) +
    " " +
    input.value.substring(end);


  input.selectionStart =
    input.selectionEnd =
      start + 1;


  input.dispatchEvent(
    new Event("input",{bubbles:true})
  );

}


/* =========================================================
   BACKSPACE
========================================================= */

function pearBackspace(event){

  event.preventDefault();

  const input =
    activeKeyboardField;

  if(!input) return;


  const start =
    input.selectionStart ?? input.value.length;

  const end =
    input.selectionEnd ?? input.value.length;


  if(start !== end){

    input.value =
      input.value.substring(0,start) +
      input.value.substring(end);

    input.selectionStart =
      input.selectionEnd =
        start;

  }

  else if(start > 0){

    input.value =
      input.value.substring(0,start-1) +
      input.value.substring(end);

    input.selectionStart =
      input.selectionEnd =
        start - 1;

  }


  input.dispatchEvent(
    new Event("input",{bubbles:true})
  );

}


/* =========================================================
   SHIFT
========================================================= */

function pearShift(event){

  event.preventDefault();

  pearKeyboardShift =
    !pearKeyboardShift;

}


/* =========================================================
   HIDE KEYBOARD
========================================================= */

function hidePearKeyboard(){

  pearKeyboardVisible=false;

  activeKeyboardField=null;


  const keyboard =
    document.getElementById(
      "pear-keyboard"
    );


  if(keyboard){

    keyboard.classList.remove(
      "keyboard-show"
    );

    setTimeout(() => {

      if(!pearKeyboardVisible){

        keyboard.style.display =
          "none";

      }

    },300);

  }


  const overlay =
    document.getElementById(
      "overlay"
    );


  if(overlay){

    overlay.classList.remove(
      "keyboard-open"
    );

  }

}


/* =========================================================
   AUTOMATICALLY SHOW KEYBOARD
   WHEN TEXT FIELD IS SELECTED
========================================================= */

document.addEventListener(
  "focusin",
  function(event){

    const element =
      event.target;


    if(
      element &&
      (
        element.tagName === "INPUT" ||
        element.tagName === "TEXTAREA"
      )
    ){

      setTimeout(() => {

        showPearKeyboard(element);

      },50);

    }

  }
);


/* =========================================================
   PREVENT KEYBOARD BUTTONS FROM STEALING FOCUS
========================================================= */

document.addEventListener(
  "pointerdown",
  function(event){

    if(
      event.target.closest(
        "#pear-keyboard button"
      )
    ){

      event.preventDefault();

    }

  },
  true
);

</script>
