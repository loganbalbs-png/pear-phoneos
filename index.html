<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #111;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================================
   PEAR PHONE
   ========================================================= */

#phone-container {

    position: relative;

    /* A LITTLE SMALLER THAN THE LAST VERSION */
    width: min(170vh, 1500px);

    height: auto;

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    /* KEEP PHONE SIDEWAYS */
    transform: rotate(90deg);

}


/* =========================================================
   INVISIBLE CLICKABLE APP BUTTONS
   ========================================================= */

.hotspot {

    position: absolute;

    display: block;

    border: none;

    outline: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    z-index: 200;

    /*
       Makes the whole icon area clickable
    */
    -webkit-tap-highlight-color: transparent;

}


/*
   Make clicking/touching the icons easy
*/

.hotspot::after {

    content: "";

    position: absolute;

    left: -12%;

    top: -12%;

    width: 124%;

    height: 124%;

    background: transparent;

}


/* =========================================================
   CLICK FEEDBACK
   ========================================================= */

.hotspot:active {

    transform: scale(.92);

}


/* =========================================================
   APP WINDOW
   ========================================================= */

#overlay {

    position: absolute;

    left: 31%;

    top: 22%;

    width: 38%;

    height: 47%;

    background: white;

    z-index: 500;

    display: none;

    overflow: hidden;

    border-radius: 8px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.45);

}


/* SHOW APP */

#overlay.open {

    display: block;

}


/* =========================================================
   APP
   ========================================================= */

#app {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

    overflow: hidden;

}


/* =========================================================
   APP HEADER
   ========================================================= */

#app-header {

    min-height: 38px;

    background: #eee;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 6px 9px;

    font-size: 14px;

    font-weight: bold;

    flex-shrink: 0;

}


#app-title {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

#close-app {

    border: none;

    background: #ff5f57;

    color: white;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    cursor: pointer;

    font-weight: bold;

    z-index: 600;

}


/* =========================================================
   APP CONTENT
   ========================================================= */

#app-content {

    flex: 1;

    overflow: auto;

    padding: 10px;

    font-size: 13px;

}


/* =========================================================
   APP BUTTONS
   ========================================================= */

button {

    cursor: pointer;

}


.app-button {

    border: none;

    border-radius: 7px;

    padding: 7px 10px;

    margin: 3px;

    background: #ddd;

    font-size: 12px;

}


.app-button:active {

    transform: scale(.95);

}


/* =========================================================
   INPUTS
   ========================================================= */

input,
textarea,
select {

    width: 100%;

    padding: 7px;

    margin: 4px 0;

    border: 1px solid #bbb;

    border-radius: 6px;

    font-family: inherit;

}


textarea {

    resize: vertical;

    min-height: 60px;

}


/* =========================================================
   CARDS
   ========================================================= */

.card {

    background: #f2f2f2;

    border-radius: 8px;

    padding: 9px;

    margin-bottom: 7px;

}


.small {

    font-size: 11px;

    opacity: .7;

}


/* =========================================================
   ROWS
   ========================================================= */

.row {

    display: flex;

    gap: 5px;

    align-items: center;

}


.row > * {

    flex: 1;

}


/* =========================================================
   CLICKABLE APP ICON POSITIONS
   ========================================================= */


/* Messages */

#messages {

    left: 43.1%;

    top: 25.7%;

    width: 10%;

    aspect-ratio: 1;

}


/* Camera */

#camera {

    left: 54%;

    top: 25.7%;

    width: 10%;

    aspect-ratio: 1;

}


/* SplashFace */

#splashface {

    left: 38%;

    top: 36.1%;

    width: 10%;

    aspect-ratio: 1;

}


/* Stocks */

#stocks {

    left: 47.5%;

    top: 36.1%;

    width: 10%;

    aspect-ratio: 1;

}


/* Maps */

#maps {

    left: 57%;

    top: 36.1%;

    width: 10%;

    aspect-ratio: 1;

}


/* Photos */

#photos {

    left: 38%;

    top: 46.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Weather */

#weather {

    left: 47.5%;

    top: 46.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Notes */

#notes {

    left: 57%;

    top: 46.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* PearTunes */

#peartunes {

    left: 32%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Settings */

#settings {

    left: 42%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Clock */

#clock {

    left: 52%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Videos */

#videos {

    left: 62%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Phone */

#phone {

    left: 32%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Mail */

#mail {

    left: 42%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Compass */

#compass {

    left: 52%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Music */

#music {

    left: 62%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Home */

#home {

    left: 46%;

    top: 78.8%;

    width: 9%;

    aspect-ratio: 1;

}


/* =========================================================
   PHONE SIZE
   ========================================================= */

@media (orientation: portrait) {

    #phone-container {

        width: min(170vh, 1500px);

        transform: rotate(90deg);

    }

}


@media (orientation: landscape) {

    #phone-container {

        width: min(170vh, 1500px);

        transform: rotate(90deg);

    }

}

</style>

</head>


<body>


<div id="phone-container">


    <!-- =====================================================

    <button
        class="hotspot"

        onclick="openApp('messages')"

    <button
        class="hotspot"
        id="maps"
        onclick="openApp('maps')"
        aria-label="Maps">
    </button>


    <button
        class="hotspot"
        id="photos"
        onclick="openApp('photos')"
        aria-label="Photos">
    </button>


    <button
        class="hotspot"
        id="weather"
        onclick="openApp('weather')"
        aria-label="Weather">
    </button>


    <button
        class="hotspot"
        id="notes"
        onclick="openApp('notes')"
        aria-label="Notes">

    <button
        class="hotspot"

        onclick="openApp('peartunes')"

    <button
        class="hotspot"

        onclick="openApp('settings')"
        aria-label="Settings">
    </button>


    <button
        class="hotspot"
        id="clock"
        onclick="openApp('clock')"
        aria-label="Clock">
    </button>


    <button
        class="hotspot"
        id="videos"
        onclick="openApp('videos')"
        aria-label="Videos">
    </button>


    <button
        class="hotspot"
        id="phone"
        onclick="openApp('phone')"
        aria-label="Phone">
    </button>


    <button
        class="hotspot"
        id="mail"
        onclick="openApp('mail')"
        aria-label="Mail">
    </button>


    <button
        class="hotspot"
        id="compass"
        onclick="openApp('compass')"
        aria-label="Compass">
    </button>


    <button

    </button>


    <button

        onclick="closeApp()"
        aria-label="Home">
    </button>


    <!-- =====================================================
         APP WINDOW
         ===================================================== -->


    <div id="overlay">


        <div id="app">


            <div id="app-header">

                <span id="app-title">
                    Pear Phone
                </span>


                <button
                    id="close-app"
                    onclick="closeApp()"
                    aria-label="Close">
                    ×
                </button>

            </div>


            <div id="app-content"></div>


        </div>


    </div>


</div>


<!-- =========================================================
     INTERACTIVE APP JAVASCRIPT
     ========================================================= -->

<script src="app.js"></script>


</body>
</html>
