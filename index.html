/* =========================
   PEAR PHONE
========================= */

#phone-container{
  position:relative;

  width:min(170vh,1500px);

  aspect-ratio:1212 / 1188;

  background:url("pear-phone.png") center/contain no-repeat;

  transform:rotate(90deg);

  transform-origin:center center;

  touch-action:none;
  user-select:none;
}

   PAGE 2 IMAGE
========================= */

  position:absolute;
  inset:0;

  width:100%;

  background:url("page2.png") center/contain no-repeat;

  pointer-events:none;

  opacity:0;

  transform:translateY(100%) scale(.96);

  transition:
    transform .45s cubic-bezier(.22,.8,.25,1),
    opacity .3s ease;
}

#phone-container.page-two #page2{
  opacity:1;

  transform:translateY(0) scale(1);
}

========================= */

<!-- =========================================================
     PEAR PHONE FIXES
     These are intentionally AFTER app.js so they can override
     the broken Page 2 click behavior.
========================================================= -->

<script>

(function(){

  const phone =
    document.getElementById("phone-container");

  const overlay =
    document.getElementById("overlay");

  if(!phone)return;


  /*
    ============================================================
    PAGE 2 APP CONNECTIONS
    ============================================================

    These are the exact intended connections.
  */

  const page2Apps = {

    "p2-lingo":"lingoApp",

    "p2-splash":"splashfaceApp",

    "p2-thumb":"tumsApp",

    "p2-danwarp":"danwarpApp",

    "p2-image":"imageApp",

    "p2-chrono":"chronoApp",

    "p2-zaplook":"zaplookApp",

    "p2-weather":"weatherApp",

    "p2-music":"pearTunesApp",

    "p2-monkey":"monkeyApp",

    "p2-remark":"remarkApp",

    "p2-settings":"settingsApp",

    "p2-phone":"phoneApp",

    "p2-mail":"mailApp",

    "p2-compass":"compassApp",

    "p2-music2":"pearTunesApp"

  };


  /*
    PAGE 1 connections.
  */

  const page1Apps = {

    "messages":"messagesApp",

    "camera":"pearFixedCameraApp",

    "splashface":"splashfaceApp",

    "stocks":"stocksApp",

    "maps":"mapsApp",

    "photos":"photosApp",

    "weather":"weatherApp",

    "notes":"notesApp",

    "peartunes":"pearTunesApp",

    "settings":"settingsApp",

    "clock":"clockApp",

    "videos":"videosApp",

    "phone":"phoneApp",

    "mail":"mailApp",

    "compass":"compassApp",

    "music":"pearTunesApp"

  };


  /*
    ============================================================
    FIXED CAMERA
    ============================================================

    The original camera app was starting the camera immediately.
    This version ONLY requests camera permission after the user
    presses "Start Camera".
  */

  let pearCameraStream=null;

  let pearCameraFacing="user";


  window.pearFixedCameraApp=function(){

    if(typeof window.openApp!=="function"){
      return;
    }

    window.openApp(
      "Camera",
      `
      <div class="card">

        <h2>📷 Camera</h2>

        <video
          id="camera-video"
          class="camera-video"
          autoplay
          playsinline
          muted
        ></video>

        <div
          style="
            display:flex;
            gap:7px;
            flex-wrap:wrap;
            margin-top:8px;
          "
        >

          <button
            class="button"
            onclick="pearStartCamera()"
          >
            📷 Start Camera
          </button>

          <button
            class="button"
            onclick="pearCapturePhoto()"
          >
            ⭕ Take Photo
          </button>

          <button
            class="button"
            onclick="pearFlipCamera()"
          >
            🔄 Flip Camera
          </button>

        </div>

        <canvas
          id="camera-canvas"
          style="display:none"
        ></canvas>

        <div
          id="camera-photo"
          style="margin-top:10px"
        ></div>

      </div>
      `
    );

    /*
      IMPORTANT:
      There is intentionally NO pearStartCamera() here.
    */
  };


  window.pearStartCamera=async function(){

    const video=
      document.getElementById("camera-video");

    if(!video)return;


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      alert(
        "Camera access is not available in this browser."
      );

      return;
    }


    /*
      Stop an existing stream first.
    */

    pearStopCamera();


    try{

      pearCameraStream=
        await navigator.mediaDevices.getUserMedia({

          video:{
            width:{ideal:1280},
            height:{ideal:720},
            facingMode:pearCameraFacing
          },

          audio:false

        });


      video.srcObject=
        pearCameraStream;

      await video.play().catch(()=>{});


      /*
        After permission is granted, look for a connected
        Freenove / USB camera if one exists.
      */

      if(navigator.mediaDevices.enumerateDevices){

        try{

          const devices=
            await navigator.mediaDevices.enumerateDevices();

          const cameras=
            devices.filter(
              device=>device.kind==="videoinput"
            );


          const preferred=
            cameras.find(device=>{

              const label=
                (device.label||"").toLowerCase();

              return(
                label.includes("freenove") ||
                label.includes("usb") ||
                label.includes("webcam") ||
                label.includes("camera")
              );

            });


          if(preferred){

            const currentTrack=
              pearCameraStream.getVideoTracks()[0];

            const currentSettings=
              currentTrack
                ? currentTrack.getSettings()
                : {};

            /*
              If the browser already selected the preferred
              camera, leave it alone.
            */

            if(
              currentSettings.deviceId !==
              preferred.deviceId
            ){

              pearStopCamera();

              pearCameraStream=
                await navigator.mediaDevices
                  .getUserMedia({

                    video:{
                      deviceId:{
                        exact:preferred.deviceId
                      },

                      width:{ideal:1280},
                      height:{ideal:720}
                    },

                    audio:false

                  });

              video.srcObject=
                pearCameraStream;

              await video.play().catch(()=>{});

            }

          }

        }catch(error){

          /*
            The first stream is still usable even if
            device enumeration fails.
          */

          console.warn(
            "Camera selection:",
            error
          );

        }

      }

    }catch(error){

      console.error(error);

      alert(
        "Could not access the camera.\n\n" +
        "Make sure your camera is connected and " +
        "allow camera permission in the browser."
      );

    }

  };


  window.pearStopCamera=function(){

    if(pearCameraStream){

      pearCameraStream
        .getTracks()
        .forEach(track=>track.stop());

      pearCameraStream=null;

    }

  };


  window.pearCapturePhoto=function(){

    const video=
      document.getElementById("camera-video");

    const canvas=
      document.getElementById("camera-canvas");

    const output=
      document.getElementById("camera-photo");

    if(!video || !canvas || !output)return;


    if(!video.srcObject){

      alert("Start the camera first.");

      return;
    }


    if(
      !video.videoWidth ||
      !video.videoHeight
    ){

      alert(
        "The camera is still starting. Try again in a moment."
      );

      return;
    }


    canvas.width=
      video.videoWidth;

    canvas.height=
      video.videoHeight;


    const ctx=
      canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const image=
      canvas.toDataURL("image/png");


    output.innerHTML=`

      <div
        style="
          margin-top:8px;
          font-weight:800;
        "
      >
        📸 Captured Photo
      </div>

      <img
        src="${image}"
        style="
          width:100%;
          border-radius:12px;
          margin-top:6px;
        "
      >

    `;

  };


  window.pearFlipCamera=async function(){

    pearCameraFacing=
      pearCameraFacing==="user"
        ? "environment"
        : "user";


    /*
      If camera isn't running yet, don't start it.
    */

    if(!pearCameraStream)return;


    await pearStartCamera();

  };


  /*
    ============================================================
    INTERCEPT HOTSPOT CLICKS
    ============================================================

    This is the important fix for:
      Thumb -> DanWarp
      Image -> nothing
      other Page 2 apps -> wrong app
  */

  function launchFromMap(
    button,
    appName
  ){

    if(!button)return;

    button.style.pointerEvents="auto";
    button.style.touchAction="manipulation";


    button.addEventListener(
      "pointerup",
      function(event){

        /*
          Only handle the button on the correct page.
        */

        const isPage2=
          button.classList.contains(
            "page2-hotspot"
          );

        if(isPage2){

          if(!phone.classList.contains("page-two")){
            return;
          }

        }else{

          if(phone.classList.contains("page-two")){
            return;
          }

        }


        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();


        if(
          overlay &&
          overlay.classList.contains("open")
        ){

          return;
        }


        const app=
          window[appName];

        if(typeof app==="function"){

          app();

        }else{

          console.error(
            "Pear Phone app not found:",
            appName
          );

        }

      },
      {
        capture:true,
        passive:false
      }
    );


    /*
      Stop touch events from reaching the swipe system.
    */

    button.addEventListener(
      "touchstart",
      event=>{
        event.stopPropagation();
      },
      {
        capture:true,
        passive:true
      }
    );


    button.addEventListener(
      "touchmove",
      event=>{
        event.stopPropagation();
      },
      {
        capture:true,
        passive:true
      }
    );


    button.addEventListener(
      "touchend",
      event=>{
        event.stopPropagation();
      },
      {
        capture:true,
        passive:true
      }
    );

  }


  /*
    Connect Page 1.
  */

  Object.entries(page1Apps).forEach(
    ([id,app])=>{

      launchFromMap(
        document.getElementById(id),
        app
      );

    }
  );


  /*
    Connect Page 2.
  */

  Object.entries(page2Apps).forEach(
    ([id,app])=>{

      launchFromMap(
        document.getElementById(id),
        app
      );

    }
  );


  /*
    ============================================================
    HOME BUTTON
    ============================================================
  */

  const home=
    document.getElementById("home");

  if(home){

    home.addEventListener(
      "pointerup",
      event=>{

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();


        if(
          typeof window.closeApp==="function"
        ){

          window.closeApp();

        }

        pearStopCamera();

      },
      {
        capture:true,
        passive:false
      }
    );

  }


  /*
    ============================================================
    SWIPE BETWEEN PAGES
    ============================================================
  */

  let swipeStartX=null;
  let swipeStartY=null;
  let swipeActive=false;


  phone.addEventListener(
    "pointerdown",
    event=>{

      /*
        Don't swipe while inside an app.
      */

      if(
        overlay &&
        overlay.classList.contains("open")
      ){

        return;
      }


      /*
        Don't start a swipe from an icon.
      */

      if(
        event.target.closest(".hotspot") ||
        event.target.closest("#home")
      ){

        return;
      }


      swipeStartX=
        event.clientX;

      swipeStartY=
        event.clientY;

      swipeActive=true;

    },
    {
      passive:true
    }
  );


  phone.addEventListener(
    "pointerup",
    event=>{

      if(!swipeActive)return;

      swipeActive=false;


      if(
        swipeStartX===null ||
        swipeStartY===null
      ){

        return;
      }


      const dx=
        event.clientX-swipeStartX;

      const dy=
        event.clientY-swipeStartY;


      swipeStartX=null;
      swipeStartY=null;


      /*
        Require a meaningful vertical movement.
      */

      if(Math.abs(dy)<55)return;


      /*
        Swipe UP -> Page 2
        Swipe DOWN -> Page 1
      */

      if(
        dy<0 &&
        typeof window.showPage==="function"
      ){

        window.showPage(2);

      }else if(
        dy>0 &&
        typeof window.showPage==="function"
      ){

        window.showPage(1);

      }

    },
    {
      passive:true
    }
  );


  /*
    ============================================================
    KEYBOARD PAGE SWITCHING
    ============================================================
  */

  document.addEventListener(
    "keydown",
    event=>{

      const active=
        document.activeElement;

      if(
        active &&
        (
          active.tagName==="INPUT" ||
          active.tagName==="TEXTAREA" ||
          active.tagName==="SELECT"
        )
      ){

        return;
      }


      if(
        event.key==="ArrowUp" &&
        typeof window.showPage==="function"
      ){

        event.preventDefault();

        window.showPage(2);

      }


      if(
        event.key==="ArrowDown" &&
        typeof window.showPage==="function"
      ){

        event.preventDefault();

        window.showPage(1);

      }

    }
  );


  /*
    ============================================================
    KEYBOARD FIX
    ============================================================

    Your original app.js already has the keyboard system.
    This makes sure its keyboard is visible inside the app
    instead of interfering with the physical Pear Phone shell.
  */

  document.addEventListener(
    "focusin",
    event=>{

      const target=
        event.target;

      if(
        !target ||
        (
          target.tagName!=="INPUT" &&
          target.tagName!=="TEXTAREA"
        )
      ){

        return;
      }


      setTimeout(()=>{

        if(
          typeof window.showPearKeyboard==="function"
        ){

          window.showPearKeyboard(target);

        }

      },50);

    }
  );


  /*
    Make sure the keyboard is hidden whenever the app closes.
  */

  document.addEventListener(
    "pointerup",
    event=>{

      if(
        event.target.closest("#home")
      ){

        const keyboard=
          document.getElementById(
            "pear-keyboard"
          );

        if(keyboard){

          keyboard.classList.remove(
            "keyboard-show"
          );

          keyboard.classList.remove(
            "visible"
          );

        }

      }

    },
    true
  );


  /*
    ============================================================
    CAMERA CLEANUP
    ============================================================
  */

  window.addEventListener(
    "beforeunload",
    ()=>{
      pearStopCamera();
    }
  );


  /*
    If the original camera app starts a stream when the
    camera hotspot is clicked, stop that stream immediately.
    Our capture handler above launches the fixed camera first.
  */

})();

</script>

</body>
</html>
