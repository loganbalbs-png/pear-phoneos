<!DOCTYPE html>

<style>

  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

body{

/* =========================
   PEAR PHONE
========================= */

#phone-container{
  position:relative;
  width:min(170vh,1500px);
  aspect-ratio:1212 / 1188;
  background:url("pear-phone.png") center/contain no-repeat;
  transform:rotate(90deg);
  transform-origin:center center;
  touch-action:none;
  user-select:none;
}

/* =========================
   PAGE 2
========================= */

#page2{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:url("page2.png") center/contain no-repeat;
  z-index:50;
  pointer-events:none;
  opacity:0;
}

}

   HOTSPOTS
========================= */

.hotspot{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-appearance:none;
  appearance:none;
  z-index:200;
}

.hotspot:active{
  transform:scale(.93);
}

  overflow:hidden;

/* =========================
   APP HEADER
========================= */

.app-header{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 10px;

  background:linear-gradient(#fff,#e7e8ea);
  border-bottom:1px solid #ccc;

  font-weight:900;
  font-size:15px;
}

.back-button{
  width:30px;
  height:30px;

  border-radius:50%;
  border:1px solid #bbb;

  background:linear-gradient(#fff,#ddd);

  font-size:23px;
  cursor:pointer;
}

/* =========================
   APP CONTENT
========================= */

.app-content{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:12px;
  padding-bottom:15px;

  -webkit-overflow-scrolling:touch;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;

  padding:12px;
  margin-bottom:10px;
}

.card h2{
  margin-top:0;
}

button{
  padding:9px 13px;

  border-radius:11px;
  border:1px solid #bbb;

  background:linear-gradient(#fff,#ddd);

  font-weight:700;
  cursor:pointer;

  margin:3px;
}

input,
textarea{
  font-family:inherit;
  font-size:16px;

  padding:9px;

  border:1px solid #bbb;
  border-radius:10px;

  outline:none;

  width:100%;

  margin-bottom:8px;
}

textarea{
  min-height:120px;
}

.message{
  padding:9px 12px;

  width:max-content;
  max-width:82%;

  border-radius:17px;

  margin-bottom:7px;

  background:#dedfe3;
}

.message.sent{
  margin-left:auto;

  background:linear-gradient(#58b9ff,#1389df);
  color:white;
}

.map{
  height:180px;

  border-radius:15px;

  background:linear-gradient(
    135deg,
    #d6e5c7,
    #e7dfb9
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:55px;
}

   DARK MODE
========================= */

.dark-mode #app-window{

  color:white;
}

  background:#303134;
  border-color:#555;
}

.dark-mode .app-header{
  background:linear-gradient(#3a3a3a,#242424);
  border-color:#555;
  color:white;
}

.dark-mode button{
  background:linear-gradient(#444,#292929);
  color:white;
  border-color:#666;
}

.dark-mode input,
.dark-mode textarea{
  background:#303134;
  color:white;
  border-color:#666;

   CAMERA
========================= */

/* =========================
   KEYBOARD
========================= */

#pear-keyboard{
  position:absolute;

  left:3%;
  right:3%;
  bottom:3%;

  width:94%;

  padding:6px;

  background:rgba(35,35,40,.98);

  border-radius:11px;

  z-index:9999;

  display:none;

  opacity:0;

  transform:translateY(120%);

  transition:
    transform .28s cubic-bezier(.22,.8,.25,1),
    opacity .2s ease;

  box-shadow:0 5px 18px rgba(0,0,0,.55);

  touch-action:manipulation;
}

#pear-keyboard.keyboard-show{
  opacity:1;
  transform:translateY(0);
}

.pear-keyboard-row{
  display:flex;
  gap:3px;
  margin-bottom:3px;
}

.pear-keyboard-row:last-child{
  margin-bottom:0;
}

  flex:1;
  min-width:0;

  height:29px;

  border:0;
  border-radius:5px;

  background:#f5f5f7;
  color:#111;

  font-size:11px;
  font-weight:800;

  padding:0;
  margin:0;

  touch-action:manipulation;
  user-select:none;
}

.pear-keyboard-row button:active{
  transform:scale(.88);
  background:#cfd0d4;
}

.pear-keyboard-row.bottom button:first-child{
  flex:1.2;
}

.pear-keyboard-row.bottom button:nth-child(2){
  flex:5;
}

.pear-keyboard-row.bottom button:last-child{
  flex:1.2;
}

<body>

<div id="phone-container">

  <!-- PAGE 2 IMAGE -->

  <div id="page2"></div>

  <!-- =========================

  ========================= -->

  <button class="hotspot page1-hotspot" id="messages"></button>

  <button class="hotspot page1-hotspot" id="camera"></button>

  <button class="hotspot page1-hotspot" id="splashface"></button>

  <button class="hotspot page1-hotspot" id="stocks"></button>

  <button class="hotspot page1-hotspot" id="maps"></button>

  <button class="hotspot page1-hotspot" id="weather"></button>

  <button class="hotspot page1-hotspot" id="notes"></button>

  <button class="hotspot page1-hotspot" id="settings"></button>

  <button class="hotspot page1-hotspot" id="clock"></button>

  <button class="hotspot page1-hotspot" id="videos"></button>

  <button class="hotspot page1-hotspot" id="phone"></button>

  <button class="hotspot page1-hotspot" id="mail"></button>

  <button class="hotspot page1-hotspot" id="compass"></button>

  <button class="hotspot page1-hotspot" id="music"></button>


  <!-- =========================
       PAGE 2
  ========================= -->

  <button class="hotspot page2-hotspot" id="p2-lingo"></button>

  <button class="hotspot page2-hotspot" id="p2-splash"></button>

  <button class="hotspot page2-hotspot" id="p2-thumb"></button>

  <button class="hotspot page2-hotspot" id="p2-danwarp"></button>

  <button class="hotspot page2-hotspot" id="p2-image"></button>

  <button class="hotspot page2-hotspot" id="p2-chrono"></button>

  <button class="hotspot page2-hotspot" id="p2-zaplook"></button>

  <button class="hotspot page2-hotspot" id="p2-weather"></button>

  <button class="hotspot page2-hotspot" id="p2-music"></button>

  <button class="hotspot page2-hotspot" id="p2-monkey"></button>

  <button class="hotspot page2-hotspot" id="p2-remark"></button>

  <button class="hotspot page2-hotspot" id="p2-settings"></button>

  <button class="hotspot page2-hotspot" id="p2-phone"></button>

  <button class="hotspot page2-hotspot" id="p2-mail"></button>

  <button class="hotspot page2-hotspot" id="p2-compass"></button>

  <button class="hotspot page2-hotspot" id="p2-music2"></button>


  <!-- HOME -->

  <button id="home"></button>


  <!-- APP WINDOW -->

  <div id="overlay">

    <div id="app-window"></div>

<script>

document.addEventListener("DOMContentLoaded", function(){

  const phone =
    document.getElementById("phone-container");

  const overlay =
    document.getElementById("overlay");

  const appWindow =
    document.getElementById("app-window");


  let currentPage = 1;

  let cameraStream = null;

  let keyboardShift = false;


  /* =====================================================
     APP SYSTEM
  ===================================================== */

  function escapeHTML(value){

    return String(value)

      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function openApp(title,content){

    hidePearKeyboard();

    appWindow.innerHTML = `

      <div class="app-header">

        <button
          class="back-button"
          id="app-back"
        >
          ‹
        </button>

        <strong>
          ${escapeHTML(title)}
        </strong>

      </div>

      <div class="app-content">

        ${content}

      </div>

    `;

    overlay.classList.add("open");

    document
      .getElementById("app-back")
      .addEventListener(
        "click",
        closeApp
      );

    setupKeyboardInputs();

  }


  function closeApp(){

    stopCamera();

    hidePearKeyboard();

    overlay.classList.remove("open");

    appWindow.innerHTML = "";

  }


  /* =====================================================
     PAGE SWITCHING
  ===================================================== */

  function showPage(page){

    if(page === currentPage){
      return;
    }

    currentPage = page;

    closeApp();

    phone.classList.toggle(
      "page-two",
      page === 2
    );

  }


  /* KEYBOARD ARROWS */

  document.addEventListener(
    "keydown",
    function(e){

      if(
        e.target.matches(
          "input, textarea, select"
        )
      ){
        return;
      }

      if(
        e.key === "ArrowUp" &&
        currentPage === 1
      ){

        e.preventDefault();

        showPage(2);

      }

      if(
        e.key === "ArrowDown" &&
        currentPage === 2
      ){

        e.preventDefault();

        showPage(1);

      }

    }
  );


  /* =====================================================
     TOUCH SWIPE
  ===================================================== */

  let touchStartY = 0;

  phone.addEventListener(
    "touchstart",
    function(e){

      if(
        overlay.classList.contains("open")
      ){
        return;
      }

      touchStartY =
        e.touches[0].clientY;

    },
    {passive:true}
  );


  phone.addEventListener(
    "touchend",
    function(e){

      if(
        overlay.classList.contains("open")
      ){
        return;
      }

      const endY =
        e.changedTouches[0].clientY;

      const distance =
        endY - touchStartY;

      if(
        Math.abs(distance) < 80
      ){
        return;
      }

      if(
        distance < 0 &&
        currentPage === 1
      ){

        showPage(2);

      }

      if(
        distance > 0 &&
        currentPage === 2
      ){

        showPage(1);

      }

    },
    {passive:true}
  );


  /* =====================================================
     MOUSE DRAG
  ===================================================== */

  let mouseStartY = 0;

  let mouseDragging = false;


  phone.addEventListener(
    "mousedown",
    function(e){

      if(
        overlay.classList.contains("open")
      ){
        return;
      }

      mouseStartY = e.clientY;

      mouseDragging = true;

    }
  );


  phone.addEventListener(
    "mouseup",
    function(e){

      if(!mouseDragging){
        return;
      }

      mouseDragging = false;

      if(
        overlay.classList.contains("open")
      ){
        return;
      }

      const distance =
        e.clientY - mouseStartY;

      if(
        Math.abs(distance) < 80
      ){
        return;
      }

      if(
        distance < 0 &&
        currentPage === 1
      ){

        showPage(2);

      }

      if(
        distance > 0 &&
        currentPage === 2
      ){

        showPage(1);

      }

    }
  );


  /* =====================================================
     CUSTOM KEYBOARD
  ===================================================== */

  function setupKeyboardInputs(){

    const fields =
      appWindow.querySelectorAll(
        "input[type='text'], input:not([type]), textarea"
      );

    fields.forEach(function(field){

      field.addEventListener(
        "focus",
        function(){

          showPearKeyboard(field);

        }
      );

    });

  }


  function getFocusedField(){

    const active =
      document.activeElement;

    if(
      active &&
      (
        active.tagName === "INPUT" ||
        active.tagName === "TEXTAREA"
      )
    ){

      return active;

    }

    return null;

  }


  function showPearKeyboard(field){

    if(!field){
      return;
    }

    let keyboard =
      document.getElementById(
        "pear-keyboard"
      );


    if(!keyboard){

      keyboard =
        document.createElement("div");

      keyboard.id =
        "pear-keyboard";


      keyboard.innerHTML = `

        <div class="pear-keyboard-row">

          ${"QWERTYUIOP".split("").map(
            function(key){
              return `
                <button
                  type="button"
                  data-key="${key}"
                >
                  ${key}
                </button>
              `;
            }
          ).join("")}

        </div>


        <div class="pear-keyboard-row">

          ${"ASDFGHJKL".split("").map(
            function(key){
              return `
                <button
                  type="button"
                  data-key="${key}"
                >
                  ${key}
                </button>
              `;
            }
          ).join("")}

        </div>


        <div class="pear-keyboard-row">

          <button
            type="button"
            data-action="shift"
          >
            ⇧
          </button>

          ${"ZXCVBNM".split("").map(
            function(key){
              return `
                <button
                  type="button"
                  data-key="${key}"
                >
                  ${key}
                </button>
              `;
            }
          ).join("")}

          <button
            type="button"
            data-action="backspace"
          >
            ⌫
          </button>

        </div>


        <div class="pear-keyboard-row bottom">

          <button
            type="button"
            data-action="number"
          >
            123
          </button>

          <button
            type="button"
            data-action="space"
          >
            SPACE
          </button>

          <button
            type="button"
            data-action="enter"
          >
            ↵
          </button>

        </div>

      `;


      overlay.appendChild(keyboard);


      keyboard
        .querySelectorAll("[data-key]")
        .forEach(function(button){

          button.addEventListener(
            "mousedown",
            function(e){
              e.preventDefault();
            }
          );

          button.addEventListener(
            "touchstart",
            function(e){
              e.preventDefault();
            },
            {passive:false}
          );

          button.addEventListener(
            "click",
            function(){

              const field =
                getFocusedField();

              if(!field){
                return;
              }

              let key =
                button.dataset.key;

              if(!keyboardShift){
                key =
                  key.toLowerCase();
              }

              insertText(
                field,
                key
              );

              keyboardShift = false;

            }
          );

        });


      const shift =
        keyboard.querySelector(
          "[data-action='shift']"
        );

      shift.onclick =
        function(){

          keyboardShift =
            !keyboardShift;

        };


      const backspace =
        keyboard.querySelector(
          "[data-action='backspace']"
        );

      backspace.onclick =
        function(){

          const field =
            getFocusedField();

          if(!field){
            return;
          }

          const start =
            field.selectionStart;

          const end =
            field.selectionEnd;


          if(start !== end){

            field.value =
              field.value.substring(
                0,
                start
              ) +
              field.value.substring(
                end
              );

            field.selectionStart =
              field.selectionEnd =
                start;

          }

          else if(start > 0){

            field.value =
              field.value.substring(
                0,
                start - 1
              ) +
              field.value.substring(
                end
              );

            field.selectionStart =
              field.selectionEnd =
                start - 1;

          }

          field.dispatchEvent(
            new Event(
              "input",
              {bubbles:true}
            )
          );

        };


      const space =
        keyboard.querySelector(
          "[data-action='space']"
        );

      space.onclick =
        function(){

          const field =
            getFocusedField();

          if(field){
            insertText(
              field,
              " "
            );
          }

        };


      const enter =
        keyboard.querySelector(
          "[data-action='enter']"
        );

      enter.onclick =
        function(){

          const field =
            getFocusedField();

          if(field){
            field.blur();
          }

          hidePearKeyboard();

        };


      const number =
        keyboard.querySelector(
          "[data-action='number']"
        );

      number.onclick =
        function(){

          const field =
            getFocusedField();

          if(field){

            insertText(
              field,
              "1234567890"
            );

          }

        };

    }


    keyboard.style.display =
      "block";

    setTimeout(function(){

      keyboard.classList.add(
        "keyboard-show"
      );

    },10);

  }


  function hidePearKeyboard(){

    const keyboard =
      document.getElementById(
        "pear-keyboard"
      );

    if(!keyboard){
      return;
    }

    keyboard.classList.remove(
      "keyboard-show"
    );

    setTimeout(function(){

      if(
        keyboard &&
        !keyboard.classList.contains(
          "keyboard-show"
        )
      ){

        keyboard.style.display =
          "none";

      }

    },250);

  }


  function insertText(field,text){

    const start =
      field.selectionStart;

    const end =
      field.selectionEnd;

    field.value =
      field.value.substring(
        0,
        start
      ) +
      text +
      field.value.substring(
        end
      );

    field.selectionStart =
      field.selectionEnd =
        start + text.length;

    field.dispatchEvent(
      new Event(
        "input",
        {bubbles:true}
      )
    );

  }


  /* =====================================================

  ===================================================== */

  async function startCamera(){

    try{

      stopCamera();

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video:true,
            audio:false
          });

      const video =
        document.getElementById(
          "camera-video"
        );

      if(video){

        video.srcObject =
          cameraStream;

      }

    }

    catch(error){

      alert(
        "Camera access was not available."
      );

    }

  }


  function stopCamera(){

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(function(track){
          track.stop();
        });

      cameraStream = null;

    }

  }


  function cameraApp(){

    openApp(
      "Camera",
      `

        <div class="card">

          <h2>📷 Camera</h2>

          <video
            id="camera-video"
            autoplay
            playsinline
          ></video>

          <button id="camera-start">
            📷 Start Camera
          </button>

          <button id="camera-flip">
            🔄 Flip Camera
          </button>

          <button id="camera-take">
            ⭕ Take Photo
          </button>

          <canvas id="camera-canvas"></canvas>

          <div id="camera-photo"></div>

        </div>

      `
    );


    document
      .getElementById("camera-start")
      .onclick =
        startCamera;


    document
      .getElementById("camera-take")
      .onclick =
        function(){

          const video =
            document.getElementById(
              "camera-video"
            );

          const canvas =
            document.getElementById(
              "camera-canvas"
            );

          const photo =
            document.getElementById(
              "camera-photo"
            );

          if(
            !video ||
            !canvas ||
            !photo
          ){
            return;
          }

          canvas.width =
            video.videoWidth || 640;

          canvas.height =
            video.videoHeight || 480;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          photo.innerHTML = `
            <img
              src="${canvas.toDataURL("image/png")}"
            >
          `;

        };


    document
      .getElementById("camera-flip")
      .onclick =
        startCamera;


    startCamera();

  }
