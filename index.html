<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}


/* =====================================================
   PEAR PHONE
===================================================== */

#phone-container {
    position: relative;

    width: min(82vw, 520px);

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================================
   CLICKABLE APPS
===================================================== */

.hotspot {
    position: absolute;

    border: none;
    background: transparent;

    padding: 0;
    margin: 0;

    border-radius: 50%;

    cursor: pointer;

    z-index: 50;

    touch-action: manipulation;

    -webkit-appearance: none;
    appearance: none;
}


/* =====================================================
   APP POSITIONS
===================================================== */

#messages {
    left: 43.1%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#camera {
    left: 54%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#splashface {
    left: 38%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#stocks {
    left: 47.5%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#maps {
    left: 57%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#photos {
    left: 38%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#weather {
    left: 47.5%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#notes {
    left: 57%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#peartunes {
    left: 32%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#settings {
    left: 42%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#clock {
    left: 52%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#videos {
    left: 62%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#phone {
    left: 32%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#mail {
    left: 42%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#compass {
    left: 52%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#music {
    left: 62%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}


/* =====================================================
   HOME BUTTON
===================================================== */

#home {
    position: absolute;

    left: 46%;
    top: 78.8%;

    width: 8.2%;
    aspect-ratio: 1;

    border: none;
    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    z-index: 60;
}


/* =====================================================
   APP BOX
   SMALL BOX INSIDE PEAR PHONE
===================================================== */

#overlay {

    position: absolute;

    left: 31%;
    top: 22%;

    width: 38%;
    height: 47%;

    z-index: 100;

    display: none;

    overflow: hidden;

    border-radius: 8px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.4);
}

#overlay.open {
    display: block;
}


/* =====================================================
   APP WINDOW
===================================================== */

#app-window {

    width: 100%;
    height: 100%;

    background: #f2f2f7;

    color: #111;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    align-items: center;

    gap: 7px;

    min-height: 40px;

    padding: 6px 8px;

    background:
        linear-gradient(
            #ffffff,
            #e5e5e5
        );

    border-bottom: 1px solid #aaa;

    font-size: 13px;

    font-weight: bold;
}


.back {

    width: 28px;
    height: 28px;

    border-radius: 50%;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 10px;

    font-size: 12px;
}

.content h1 {
    font-size: 20px;
}

.content h2 {
    font-size: 16px;
}

.content h3 {
    font-size: 14px;
}


/* =====================================================
   BUTTONS
===================================================== */

.button {

    padding: 7px 10px;

    margin: 2px;

    border-radius: 8px;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   INPUTS
===================================================== */

input,
textarea,
select {

    width: 100%;

    padding: 8px;

    margin-bottom: 6px;

    border: 1px solid #aaa;

    border-radius: 8px;

    font-size: 12px;
}


textarea {
    min-height: 90px;
}


/* =====================================================
   CARDS
===================================================== */

.card {

    background: white;

    border: 1px solid #ddd;

    border-radius: 9px;

    padding: 9px;

    margin-bottom: 7px;
}


/* =====================================================
   MESSAGES
===================================================== */

.message {

    width: max-content;

    max-width: 80%;

    padding: 7px 10px;

    background: #ddd;

    border-radius: 14px;

    margin-bottom: 6px;
}


.message.me {

    margin-left: auto;

    background: #1689e8;

    color: white;
}


/* =====================================================
   GRID
===================================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 6px;
}


/* =====================================================
   PORTRAIT / VERTICAL DISPLAY
===================================================== */

/*
   If the Raspberry Pi touchscreen is horizontal,
   this rotates the Pear Phone into portrait.
*/

@media (orientation: landscape) {

    #phone-container {

        width: 90vh;

        max-width: 520px;

        transform: rotate(90deg);

    }

}


/*
   If the screen is already portrait,
   keep the Pear Phone vertical.
*/

@media (orientation: portrait) {

    #phone-container {

        width: 90vw;

        max-width: 520px;

        transform: none;

    }

}


/* =====================================================
   SMALL SCREENS
===================================================== */

@media (max-width: 600px) {

    #phone-container {

        width: 90vw;

    }

}

</style>
</head>


<body>


<div id="phone-container">


    <!-- MESSAGES -->

    <button
        class="hotspot"
        id="messages"

    </button>

    </button>

    <button
        class="hotspot"
        id="maps"
        aria-label="Maps">
    </button>


    <!-- PHOTOS -->

    <button
        class="hotspot"
        id="photos"
        aria-label="Photos">
    </button>


    <!-- WEATHER -->

    <button
        class="hotspot"
        id="weather"
        aria-label="Weather">
    </button>


    <!-- NOTES -->

    <button
        class="hotspot"
        id="notes"
        aria-label="Notes">
    </button>


    <!-- PEARTUNES -->

    <button
        class="hotspot"
        id="peartunes"
        aria-label="PearTunes">
    </button>


    <!-- SETTINGS -->

    <button
        class="hotspot"
        id="settings"
        aria-label="Settings">
    </button>


    <!-- CLOCK -->

    <button
        class="hotspot"
        id="clock"
        aria-label="Clock">
    </button>


    <!-- VIDEOS -->

    <button
        class="hotspot"
        id="videos"
        aria-label="Videos">
    </button>


    <!-- PHONE -->

    <button
        class="hotspot"
        id="phone"
        aria-label="Phone">
    </button>


    <!-- MAIL -->

    <button
        class="hotspot"
        id="mail"
        aria-label="Mail">
    </button>


    <!-- COMPASS -->

    <button
        class="hotspot"
        id="compass"
        aria-label="Compass">
    </button>


    <!-- MUSIC -->

    <button
        class="hotspot"
        id="music"
        aria-label="Music">
    </button>


    <!-- HOME -->

    <button
        id="home"
        aria-label="Home">
    </button>


    <!-- APP BOX -->

    <div id="overlay">

        <div id="app-window"></div>

    </div>


</div>


<script src="app.js"></script>

</body>
</html>
