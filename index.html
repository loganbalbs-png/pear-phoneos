<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pear Phone OS</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

#phone-container {
  position: relative;
  width: min(82vw, 520px);
  aspect-ratio: 1212 / 1188;
  background: url("pear-phone.png") center/contain no-repeat;
  background-color: white;
}

.hotspot {
  position: absolute;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  cursor: pointer;
  touch-action: manipulation;
  z-index: 20;
}

/* App positions */

#messages { left:43.1%; top:25.7%; width:9.6%; aspect-ratio:1; }
#camera { left:54%; top:25.7%; width:9.6%; aspect-ratio:1; }

#splashface { left:38%; top:36.1%; width:9.6%; aspect-ratio:1; }
#stocks { left:47.5%; top:36.1%; width:9.6%; aspect-ratio:1; }
#maps { left:57%; top:36.1%; width:9.6%; aspect-ratio:1; }

#photos { left:38%; top:46.9%; width:9.6%; aspect-ratio:1; }
#weather { left:47.5%; top:46.9%; width:9.6%; aspect-ratio:1; }
#notes { left:57%; top:46.9%; width:9.6%; aspect-ratio:1; }

#peartunes { left:32%; top:55.9%; width:9.6%; aspect-ratio:1; }
#settings { left:42%; top:55.9%; width:9.6%; aspect-ratio:1; }
#clock { left:52%; top:55.9%; width:9.6%; aspect-ratio:1; }
#videos { left:62%; top:55.9%; width:9.6%; aspect-ratio:1; }

#phone { left:32%; top:65.9%; width:9.6%; aspect-ratio:1; }
#mail { left:42%; top:65.9%; width:9.6%; aspect-ratio:1; }
#compass { left:52%; top:65.9%; width:9.6%; aspect-ratio:1; }
#music { left:62%; top:65.9%; width:9.6%; aspect-ratio:1; }

#home {
  position: absolute;
  left: 46%;
  top: 78.8%;
  width: 8.2%;
  aspect-ratio: 1;
  border: none;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  z-index: 30;
}

/* App screen */

#overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  background: #f2f2f7;
}

#overlay.open {
  display: block;
}

#app-window {
  width: 100%;
  height: 100%;
  background: #f2f2f7;
  color: #111;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  padding-top: calc(env(safe-area-inset-top) + 14px);
  background: white;
  border-bottom: 1px solid #ccc;
  font-size: 20px;
  font-weight: bold;
}

.back {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #aaa;
  background: #eee;
  font-size: 25px;
  cursor: pointer;
}

.content {
  padding: 18px;
  overflow-y: auto;
  flex: 1;
}

.button {
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid #aaa;
  background: white;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

.button:active {
  transform: scale(.95);
}

input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #aaa;
  font-size: 16px;
  margin-bottom: 10px;
}

textarea {
  min-height: 180px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px #0001;
}

.big {
  font-size: 50px;
  text-align: center;
  margin: 25px;
}

.message {
  padding: 10px 14px;
  background: #ddd;
  border-radius: 18px;
  margin: 7px 0;
  max-width: 80%;
}

.message.me {
  background: #1689e8;
  color: white;
  margin-left: auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

@media (max-width:600px) {
  #phone-container {
    width: 100vw;
    transform: scale(.68);
  }
}
</style>
</head>

<body>

<div id="phone-container">

<button class="hotspot" id="messages"></button>
<button class="hotspot" id="camera"></button>
<button class="hotspot" id="splashface"></button>
<button class="hotspot" id="stocks"></button>
<button class="hotspot" id="maps"></button>

<button class="hotspot" id="photos"></button>
<button class="hotspot" id="weather"></button>
<button class="hotspot" id="notes"></button>

<button class="hotspot" id="peartunes"></button>
<button class="hotspot" id="settings"></button>
<button class="hotspot" id="clock"></button>
<button class="hotspot" id="videos"></button>

<button class="hotspot" id="phone"></button>
<button class="hotspot" id="mail"></button>
<button class="hotspot" id="compass"></button>
<button class="hotspot" id="music"></button>

<button id="home"></button>

</div>

<div id="overlay">
  <div id="app-window"></div>
</div>

<script src="app.js"></script>

</body>
</html>
