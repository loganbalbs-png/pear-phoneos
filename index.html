<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  font-family:Arial,sans-serif
}

/* PEAR PHONE */

#phone{
  position:relative;
  width:min(88vw,820px);
  aspect-ratio:1212/1188;
  background:url('pear-phone.jpg') center/contain no-repeat,radial-gradient(#20252b,#000);
  transform:rotate(90deg) scale(.99);
  transform-origin:center center;
  touch-action:none;
}

/* PAGE 1 */

.hotspot{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  border-radius:50%;
  z-index:20;
  cursor:pointer
}

.hotspot:active{
  background:#ffffff18;
  transform:scale(.92)
}

#page1 button:nth-child(1){left:43.1%;top:25.7%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(2){left:54%;top:25.7%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(3){left:38%;top:36.1%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(4){left:47.5%;top:36.1%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(5){left:57%;top:36.1%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(6){left:38%;top:46.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(7){left:47.5%;top:46.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(8){left:57%;top:46.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(9){left:32%;top:55.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(10){left:42%;top:55.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(11){left:52%;top:55.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(12){left:62%;top:55.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(13){left:32%;top:65.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(14){left:42%;top:65.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(15){left:52%;top:65.9%;width:8.3%;aspect-ratio:1}
#page1 button:nth-child(16){left:62%;top:65.9%;width:8.3%;aspect-ratio:1}

/* PAGE 2 */

#page2{
  display:none;
  position:absolute;
  left:31%;
  right:30%;
  top:24%;
  bottom:24%;
  z-index:21;

  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);

  column-gap:7%;
  row-gap:7%;

  align-items:center;
  justify-items:center;

  pointer-events:auto
}

#page2 button{
  display:block;
  width:100%;
  max-width:60px;
  aspect-ratio:1;

  border:0;
  background:transparent;
  border-radius:50%;

  cursor:pointer;
  pointer-events:auto
}

#page2 button:active{
  background:#fff2;
  transform:scale(.92)
}

/* HOME */

#home{
  position:absolute;
  left:46%;
  top:78.8%;
  width:8.2%;
  aspect-ratio:1;

  border:0;
  background:transparent;
  border-radius:50%;

  z-index:30
}

/* APP */

#overlay{
  position:absolute;
  left:27%;
  top:24%;
  width:46%;
  height:47%;

  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  background:#0006;
  border-radius:17px;
  overflow:hidden
}

#overlay.open{
  display:flex;
  animation:appOpen .18s ease
}

@keyframes appOpen{
  from{
    opacity:0;
    transform:scale(.88)
  }

  to{
    opacity:1;
    transform:scale(1)
  }
}

#app{
  width:94%;
  height:94%;

  background:#f4f5f7;
  color:#111;

  border:2px solid #333;
  border-radius:13px;

  display:flex;
  flex-direction:column;

  overflow:hidden
}

.head{
  height:34px;
  flex:none;

  display:flex;
  align-items:center;
  gap:6px;

  padding:4px 6px;

  background:linear-gradient(#fff,#e5e5e5);
  border-bottom:1px solid #bbb;

  font-weight:900;
  font-size:13px
}

.head button{
  width:25px;
  height:25px;

  border-radius:50%;
  border:1px solid #aaa;
  background:#ddd;

  font-size:17px
}

.body{
  flex:1;
  overflow:auto;
  padding:7px;
  font-size:12px
}

.body button{
  border:1px solid #aaa;
  border-radius:7px;
  background:linear-gradient(#fff,#ddd);
  padding:6px;
  font-weight:700;
  font-size:11px
}

.body input,
.body textarea{
  font-size:13px;
  padding:6px;

  border:1px solid #aaa;
  border-radius:7px
}

.body textarea{
  width:100%;
  min-height:75px
}

.row{
  display:flex;
  gap:5px
}

.bubble{
  background:#ddd;
  border-radius:12px;

  padding:6px 8px;
  margin-bottom:5px;

  width:max-content;
  max-width:85%
}

.me{
  margin-left:auto;
  background:#168ee8;
  color:#fff
}

.photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px
}

.photos img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:6px
}

.video{
  width:100%;
  background:#000;
  border-radius:7px
}

.stock{
  display:flex;
  justify-content:space-between;

  background:#fff;
  border:1px solid #ddd;
  border-radius:7px;

  padding:6px;
  margin-bottom:4px
}

.big{
  text-align:center;
  font-size:32px;
  font-weight:900;
  padding:12px
}

.map{
  height:105px;

  display:grid;
  place-items:center;

  border-radius:8px;

  background:linear-gradient(135deg,#d8e8ca,#e8dfb5);

  font-size:35px
}

/* KEYBOARD */

#keyboard{
  position:absolute;

  left:3%;
  right:3%;
  bottom:2%;

  z-index:500;

  display:none;

  grid-template-columns:repeat(10,1fr);

  gap:3px;

  padding:6px;

  background:#202329ee;

  border-radius:13px;

  transform:translateY(120%);

  transition:.2s
}

#keyboard.show{
  display:grid;
  transform:translateY(0)
}

#keyboard button{
  height:26px;

  border:0;
  border-radius:5px;

  font-size:9px;
  font-weight:800
}

.space{
  grid-column:span 5
}

.wide{
  grid-column:span 2
}

/* PAGE FLASH */

#flash{
  position:absolute;
  inset:0;

  z-index:600;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle,
      #fff8,
      #267dff4d,
      transparent 70%
    )
}

#flash.go{
  animation:f .4s ease
}

@keyframes f{
  0%{
    opacity:0;
    transform:scale(.7)
  }

  35%{
    opacity:1
  }

  100%{
    opacity:0;
    transform:scale(1.15)
  }
}

@media(max-width:700px){

  #phone{
    width:min(96vw,820px);
    transform:rotate(90deg) scale(.91)
  }

  #overlay{
    left:26%;
    top:23%;
    width:48%;
    height:49%
  }

  #page2{
    left:30%;
    right:29%;
    top:23%;
    bottom:23%;

    column-gap:6%;
    row-gap:6%
  }

  #page2 button{
    max-width:55px
  }
}
</style>
</head>

<body>

<div id="phone">

<div id="page1">

<button class="hotspot" data-app="messages"></button>
<button class="hotspot" data-app="camera"></button>
<button class="hotspot" data-app="splashface"></button>
<button class="hotspot" data-app="stocks"></button>
<button class="hotspot" data-app="maps"></button>
<button class="hotspot" data-app="photos"></button>
<button class="hotspot" data-app="weather"></button>
<button class="hotspot" data-app="notes"></button>
<button class="hotspot" data-app="peartunes"></button>
<button class="hotspot" data-app="settings"></button>
<button class="hotspot" data-app="clock"></button>
<button class="hotspot" data-app="videos"></button>
<button class="hotspot" data-app="phone"></button>
<button class="hotspot" data-app="mail"></button>
<button class="hotspot" data-app="compass"></button>
<button class="hotspot" data-app="music"></button>

</div>

<div id="page2">

<button data-app="messages"></button>
<button data-app="camera"></button>
<button data-app="photos"></button>
<button data-app="weather"></button>

<button data-app="maps"></button>
<button data-app="videos"></button>
<button data-app="music"></button>
<button data-app="notes"></button>

<button data-app="settings"></button>
<button data-app="clock"></button>
<button data-app="phone"></button>
<button data-app="mail"></button>

</div>

<button id="home"></button>

<div id="overlay">
<div id="app"></div>
</div>

<div id="keyboard"></div>

<div id="flash"></div>

</div>

<script src="app.js?v=20260920-page2-fix"></script>

</body>
</html>
