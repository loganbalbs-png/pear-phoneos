<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

/* =========================================================
   PEAR PHONE
   ========================================================= */

#phone{
  position:relative;

  /* OLD ZOOMED-IN SIZE */
  width:min(82vw,520px);
  aspect-ratio:1212 / 1188;

  background:url("pear-phone.jpg") center/contain no-repeat;
  background-color:#fff;

  /* KEEP THE OLD ZOOM */
  transform:scale(.78);
  transform-origin:center center;

  overflow:hidden;
}

/* =========================================================
   HOME PAGE
   ========================================================= */

#page1{
  position:absolute;
  inset:0;
  display:block;
  z-index:10;
}

/* Invisible clickable app buttons */
.hotspot{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  margin:0;

  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;

  -webkit-appearance:none;
  appearance:none;

  z-index:20;
}

.hotspot:active{
  transform:scale(.93);
  background:rgba(255,255,255,.08);
}

/* EXACT OLD ICON POSITIONS */

#messages{
  left:43.1%;
  top:25.7%;
  width:9.6%;
  aspect-ratio:1;
}

#camera{
  left:54.0%;
  top:25.7%;
  width:9.6%;
  aspect-ratio:1;
}

#splashface{
  left:38.0%;
  top:36.1%;
  width:9.6%;
  aspect-ratio:1;
}

#stocks{
  left:47.5%;
  top:36.1%;
  width:9.6%;
  aspect-ratio:1;
}

#maps{
  left:57.0%;
  top:36.1%;
  width:9.6%;
  aspect-ratio:1;
}

#photos{
  left:38.0%;
  top:46.9%;
  width:9.6%;
  aspect-ratio:1;
}

#weather{
  left:47.5%;
  top:46.9%;
  width:9.6%;
  aspect-ratio:1;
}

#notes{
  left:57.0%;
  top:46.9%;
  width:9.6%;
  aspect-ratio:1;
}

#peartunes{
  left:32.0%;
  top:55.9%;
  width:9.6%;
  aspect-ratio:1;
}

#settings{
  left:42.0%;
  top:55.9%;
  width:9.6%;
  aspect-ratio:1;
}

#clock{
  left:52.0%;
  top:55.9%;
  width:9.6%;
  aspect-ratio:1;
}

#videos{
  left:62.0%;
  top:55.9%;
  width:9.6%;
  aspect-ratio:1;
}

/*
   IMPORTANT:
   The outer phone is #phone.
   Therefore the PHONE APP button cannot also be #phone.
   It is #phone-app instead.
*/

#phone-app{
  left:32.0%;
  top:65.9%;
  width:9.6%;
  aspect-ratio:1;
}

#mail{
  left:42.0%;
  top:65.9%;
  width:9.6%;
  aspect-ratio:1;
}

#compass{
  left:52.0%;
  top:65.9%;
  width:9.6%;
  aspect-ratio:1;
}

#music{
  left:62.0%;
  top:65.9%;
  width:9.6%;
  aspect-ratio:1;
}

/* HOME BUTTON */

#home{
  position:absolute;
  left:46%;
  top:78.8%;

  width:8.2%;
  aspect-ratio:1;

  border:0;
  background:transparent;
  border-radius:50%;

  cursor:pointer;
  z-index:30;
}

/* =========================================================
   PAGE 2
   ========================================================= */

#page2{
  position:absolute;
  inset:0;

  display:none;

  z-index:50;

  background:url("page2.png") center/100% 100% no-repeat;

  animation:pageIn .35s ease;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:scale(.92);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.page2-hotspot{
  position:absolute;

  border:0;
  background:transparent;

  padding:0;
  margin:0;

  border-radius:50%;

  cursor:pointer;
  touch-action:manipulation;

  z-index:60;
}

.page2-hotspot:active{
  transform:scale(.93);
}

/* Page 2 clickable grid */

.p2-1{
  left:38%;
  top:25%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-2{
  left:48%;
  top:25%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-3{
  left:58%;
  top:25%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-4{
  left:38%;
  top:36%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-5{
  left:48%;
  top:36%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-6{
  left:58%;
  top:36%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-7{
  left:38%;
  top:47%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-8{
  left:48%;
  top:47%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-9{
  left:58%;
  top:47%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-10{
  left:38%;
  top:58%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-11{
  left:48%;
  top:58%;
  width:9.6%;
  aspect-ratio:1;
}

.p2-12{
  left:58%;
  top:58%;
  width:9.6%;
  aspect-ratio:1;
}

/* =========================================================
   APP WINDOW
   ========================================================= */

/*
   IMPORTANT:
   The app stays INSIDE the Pear Phone.
   It does NOT become fullscreen.
   It also does NOT rotate the opposite direction.
*/

#overlay{
  position:absolute;

  left:20%;
  top:18%;

  width:60%;
  height:59%;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  background:transparent;

  pointer-events:none;
}

#overlay.open{
  display:flex;
  pointer-events:auto;
}

#app{
  width:94%;
  height:94%;

  overflow:hidden;

  background:#f4f5f7;
  color:#111;

  border-radius:18px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(0,0,0,.15);

  display:flex;
  flex-direction:column;

  animation:appOpen .2s ease;
}

@keyframes appOpen{
  from{
    opacity:0;
    transform:scale(.9);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================================================
   APP UI
   ========================================================= */

.head{
  flex:0 0 auto;

  display:flex;
  align-items:center;

  gap:10px;

  padding:10px 12px;

  background:linear-gradient(#fff,#e7e8ea);

  border-bottom:1px solid #ccc;

  font-size:17px;
  font-weight:900;
}

.head button{
  width:32px;
  height:32px;

  border-radius:50%;

  border:1px solid #bbb;

  background:linear-gradient(#fff,#ddd);

  font-size:24px;

  cursor:pointer;
}

.body{
  flex:1 1 auto;

  min-height:0;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding:12px;
}

.row{
  display:flex;
  gap:7px;
}

.button,
button{
  font-family:inherit;
}

.body button{
  padding:9px 12px;

  border-radius:11px;

  border:1px solid #bbb;

  background:linear-gradient(#fff,#ddd);

  font-weight:700;

  cursor:pointer;
}

.body button:active{
  transform:scale(.96);
}

input,
textarea{
  font-family:inherit;

  font-size:16px;

  padding:9px;

  border:1px solid #bbb;

  border-radius:11px;

  outline:none;

  background:#fff;
}

textarea{
  width:100%;
  min-height:130px;
  resize:none;
}

.bubble{
  padding:9px 12px;

  width:max-content;
  max-width:82%;

  background:#dedfe3;

  border-radius:18px;

  margin-bottom:7px;
}

.bubble.me{
  margin-left:auto;

  background:linear-gradient(#58b9ff,#1389df);

  color:#fff;
}

.stock{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  padding:11px;

  margin-bottom:7px;

  background:#fff;

  border:1px solid #ddd;

  border-radius:13px;
}

.big{
  font-size:65px;

  text-align:center;

  padding:15px 0;
}

.map{
  height:190px;

  border-radius:16px;

  background:linear-gradient(
    135deg,
    #d6e5c7,
    #e7dfb9
  );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:60px;
}

.photos{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:6px;

  margin-top:8px;
}

.photos img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  border-radius:10px;
}

.video{
  width:100%;

  max-height:220px;

  object-fit:cover;

  border-radius:14px;

  background:#000;
}

/* =========================================================
   KEYBOARD
   ========================================================= */

#keyboard{
  position:absolute;

  left:20%;
  top:48%;

  width:60%;
  height:29%;

  z-index:150;

  display:none;

  grid-template-columns:repeat(10,1fr);

  gap:3px;

  padding:5px;

  border-radius:14px;

  background:rgba(30,30,30,.96);

  box-shadow:0 5px 20px rgba(0,0,0,.45);
}

#keyboard.show{
  display:grid;
}

#keyboard button{
  min-width:0;

  padding:3px;

  border:0;

  border-radius:5px;

  background:#eee;

  color:#111;

  font-size:10px;

  font-weight:800;

  cursor:pointer;
}

#keyboard button:active{
  transform:scale(.92);
}

#keyboard .space{
  grid-column:span 6;
}

#keyboard .wide{
  grid-column:span 2;
}

/* =========================================================
   PAGE TRANSITION FLASH
   ========================================================= */

#flash{
  position:absolute;

  inset:0;

  z-index:200;

  pointer-events:none;

  opacity:0;
}

#flash.go{
  animation:flash .35s ease;
}

@keyframes flash{
  0%{
    opacity:0;
    background:#fff;
  }

  35%{
    opacity:.22;
    background:#fff;
  }

  100%{
    opacity:0;
    background:#fff;
  }
}

/* =========================================================
   RESPONSIVE — KEEP PHONE LARGE
   ========================================================= */

@media(max-width:600px){

  #phone{
    width:100vw;

    transform:scale(.78);

    transform-origin:center center;
  }
}

@media(max-height:700px){

  #phone{
    width:100vw;

    transform:scale(.78);

    transform-origin:center center;
  }
}
</style>
</head>

<body>
