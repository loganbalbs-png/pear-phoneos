<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

#phone{
  position:relative;
  width:min(82vw,520px);
  aspect-ratio:1212 / 1188;
  background:url("pear-phone.jpg") center/contain no-repeat;
  background-color:#fff;
  transform:rotate(90deg) scale(.78);
  transform-origin:center center;
}

[data-app]{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-appearance:none;
  appearance:none;
}

[data-app]:active{
  transform:scale(.93);
  background:rgba(255,255,255,.08)
}

/* PAGE 1 */
#page1{
  position:absolute;
  inset:0;
  display:block;
}

#messages{left:43.1%;top:25.7%;width:9.6%;aspect-ratio:1}
#camera{left:54%;top:25.7%;width:9.6%;aspect-ratio:1}
#splashface{left:38%;top:36.1%;width:9.6%;aspect-ratio:1}
#stocks{left:47.5%;top:36.1%;width:9.6%;aspect-ratio:1}
#maps{left:57%;top:36.1%;width:9.6%;aspect-ratio:1}
#photos{left:38%;top:46.9%;width:9.6%;aspect-ratio:1}
#weather{left:47.5%;top:46.9%;width:9.6%;aspect-ratio:1}
#notes{left:57%;top:46.9%;width:9.6%;aspect-ratio:1}
#peartunes{left:32%;top:55.9%;width:9.6%;aspect-ratio:1}
#settings{left:42%;top:55.9%;width:9.6%;aspect-ratio:1}
#clock{left:52%;top:55.9%;width:9.6%;aspect-ratio:1}
#videos{left:62%;top:55.9%;width:9.6%;aspect-ratio:1}
#phone{left:32%;top:65.9%;width:9.6%;aspect-ratio:1}
#mail{left:42%;top:65.9%;width:9.6%;aspect-ratio:1}
#compass{left:52%;top:65.9%;width:9.6%;aspect-ratio:1}
#music{left:62%;top:65.9%;width:9.6%;aspect-ratio:1}

/* HOME */
#home{
  position:absolute;
  left:46%;
  top:78.8%;
  width:8.2%;
  aspect-ratio:1;
  border:0;
  background:transparent;
  border-radius:50%;
  cursor:pointer;
  z-index:20;
}

/* PAGE 2 */
#page2{
  position:absolute;
  inset:0;
  display:none;
}

#page2 img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

#page2 [data-app]{
  z-index:5;
}

/* APP WINDOW */
#overlay{
  position:absolute;
  left:20%;
  top:18%;
  width:60%;
  height:59%;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

#overlay.open{
  display:flex;
  pointer-events:auto;
}

#app{
  width:94%;
  height:94%;
  overflow:hidden;
  background:linear-gradient(#f7f8fa,#e7e9ec);
  color:#111;
  border:2px solid #222;
  border-radius:18px;
  box-shadow:
    0 12px 30px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.8);
  display:flex;
  flex-direction:column;
}

.head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  background:linear-gradient(#fff,#dfe1e4);
  border-bottom:1px solid #aaa;
  font-weight:900;
}

.head button{
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid #aaa;
  background:linear-gradient(#fff,#ddd);
  font-size:23px;
  line-height:20px;
  cursor:pointer;
}

.body{
  flex:1;
  overflow:auto;
  padding:10px;
}

.bubble{
  padding:9px 12px;
  width:max-content;
  max-width:82%;
  background:#dedfe3;
  border-radius:18px;
  margin-bottom:7px;
}

.bubble.me{
  margin-left:auto;
  background:linear-gradient(#58b9ff,#1389df);
  color:#fff;
}

.row{
  display:flex;
  gap:8px;
}

button{
  cursor:pointer;
}

input,textarea{
  font-size:16px;
  padding:9px;
  border:1px solid #aaa;
  border-radius:10px;
  outline:none;
}

textarea{
  width:100%;
  min-height:120px;
  resize:none;
}

.photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.photos img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
}

.video{
  width:100%;
  max-height:70%;
  border-radius:12px;
  background:#000;
}

.stock{
  display:flex;
  justify-content:space-between;
  padding:10px;
  margin-bottom:7px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
}

.map{
  height:150px;
  border-radius:14px;
  background:linear-gradient(135deg,#d6e5c7,#e7dfb9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.big{
  text-align:center;
  font-size:65px;
  padding:15px 0;
}

/* KEYBOARD */
#keyboard{
  position:absolute;
  left:22%;
  top:76%;
  width:56%;
  height:20%;
  z-index:100;
  display:none;
  grid-template-columns:repeat(10,1fr);
  gap:3px;
  padding:5px;
  background:rgba(20,20,20,.94);
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
}

#keyboard.show{
  display:grid;
}

#keyboard button{
  border:1px solid #777;
  border-radius:5px;
  background:linear-gradient(#fff,#ccc);
  font-weight:800;
  font-size:10px;
  padding:2px;
}

#keyboard .space{
  grid-column:span 7;
}

#keyboard .wide{
  grid-column:span 2;
}

#flash{
  position:absolute;
  inset:0;
  z-index:80;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#flash.go{
  animation:pageFlash .42s ease;
}

@keyframes pageFlash{
  0%{opacity:0;transform:scale(.96)}
  35%{opacity:.55;transform:scale(1)}
  100%{opacity:0;transform:scale(1.04)}
}

@media(max-width:600px){
  #phone{
    width:100vw;
    transform:rotate(90deg) scale(.68);
  }
}

@media(max-height:700px){
  #phone{
    width:100vw;
    transform:rotate(90deg) scale(.68);
  }
}
</style>
</head>

<body>

<div id="phone">

  <div id="page1">

    <button data-app="messages" id="messages"></button>
    <button data-app="camera" id="camera"></button>
    <button data-app="splashface" id="splashface"></button>
    <button data-app="stocks" id="stocks"></button>
    <button data-app="maps" id="maps"></button>
    <button data-app="photos" id="photos"></button>
    <button data-app="weather" id="weather"></button>
    <button data-app="notes" id="notes"></button>
    <button data-app="peartunes" id="peartunes"></button>
    <button data-app="settings" id="settings"></button>
    <button data-app="clock" id="clock"></button>
    <button data-app="videos" id="videos"></button>
    <button data-app="phone" id="phone"></button>
    <button data-app="mail" id="mail"></button>
    <button data-app="compass" id="compass"></button>
    <button data-app="music" id="music"></button>

  </div>

  <div id="page2">
    <img src="page2.png" alt="Pear Phone second page">

    <!-- Put Page 2 hotspots here when needed -->

  </div>

  <button id="home" aria-label="Home"></button>

  <div id="overlay">
    <div id="app"></div>
  </div>

  <div id="keyboard"></div>

  <div id="flash"></div>

</div>

<script src="app.js"></script>

</body>
</html>
