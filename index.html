<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pear Phone OS</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

#phone-container {
  position: relative;
  width: min(82vw, 520px);
  aspect-ratio: 1212 / 1188;
  background: url("pear-phone.png") center/contain no-repeat;
}

/* CLICKABLE ICONS */

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  cursor: pointer;
  z-index: 20;
  touch-action: manipulation;
}

/* ICON POSITIONS */

#messages { left:43.1%; top:25.7%; width:9.6%; aspect-ratio:1; }
#camera { left:54%; top:25.7%; width:9.6%; aspect-ratio:1; }

#splashface { left:38%; top:36.1%; width:9.6%; aspect-ratio:1; }
#stocks { left:47.5%; top:36.1%; width:9.6%; aspect-ratio:1; }
#maps { left:57%; top:36.1%; width:9.6%; aspect-ratio:1; }

#photos { left:38%; top:46.9%; width:9.6%; aspect-ratio:1; }
#weather { left:47.5%; top:46.9%; width:9.6%; aspect-ratio:1; }
#notes { left:57%; top:46.9%; width:9.6%; aspect-ratio:1; }

#peartunes { left:32%; top:55.9%; width:9.6%; aspect-ratio:1; }
#settings { left:42%; top:55.9%; width:9.6%; aspect-ratio:1; }
#clock { left:52%; top:55.9%; width:9.6%; aspect-ratio:1; }
#videos { left:62%; top:55.9%; width:9.6%; aspect-ratio:1; }

#phone { left:32%; top:65.9%; width:9.6%; aspect-ratio:1; }
#mail { left:42%; top:65.9%; width:9.6%; aspect-ratio:1; }
#compass { left:52%; top:65.9%; width:9.6%; aspect-ratio:1; }
#music { left:62%; top:65.9%; width:9.6%; aspect-ratio:1; }

#home {
  position:absolute;
  left:46%;
  top:78.8%;
  width:8.2%;
  aspect-ratio:1;
  border:0;
  background:transparent;
  border-radius:50%;
  cursor:pointer;
  z-index:30;
}

/* SMALLER APP BOX */

#overlay {
  position:absolute;

  left:31%;
  top:22%;

  width:38%;
  height:47%;

  z-index:100;

  display:none;

  overflow:hidden;

  border-radius:8px;

  box-shadow:0 3px 12px rgba(0,0,0,.4);
}

#overlay.open {
  display:block;
}

#app-window {
  width:100%;
  height:100%;
  background:#f2f2f7;
  color:#111;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header {
  display:flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:5px 7px;
  background:linear-gradient(#fff,#e5e5e5);
  border-bottom:1px solid #aaa;
  font-size:12px;
  font-weight:bold;
  flex-shrink:0;
}

.back {
  width:27px;
  height:27px;
  border-radius:50%;
  border:1px solid #aaa;
  background:linear-gradient(#fff,#ddd);
  font-size:19px;
  cursor:pointer;
}

.content {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:9px;
  font-size:11px;
}

.content h1 {
  font-size:19px;
  margin:5px 0 10px;
}

.content h2 {
  font-size:15px;
  margin:5px 0 8px;
}

.content h3 {
  font-size:13px;
}

.button {
  padding:6px 9px;
  margin:2px;
  border-radius:8px;
  border:1px solid #aaa;
  background:linear-gradient(#fff,#ddd);
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
}

input,
textarea,
select {
  width:100%;
  padding:7px;
  margin-bottom:6px;
  border:1px solid #aaa;
  border-radius:8px;
  font-size:11px;
}

textarea {
  min-height:80px;
}

.card {
  background:white;
  border:1px solid #ddd;
  border-radius:9px;
  padding:8px;
  margin-bottom:7px;
}

.message {
  width:max-content;
  max-width:80%;
  padding:7px 9px;
  background:#ddd;
  border-radius:14px;
  margin-bottom:5px;
}

.message.me {
  margin-left:auto;
  background:#1689e8;
  color:white;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.big-icon {
  font-size:48px;
  text-align:center;
  margin:8px;
}

.progress {
  width:100%;
  height:8px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}

.progress div {
  height:100%;
  background:#1689e8;
  width:50%;
}

@media(max-width:600px) {
  #phone-container {
    width:90vw;
  }
}
</style>
</head>

<body>

<div id="phone-container">

<button class="hotspot" id="messages"></button>
<button class="hotspot" id="camera"></button>
<button class="hotspot" id="splashface"></button>
<button class="hotspot" id="stocks"></button>
<button class="hotspot" id="maps"></button>
<button class="hotspot" id="photos"></button>
<button class="hotspot" id="weather"></button>
<button class="hotspot" id="notes"></button>
<button class="hotspot" id="peartunes"></button>
<button class="hotspot" id="settings"></button>
<button class="hotspot" id="clock"></button>
<button class="hotspot" id="videos"></button>
<button class="hotspot" id="phone"></button>
<button class="hotspot" id="mail"></button>
<button class="hotspot" id="compass"></button>
<button class="hotspot" id="music"></button>

<button id="home"></button>

<div id="overlay">
  <div id="app-window"></div>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
