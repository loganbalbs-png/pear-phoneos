<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}


/* =================================
   PEAR PHONE IMAGE
================================= */

#phone-container {
    position: relative;

    width: min(82vw, 520px);

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
}


/* =================================
   CLICKABLE APPS
================================= */

.hotspot {
    position: absolute;

    border: none;
    background: transparent;

    padding: 0;
    margin: 0;

    border-radius: 50%;

    cursor: pointer;

    z-index: 20;

    touch-action: manipulation;
}


/* APP LOCATIONS */

#messages {
    left: 43.1%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#camera {
    left: 54%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#splashface {
    left: 38%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#stocks {
    left: 47.5%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#maps {
    left: 57%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#photos {
    left: 38%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#weather {
    left: 47.5%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#notes {
    left: 57%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#peartunes {
    left: 32%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#settings {
    left: 42%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#clock {
    left: 52%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#videos {
    left: 62%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#phone {
    left: 32%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#mail {
    left: 42%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#compass {
    left: 52%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#music {
    left: 62%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}


/* HOME BUTTON */

#home {
    position: absolute;

    left: 46%;
    top: 78.8%;

    width: 8.2%;
    aspect-ratio: 1;

    border: none;
    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    z-index: 30;
}


/* =================================
   APP WINDOW
   ONLY COVERS PEAR PHONE
================================= */

#overlay {
    position: absolute;

    /*
       The Pear Phone itself sits
       inside the image.
    */

    left: 25%;
    top: 7%;

    width: 50%;
    height: 88%;

    z-index: 100;

    display: none;

    overflow: hidden;

    /*
       This creates the Pear Phone shape.
       Everything outside this shape
       remains completely untouched.
    */

    clip-path: polygon(
        50% 0%,
        43% 2%,
        38% 6%,
        34% 12%,
        31% 20%,
        27% 30%,
        24% 41%,
        23% 51%,
        24% 62%,
        27% 73%,
        31% 82%,
        36% 89%,
        43% 95%,
        50% 100%,
        57% 95%,
        64% 89%,
        69% 82%,
        73% 73%,
        76% 62%,
        77% 51%,
        76% 41%,
        73% 30%,
        69% 20%,
        66% 12%,
        62% 6%,
        57% 2%
    );
}

#overlay.open {
    display: block;
}


/* =================================
   APP CONTENT
================================= */

#app-window {
    width: 100%;
    height: 100%;

    background: #f2f2f7;

    color: #111;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* HEADER */

.header {
    display: flex;
    align-items: center;

    gap: 8px;

    min-height: 45px;

    padding: 7px 10px;

    background:
        linear-gradient(
            #ffffff,
            #e5e5e5
        );

    border-bottom: 1px solid #aaa;

    font-size: 14px;

    font-weight: bold;
}

.back {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 21px;

    cursor: pointer;
}


/* CONTENT */

.content {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 12px;

    font-size: 12px;
}

.content h1 {
    font-size: 21px;
}

.content h2 {
    font-size: 17px;
}

.content h3 {
    font-size: 14px;
}


/* BUTTONS */

.button {
    padding: 7px 11px;

    border-radius: 9px;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}


/* INPUTS */

input,
textarea {
    width: 100%;

    padding: 8px;

    border: 1px solid #aaa;

    border-radius: 9px;

    font-size: 12px;
}

textarea {
    min-height: 100px;
}


/* CARDS */

.card {
    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 9px;

    margin-bottom: 7px;
}


/* MESSAGES */

.message {
    width: max-content;

    max-width: 80%;

    padding: 7px 10px;

    background: #ddd;

    border-radius: 14px;

    margin-bottom: 6px;
}

.message.me {
    margin-left: auto;

    background: #1689e8;

    color: white;
}


/* GRID */

.grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 6px;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

    #phone-container {
        width: 90vw;
    }

}

</style>
</head>


<body>


<div id="phone-container">


    <!-- CLICKABLE PEAR PHONE APPS -->

    <button
        class="hotspot"
        id="messages"
        aria-label="Messages">
    </button>

    <button
        class="hotspot"
        id="camera"
        aria-label="Camera">
    </button>

    <button
        class="hotspot"
        id="splashface"
        aria-label="SplashFace">
    </button>

    <button
        class="hotspot"
        id="stocks"
        aria-label="Stocks">
    </button>

    <button
        class="hotspot"
        id="maps"
        aria-label="Maps">
    </button>

    <button
        class="hotspot"
        id="photos"
        aria-label="Photos">
    </button>

    <button
        class="hotspot"
        id="weather"
        aria-label="Weather">
    </button>

    <button
        class="hotspot"
        id="notes"
        aria-label="Notes">
    </button>

    <button
        class="hotspot"
        id="peartunes"
        aria-label="PearTunes">
    </button>

    <button
        class="hotspot"
        id="settings"
        aria-label="Settings">
    </button>

    <button
        class="hotspot"
        id="clock"
        aria-label="Clock">
    </button>

    <button
        class="hotspot"
        id="videos"
        aria-label="Videos">
    </button>

    <button
        class="hotspot"
        id="phone"
        aria-label="Phone">
    </button>

    <button
        class="hotspot"
        id="mail"
        aria-label="Mail">
    </button>

    <button
        class="hotspot"
        id="compass"
        aria-label="Compass">
    </button>

    <button
        class="hotspot"
        id="music"
        aria-label="Music">
    </button>


    <!-- HOME -->

    <button
        id="home"
        aria-label="Home">
    </button>


    <!-- APP WINDOW -->

    <div id="overlay">

        <div id="app-window"></div>

    </div>


</div>


<script src="app.js"></script>


</body>
</html>
