<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}


/* =====================================================
   PEAR PHONE
===================================================== */

#phone-container {
    position: relative;

    width: min(82vw, 520px);

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
}


/* =====================================================
   CLICKABLE ICONS
===================================================== */

.hotspot {
    position: absolute;

    border: none;
    background: transparent;

    padding: 0;
    margin: 0;

    border-radius: 50%;

    cursor: pointer;

    z-index: 50;

    touch-action: manipulation;
}


/* =====================================================
   ICON POSITIONS
===================================================== */

#messages {
    left: 43.1%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#camera {
    left: 54%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#splashface {
    left: 38%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#stocks {
    left: 47.5%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#maps {
    left: 57%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#photos {
    left: 38%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#weather {
    left: 47.5%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#notes {
    left: 57%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#peartunes {
    left: 32%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#settings {
    left: 42%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#clock {
    left: 52%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#videos {
    left: 62%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#phone {
    left: 32%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#mail {
    left: 42%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#compass {
    left: 52%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#music {
    left: 62%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}


/* =====================================================
   HOME BUTTON
===================================================== */

#home {
    position: absolute;

    left: 46%;
    top: 78.8%;

    width: 8.2%;
    aspect-ratio: 1;

    border: none;
    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    z-index: 60;
}


/* =====================================================
   APP SCREEN
   FULL PEAR PHONE SHAPE
===================================================== */

#overlay {

    position: absolute;

    /*
       The app occupies the entire
       Pear Phone body.
    */

    left: 24.5%;
    top: 13%;

    width: 51%;
    height: 78%;

    z-index: 100;

    display: none;

    overflow: hidden;

    /*
       REAL PEAR-LIKE PHONE SHAPE

       Narrower at the top,
       widest around the middle/bottom,
       rounded bottom.
    */

    border-radius:
        46% 54%
        42% 58%
        /
        22% 22%
        78% 78%;
}


#overlay.open {
    display: block;
}


/* =====================================================
   APP
===================================================== */

#app-window {

    width: 100%;
    height: 100%;

    background: #f2f2f7;

    color: #111;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    align-items: center;

    gap: 10px;

    min-height: 48px;

    padding: 8px 12px;

    background:
        linear-gradient(
            #ffffff,
            #e5e5e5
        );

    border-bottom: 1px solid #aaa;

    font-size: 15px;

    font-weight: bold;
}


.back {

    width: 32px;
    height: 32px;

    border-radius: 50%;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 22px;

    cursor: pointer;
}


/* =====================================================
   APP CONTENT
===================================================== */

.content {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 14px;

    font-size: 13px;
}


.content h1 {
    font-size: 23px;
}

.content h2 {
    font-size: 19px;
}

.content h3 {
    font-size: 15px;
}


/* =====================================================
   BUTTONS
===================================================== */

.button {

    padding: 8px 12px;

    border-radius: 10px;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   INPUTS
===================================================== */

input,
textarea {

    width: 100%;

    padding: 9px;

    border: 1px solid #aaa;

    border-radius: 10px;

    font-size: 13px;
}


textarea {
    min-height: 120px;
}


/* =====================================================
   CARDS
===================================================== */

.card {

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 11px;

    margin-bottom: 9px;
}


/* =====================================================
   MESSAGES
===================================================== */

.message {

    width: max-content;

    max-width: 80%;

    padding: 8px 11px;

    background: #ddd;

    border-radius: 16px;

    margin-bottom: 7px;
}


.message.me {

    margin-left: auto;

    background: #1689e8;

    color: white;
}


/* =====================================================
   GRID
===================================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #phone-container {
        width: 90vw;
    }

}

</style>
</head>


<body>


<div id="phone-container">


    <!-- MESSAGES -->

    <button
        class="hotspot"
        id="messages"
        aria-label="Messages">
    </button>


    <!-- CAMERA -->

    <button
        class="hotspot"
        id="camera"
        aria-label="Camera">
    </button>


    <!-- SPLASHFACE -->

    <button
        class="hotspot"
        id="splashface"
        aria-label="SplashFace">
    </button>

    <button
        class="hotspot"
        id="stocks"
        aria-label="Stocks">
    </button>


    <!-- MAPS -->

    <button
        class="hotspot"
        id="maps"
        aria-label="Maps">
    </button>


    <!-- PHOTOS -->

    <button
        class="hotspot"
        id="photos"
        aria-label="Photos">
    </button>


    <!-- WEATHER -->

    <button
        class="hotspot"
        id="weather"
        aria-label="Weather">
    </button>


    <!-- NOTES -->

    <button
        class="hotspot"
        id="notes"
        aria-label="Notes">
    </button>


    <!-- PEARTUNES -->

    <button
        class="hotspot"
        id="peartunes"
        aria-label="PearTunes">
    </button>


    <!-- SETTINGS -->

    <button
        class="hotspot"
        id="settings"
        aria-label="Settings">
    </button>


    <!-- CLOCK -->

    <button
        class="hotspot"
        id="clock"
        aria-label="Clock">
    </button>


    <!-- VIDEOS -->

    <button
        class="hotspot"
        id="videos"
        aria-label="Videos">
    </button>


    <!-- PHONE -->

    <button
        class="hotspot"
        id="phone"
        aria-label="Phone">
    </button>


    <!-- MAIL -->

    <button
        class="hotspot"
        id="mail"
        aria-label="Mail">
    </button>


    <!-- COMPASS -->

    <button
        class="hotspot"
        id="compass"
        aria-label="Compass">
    </button>


    <!-- MUSIC -->

    <button
        class="hotspot"
        id="music"
        aria-label="Music">
    </button>


    <!-- HOME -->

    <button
        id="home"
        aria-label="Home">
    </button>


    <!-- APP WINDOW -->

    <div id="overlay">

        <div id="app-window"></div>

    </div>


</div>


<script src="app.js"></script>

</body>
</html>
