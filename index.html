<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Pear Phone OS</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

/* =========================================================
   PHONE
   ========================================================= */

#phone {
  position: relative;

  width: min(86vw, 760px);
  aspect-ratio: 1212 / 1188;

  background:
    url("pear-phone.jpg") center / contain no-repeat;

  transform: rotate(90deg) scale(.78);
  transform-origin: center center;

  touch-action: none;
  user-select: none;
}

/* =========================================================
   PAGE 1 HOTSPOTS
   ========================================================= */

.hotspot {
  position: absolute;

  border: 0;
  padding: 0;
  margin: 0;

  background: transparent;

  border-radius: 50%;

  cursor: pointer;

  z-index: 20;

  touch-action: manipulation;

  appearance: none;
  -webkit-appearance: none;
}

.hotspot:active {
  transform: scale(.92);
  background: rgba(255,255,255,.1);
}

/*
   These are deliberately smaller than the icons so
   neighboring apps cannot accidentally be triggered.
*/

#page1 [data-app="messages"] {
  left: 43.1%;
  top: 25.7%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="camera"] {
  left: 54%;
  top: 25.7%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="splashface"] {
  left: 38%;
  top: 36.1%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="stocks"] {
  left: 47.5%;
  top: 36.1%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="maps"] {
  left: 57%;
  top: 36.1%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="photos"] {
  left: 38%;
  top: 46.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="weather"] {
  left: 47.5%;
  top: 46.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="notes"] {
  left: 57%;
  top: 46.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="peartunes"] {
  left: 32%;
  top: 55.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="settings"] {
  left: 42%;
  top: 55.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="clock"] {
  left: 52%;
  top: 55.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="videos"] {
  left: 62%;
  top: 55.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="phone"] {
  left: 32%;
  top: 65.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="mail"] {
  left: 42%;
  top: 65.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="compass"] {
  left: 52%;
  top: 65.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

#page1 [data-app="music"] {
  left: 62%;
  top: 65.9%;
  width: 8.3%;
  aspect-ratio: 1;
}

/* =========================================================
   PAGE 2
   ========================================================= */

#page2 {
  display: none;

  position: absolute;

  left: 30%;
  right: 30%;
  top: 22%;
  bottom: 22%;

  z-index: 21;

  grid-template-columns: repeat(3, 1fr);

  grid-auto-rows: 1fr;

  gap: 3%;
}

#page2 button {
  border: 0;

  background: transparent;

  border-radius: 50%;

  cursor: pointer;

  touch-action: manipulation;
}

#page2 button:active {
  transform: scale(.92);

  background: rgba(255,255,255,.1);
}

/* =========================================================
   HOME BUTTON
   ========================================================= */

#home {
  position: absolute;

  left: 46%;
  top: 78.8%;

  width: 8.2%;
  aspect-ratio: 1;

  border: 0;

  background: transparent;

  border-radius: 50%;

  cursor: pointer;

  z-index: 30;
}

/* =========================================================
   APP WINDOW
   ========================================================= */

#app-overlay {
  position: absolute;

  left: 20%;
  top: 18%;

  width: 60%;
  height: 59%;

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.38);

  border-radius: 24px;

  overflow: hidden;
}

#app-overlay.open {
  display: flex;
}

#app-window {
  width: 94%;
  height: 94%;

  background: #f4f5f7;

  color: #111;

  border: 2px solid rgba(0,0,0,.55);

  border-radius: 18px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.5);

  display: flex;

  flex-direction: column;

  overflow: hidden;
}

/* =========================================================
   APP HEADER
   ========================================================= */

.app-header {
  flex: 0 0 auto;

  height: 43px;

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 5px 8px;

  background:
    linear-gradient(#fff,#e5e7ea);

  border-bottom: 1px solid #c7c9cc;

  font-size: 14px;

  font-weight: 900;
}

.app-header button {
  width: 30px;
  height: 30px;

  border-radius: 50%;

  border: 1px solid #aaa;

  background:
    linear-gradient(#fff,#ddd);

  font-size: 20px;

  line-height: 1;

  cursor: pointer;
}

/* =========================================================
   APP BODY
   ========================================================= */

.app-body {
  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding: 10px;

  -webkit-overflow-scrolling: touch;
}

button,
input,
textarea {
  font: inherit;
}

.app-body button {
  border: 1px solid #aaa;

  border-radius: 10px;

  background:
    linear-gradient(#fff,#ddd);

  padding: 8px 10px;

  font-weight: 700;

  cursor: pointer;
}

.app-body button:active {
  transform: scale(.97);
}

.app-body input,
.app-body textarea {
  font-size: 16px;

  border: 1px solid #aaa;

  border-radius: 10px;

  padding: 8px;

  outline: none;
}

.app-body textarea {
  width: 100%;

  min-height: 120px;
}

/* =========================================================
   COMMON APP ELEMENTS
   ========================================================= */

.row {
  display: flex;

  gap: 6px;
}

.bubble {
  padding: 8px 10px;

  background: #ddd;

  border-radius: 16px;

  width: max-content;

  max-width: 85%;

  margin-bottom: 6px;
}

.bubble.me {
  margin-left: auto;

  background: #168ee8;

  color: white;
}

.photos {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 5px;
}

.photos img {
  width: 100%;

  aspect-ratio: 1;

  object-fit: cover;

  border-radius: 8px;
}

.camera-video {
  width: 100%;

  background: black;

  border-radius: 12px;
}

.stock {
  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 9px;

  margin-bottom: 6px;

  background: white;

  border: 1px solid #ddd;

  border-radius: 10px;
}

.big {
  font-size: 38px;

  font-weight: 900;

  text-align: center;

  padding: 22px 0;
}

.map {
  height: 150px;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #d7e7ca,
      #e9dfb3
    );

  display: grid;

  place-items: center;

  font-size: 45px;
}

/* =========================================================
   CUSTOM PEAR KEYBOARD
   ========================================================= */

#pear-keyboard {
  position: absolute;

  left: 22%;
  right: 22%;

  bottom: 19%;

  z-index: 500;

  padding: 6px;

  border-radius: 14px;

  background:
    rgba(28,31,37,.97);

  box-shadow:
    0 8px 24px rgba(0,0,0,.5);

  display: none;

  grid-template-columns:
    repeat(10,1fr);

  gap: 3px;

  transform:
    translateY(120%);

  transition:
    transform .22s ease;
}

#pear-keyboard.show {
  display: grid;

  transform:
    translateY(0);
}

#pear-keyboard button {
  min-width: 0;

  height: 27px;

  padding: 0;

  border: 0;

  border-radius: 5px;

  background: #f0f0f0;

  color: #111;

  font-size: 10px;

  font-weight: 800;
}

#pear-keyboard .wide {
  grid-column: span 2;
}

#pear-keyboard .space {
  grid-column: span 5;
}

/* =========================================================
   PAGE ANIMATION
   ========================================================= */

#page-transition {
  position: absolute;

  inset: 0;

  z-index: 600;

  pointer-events: none;

  display: none;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.7),
      rgba(30,100,220,.45),
      transparent 70%
    );

  opacity: 0;
}

#page-transition.go {
  display: block;

  animation:
    pageZoom .42s ease;
}

@keyframes pageZoom {

  0% {
    opacity: 0;

    transform: scale(.7);
  }

  35% {
    opacity: .9;
  }

  100% {
    opacity: 0;

    transform: scale(1.15);
  }
}

@media(max-width:700px) {

  #phone {
    transform:
      rotate(90deg)
      scale(.67);
  }

}
</style>
</head>

<body>

<div id="phone">

  <!-- =====================================================

    <button data-app="weather"></button>

</html>
