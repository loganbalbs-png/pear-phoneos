/* =========================================================
   PHONE WRAPPER
   ========================================================= */

#phone-stage{
  position:relative;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#phone-container{
  position:relative;

  /*
    IMPORTANT:
    This keeps the original phone image.
    Nothing is being recreated in CSS.
  */
  width:min(88vw,760px);
  height:min(88vh,760px);

  background-image:url("./pear-phone.jpg");
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;

  transform:rotate(90deg);

  transform-origin:center center;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;
}

/*
  If the image takes a moment to load, don't show
  a giant blank area.
*/
#phone-container.loaded{
  background-color:transparent;
}

/* =========================================================
   PAGE 2 IMAGE
   ========================================================= */

#page2-image{

  /*
    This sits ONLY over the phone screen.
    It does not cover the shell or the three top circles.

  top:22.8%;
  width:26.5%;
  height:54.8%;

  object-fit:cover;

  display:none;

  pointer-events:none;

  z-index:2;

  border-radius:18%;
}

#phone-container.page-two #page2-image{
  display:block;
}

/* =========================================================

   ========================================================= */

#pear-keyboard{
  position:absolute;

  left:30%;
  right:30%;

  bottom:14%;

  z-index:500;

  display:none;

  padding:5px;

  border-radius:12px;

  background:rgba(25,25,28,.96);

  box-shadow:0 8px 25px rgba(0,0,0,.6);

  transition:
    opacity .18s ease,
    transform .18s ease;
}

#pear-keyboard.visible{
  display:block;

  animation:keyboardIn .18s ease;
}

@keyframes keyboardIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.keyboard-row{
  display:flex;

  gap:3px;

  margin-bottom:3px;
}

.keyboard-key{
  flex:1;

  min-width:0;

  height:25px;

  border-radius:5px;

  color:#fff;

.keyboard-wide{

/* =========================================================

   ========================================================= */

  transition:
    opacity .22s ease,

#page-transition.active{
  opacity:1;

<script>

/* =========================================================
   IMAGE CHECK
   ========================================================= */

const phoneContainer =
  document.getElementById("phone-container");

const phoneImage =
  new Image();

phoneImage.onload = function(){

  phoneContainer.classList.add("loaded");

};

phoneImage.onerror = function(){

  document.getElementById("asset-error").style.display="block";

};

phoneImage.src="./pear-phone.jpg";


/* =========================================================
   PAGE SYSTEM
   ========================================================= */

let currentPage=1;

let startY=0;
let startX=0;

function changePage(page){

  if(page===currentPage) return;

  const transition =
    document.getElementById("page-transition");

  transition.classList.add("active");

  setTimeout(()=>{

    currentPage=page;

    if(page===2){

      phoneContainer.classList.add("page-two");

    }else{

      phoneContainer.classList.remove("page-two");

    }

    setTimeout(()=>{

      transition.classList.remove("active");

    },100);

  },150);
}


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

phoneContainer.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length!==1) return;

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;

  },
  {passive:true}
);


phoneContainer.addEventListener(
  "touchend",
  function(e){

    if(e.changedTouches.length!==1) return;

    const endX=e.changedTouches[0].clientX;
    const endY=e.changedTouches[0].clientY;

    const dy=endY-startY;
    const dx=endX-startX;

    if(Math.abs(dy)<45) return;

    if(Math.abs(dy)<Math.abs(dx)) return;

    if(dy<0){

      changePage(2);

    }else{

      changePage(1);

    }

  },
  {passive:true}
);


/* =========================================================
   MOUSE / TRACKPAD DRAG
   ========================================================= */

let mouseDown=false;

phoneContainer.addEventListener(
  "mousedown",
  function(e){

    mouseDown=true;

    startX=e.clientX;
    startY=e.clientY;

  }
);

window.addEventListener(
  "mouseup",
  function(e){

    if(!mouseDown) return;

    mouseDown=false;

    const dx=e.clientX-startX;
    const dy=e.clientY-startY;

    if(Math.abs(dy)<45) return;

    if(Math.abs(dy)<Math.abs(dx)) return;

    if(dy<0){

      changePage(2);

    }else{

      changePage(1);

    }

  }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowUp"){

      changePage(2);

    }

    if(e.key==="ArrowDown"){

      changePage(1);

    }

  }
);

</script>
