<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Pear Phone OS</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;
        }

        body {
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            touch-action: manipulation;
        }

        /* ==========================================
           FULL IPHONE 17 SCREEN
           ========================================== */

        #phone-container {

            position: relative;

            width: 100vw;

            height: 100dvh;

            overflow: hidden;

            background-image: url("pear-phone.png");

            background-repeat: no-repeat;

            /*
               The original picture is almost square.
               Scaling by height makes the Pear Phone
               large enough to fill the regular iPhone 17.
            */
            background-size: auto 100%;

            background-position: center 50%;

            background-color: white;
        }

        /* ==========================================
           TOUCH AREAS
           ========================================== */

        .hotspot {

            position: absolute;

            border: none;

            background: transparent;

            padding: 0;

            margin: 0;

            border-radius: 50%;

            cursor: pointer;

            touch-action: manipulation;

            transition:
                transform 0.12s ease,
                background 0.12s ease;
        }

        .hotspot:active {

            transform: scale(.90);

            background: rgba(255,255,255,.08);
        }


        /* ==========================================
           APP LOCATIONS
           ========================================== */

        #messages {
            left: 43.2%;
            top: 26.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #camera {
            left: 54.2%;
            top: 26.0%;
            width: 9%;
            aspect-ratio: 1;
        }


        #splashface {
            left: 38.0%;
            top: 36.1%;
            width: 9%;
            aspect-ratio: 1;
        }

        #stocks {
            left: 47.5%;
            top: 36.1%;
            width: 9%;
            aspect-ratio: 1;
        }

        #maps {
            left: 57.0%;
            top: 36.1%;
            width: 9%;
            aspect-ratio: 1;
        }


        #photos {
            left: 38.0%;
            top: 47.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #weather {
            left: 47.5%;
            top: 47.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #notes {
            left: 57.0%;
            top: 47.0%;
            width: 9%;
            aspect-ratio: 1;
        }


        #peartunes {
            left: 32.0%;
            top: 56.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #settings {
            left: 42.0%;
            top: 56.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #clock {
            left: 52.0%;
            top: 56.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #videos {
            left: 62.0%;
            top: 56.0%;
            width: 9%;
            aspect-ratio: 1;
        }


        /* ==========================================
           BOTTOM DOCK
           ========================================== */

        #phone {
            left: 32.0%;
            top: 66.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #mail {
            left: 42.0%;
            top: 66.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #compass {
            left: 52.0%;
            top: 66.0%;
            width: 9%;
            aspect-ratio: 1;
        }

        #music {
            left: 62.0%;
            top: 66.0%;
            width: 9%;
            aspect-ratio: 1;
        }


        /* ==========================================
           HOME BUTTON
           ========================================== */

        #home {

            position: absolute;

            left: 46%;

            top: 79%;

            width: 8%;

            aspect-ratio: 1;

            border: none;

            border-radius: 50%;

            background: transparent;

            padding: 0;

            cursor: pointer;
        }


        /* ==========================================
           APP WINDOWS
           ========================================== */

        #overlay {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            justify-content: center;

            align-items: flex-start;

            padding:

                calc(
                    env(safe-area-inset-top)
                    + 12px
                )

                12px

                calc(
                    env(safe-area-inset-bottom)
                    + 12px
                );

            background:
                rgba(0,0,0,.62);

            backdrop-filter: blur(7px);
        }

        #overlay.open {
            display: flex;
        }


        #app-window {

            width: 100%;

            max-width: 430px;

            max-height:

                calc(
                    100dvh
                    - env(safe-area-inset-top)
                    - env(safe-area-inset-bottom)
                    - 24px
                );

            overflow: hidden;

            background: #f3f4f6;

            border-radius: 25px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.55);
        }


        .window-header {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 12px;

            background:
                linear-gradient(
                    #ffffff,
                    #e7e8ea
                );

            border-bottom:
                1px solid #ccc;

            font-weight: 900;

            font-size: 18px;
        }


        .back {

            width: 34px;
            height: 34px;

            border-radius: 50%;

            border: 1px solid #bbb;

            background:
                linear-gradient(
                    #ffffff,
                    #dddddd
                );

            font-size: 25px;

            line-height: 1;

            cursor: pointer;
        }


        .window-body {

            padding: 16px;

            overflow-y: auto;

            max-height:

                calc(
                    100dvh
                    - 100px
                );
        }


        .bubble {

            width: max-content;

            max-width: 82%;

            padding: 10px 13px;

            margin-bottom: 8px;

            border-radius: 18px;

            background: #dedfe3;
        }


        .bubble.me {

            margin-left: auto;

            color: white;

            background:
                linear-gradient(
                    #59b9ff,
                    #1588df
                );
        }


        .row {

            display: flex;

            gap: 8px;
        }


        input,
        textarea {

            border: 1px solid #bbb;

            border-radius: 12px;

            padding: 10px;

            background: white;

            outline: none;

            font-size: 16px;
        }


        textarea {

            width: 100%;

            min-height: 180px;

            resize: vertical;
        }


        .button {

            border: 1px solid #bbb;

            border-radius: 12px;

            padding: 10px 14px;

            background:
                linear-gradient(
                    #fff,
                    #ddd
                );

            cursor: pointer;

            font-weight: 700;
        }


        .camera-video {

            width: 100%;

            background: black;

            border-radius: 18px;
        }


        .photos {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 7px;
        }


        .photos img {

            width: 100%;

            aspect-ratio: 1;

            object-fit: cover;

            border-radius: 12px;
        }


        .stock {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px;

            margin-bottom: 8px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 14px;
        }


        /* ==========================================
           LANDSCAPE
           ========================================== */

        @media (orientation: landscape) {

            #phone-container {

                height: 100dvh;

                width: auto;

                min-width: 100vw;

                background-size: auto 100%;

            }

        }

    </style>
</head>


<body>


<div id="phone-container">

    <!-- MAIN APPS -->

    <button
        class="hotspot"
        id="messages"
        aria-label="Messages">
    </button>


    <button
        class="hotspot"
        id="camera"
        aria-label="Camera">
    </button>


    <button
        class="hotspot"
        id="splashface"
        aria-label="SplashFace">
    </button>


    <button
        class="hotspot"
        id="stocks"
        aria-label="Stocks">
    </button>


    <button
        class="hotspot"
        id="maps"
        aria-label="Maps">
    </button>


    <button
        class="hotspot"
        id="photos"
        aria-label="Photos">
    </button>


    <button
        class="hotspot"
        id="weather"
        aria-label="Weather">
    </button>


    <button
        class="hotspot"
        id="notes"
        aria-label="Notes">
    </button>


    <button
        class="hotspot"
        id="peartunes"
        aria-label="PearTunes">
    </button>


    <button
        class="hotspot"
        id="settings"
        aria-label="Settings">
    </button>


    <button
        class="hotspot"
        id="clock"
        aria-label="Clock">
    </button>


    <button
        class="hotspot"
        id="videos"
        aria-label="Videos">
    </button>


    <!-- BOTTOM DOCK -->

    <button
        class="hotspot"
        id="phone"
        aria-label="Phone">
    </button>


    <button
        class="hotspot"
        id="mail"
        aria-label="Mail">
    </button>


    <button
        class="hotspot"
        id="compass"
        aria-label="Compass">
    </button>


    <button
        class="hotspot"
        id="music"
        aria-label="Music">
    </button>


    <!-- HOME -->

    <button
        id="home"
        aria-label="Home">
    </button>

</div>


<div
    id="overlay">

    <div
        id="app-window">
    </div>

</div>


<script src="app.js"></script>

</body>
</html>
