<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Pear Phone OS</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   PHONE
========================================================= */

#phone-container {

    position: relative;

    width: min(170vh, 1500px);

    aspect-ratio: 1212 / 1188;

    transform: rotate(90deg);

    touch-action: none;

    overflow: visible;
}

/*
   IMPORTANT:

   The Pear Phone image and hotspot layer are BOTH absolute
   inside this exact same coordinate system.

   This prevents one layer from drifting away from the other.
*/

#phone-art {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    pointer-events: none;

    -webkit-user-drag: none;
}

/* =========================================================
   PAGE LAYERS
========================================================= */

.phone-page {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 10;

    pointer-events: none;

    overflow: hidden;
}

#page1-layer {

    opacity: 1;

    transform: translateY(0) scale(1);

    transition:
        opacity .32s ease,
        transform .42s cubic-bezier(.2,.8,.2,1);
}

#page2-layer {

    opacity: 0;

    transform: translateY(100%) scale(.96);

    transition:
        opacity .32s ease,
        transform .42s cubic-bezier(.2,.8,.2,1);
}

#phone-container.page-two #page1-layer {

    opacity: 0;

    transform: translateY(-100%) scale(.96);

}

#phone-container.page-two #page2-layer {

    opacity: 1;

    transform: translateY(0) scale(1);

}

/* =========================================================
   PAGE 2 IMAGE
========================================================= */

#page2-art {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;

    -webkit-user-drag: none;
}

/* =========================================================
   HOTSPOT LAYER
========================================================= */

.hotspot-layer {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/* =========================================================
   HOTSPOTS

   These are deliberately SMALLER than before.

   The old 10% hotspots could overlap neighbouring icons.
========================================================= */

.hotspot {

    position: absolute;

    display: block;

    padding: 0;
    margin: 0;

    border: 0;

    background: transparent;

    width: 7.8%;

    aspect-ratio: 1 / 1;

    pointer-events: auto;

    cursor: pointer;

    touch-action: manipulation;

    outline: none;

    -webkit-tap-highlight-color: transparent;

    z-index: 100;

}

/*
   Only the actual button receives the click.
*/

.hotspot::after {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 25%;

}

/*
   Very subtle press feedback.
*/

.hotspot:active::after {

    background: rgba(255,255,255,.12);

    transform: scale(.86);

}

/* =========================================================
   PAGE 1 ICON POSITIONS

   These positions represent the CENTER of each icon.
   Keeping the hotspot smaller prevents neighbouring
   applications from stealing clicks.
========================================================= */

/* Row 1 */

#messages {

    left: 44.2%;
    top: 26.7%;

}

#camera {

    left: 54.9%;
    top: 26.7%;

}

/* Row 2 */

#splashface {

    left: 39.1%;
    top: 37.0%;

}

#stocks {

    left: 49.0%;
    top: 37.0%;

}

#maps {

    left: 58.6%;
    top: 37.0%;

}

/* Row 3 */

#photos {

    left: 39.1%;
    top: 47.7%;

}

#weather {

    left: 49.0%;
    top: 47.7%;

}

#notes {

    left: 58.6%;
    top: 47.7%;

}

/* Row 4 */

#peartunes {

    left: 33.0%;
    top: 56.8%;

}

#settings {

    left: 43.0%;
    top: 56.8%;

}

#clock {

    left: 52.8%;
    top: 56.8%;

}

#videos {

    left: 62.4%;
    top: 56.8%;

}

/* Row 5 */

#phone {

    left: 33.0%;
    top: 66.8%;

}

#mail {

    left: 43.0%;
    top: 66.8%;

}

#compass {

    left: 52.8%;
    top: 66.8%;

}

#music {

    left: 62.4%;
    top: 66.8%;

}

/* =========================================================
   HOME
========================================================= */

#home {

    left: 46.6%;
    top: 78.8%;

    width: 7%;

}

/* =========================================================
   PAGE 2 ICONS
========================================================= */

.page2-hotspot {

    width: 7.4%;

    display: block;

    pointer-events: auto;

}

/* Page 2 Row 1 */

#p2-lingo {

    left: 38.0%;
    top: 24.8%;

}

#p2-splash {

    left: 51.8%;
    top: 24.8%;

}

#p2-thumb {

    left: 65.4%;
    top: 24.8%;

}

/* Page 2 Row 2 */

#p2-danwarp {

    left: 38.0%;
    top: 38.0%;

}

#p2-image {

    left: 51.8%;
    top: 38.0%;

}

#p2-chrono {

    left: 65.4%;
    top: 38.0%;

}

/* Page 2 Row 3 */

#p2-zaplook {

    left: 38.0%;
    top: 51.0%;

}

#p2-weather {

    left: 51.8%;
    top: 51.0%;

}

#p2-music {

    left: 65.4%;
    top: 51.0%;

}

/* Page 2 Row 4 */

#p2-monkey {

    left: 38.0%;
    top: 64.0%;

}

#p2-remark {

    left: 51.8%;
    top: 64.0%;

}

#p2-settings {

    left: 65.4%;
    top: 64.0%;

}

/* Page 2 Row 5 */

#p2-phone {

    left: 38.0%;
    top: 76.0%;

}

#p2-mail {

    left: 51.8%;
    top: 76.0%;

}

#p2-compass {

    left: 65.4%;
    top: 76.0%;

}

#p2-music2 {

    left: 51.8%;
    top: 87.0%;

}

/* =========================================================
   APP WINDOW
========================================================= */

#overlay {

    position: absolute;

    left: 30%;

    top: 21.5%;

    width: 40%;

    height: 49%;

    z-index: 500;

    display: none;

    overflow: hidden;

    border-radius: 10px;

    background: #f2f2f7;

    box-shadow:
        0 6px 24px rgba(0,0,0,.55);

    color: #111;

}

#overlay.open {

    display: block;

    animation: openApp .22s ease-out;

}

@keyframes openApp {

    0% {

        opacity: 0;

        transform: scale(.82);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}

#app-window {

    width: 100%;

    height: 100%;

    overflow-y: auto;

    overflow-x: hidden;

    background: #f2f2f7;

    color: #111;

    -webkit-overflow-scrolling: touch;

}

/* =========================================================
   APP HEADER
========================================================= */

.app-header {

    position: sticky;

    top: 0;

    z-index: 50;

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(245,245,247,.96);

    border-bottom: 1px solid #d1d1d6;

}

.app-title {

    font-size: 13px;

    font-weight: 700;

}

.back-button {

    position: absolute;

    left: 6px;

    top: 6px;

    width: 28px;

    height: 28px;

    border: none;

    border-radius: 50%;

    background: #dddde2;

    font-size: 21px;

    line-height: 20px;

    cursor: pointer;

}

/* =========================================================
   APP CONTENT
========================================================= */

.app-content {

    padding: 10px;

    padding-bottom: 20px;

    font-size: 11px;

}

.app-content h1,
.app-content h2,
.app-content h3,
.app-content p {

    margin-top: 5px;

}

.app-content input,
.app-content textarea,
.app-content select {

    width: 100%;

    padding: 8px;

    margin: 4px 0;

    border-radius: 8px;

    border: 1px solid #c7c7cc;

    background: white;

    color: #111;

    font-size: 11px;

    outline: none;

    font-family: Arial, Helvetica, sans-serif;

    -webkit-user-select: text;

    user-select: text;

}

.app-content textarea {

    resize: none;

}

.pear-button {

    border: none;

    border-radius: 8px;

    padding: 8px 10px;

    margin: 3px;

    background: #d9d9de;

    color: #111;

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;

}

.pear-button:active {

    transform: scale(.94);

}

.pear-button.wide {

    width: calc(100% - 6px);

}

.pear-button.green {

    background: #44bd61;

    color: white;

}

.pear-button.red {

    background: #ffb0b0;

}

/* =========================================================
   APP CARDS
========================================================= */

.app-card {

    background: white;

    border: 1px solid #ddd;

    border-radius: 9px;

    padding: 8px;

    margin-bottom: 6px;

}

.app-card:active {

    transform: scale(.98);

}

/* =========================================================
   KEYBOARD
========================================================= */

#pear-keyboard {

    position: absolute;

    left: 3%;

    bottom: 3%;

    width: 94%;

    padding: 6px;

    z-index: 1000;

    display: none;

    background: rgba(35,35,40,.97);

    border-radius: 11px;

    box-shadow: 0 5px 18px rgba(0,0,0,.55);

    transform: translateY(120%);

    opacity: 0;

    transition:
        transform .28s cubic-bezier(.22,.8,.25,1),
        opacity .2s ease;

}

#pear-keyboard.keyboard-show {

    transform: translateY(0);

    opacity: 1;

}

.keyboard-row {

    display: flex;

    gap: 3px;

    margin-bottom: 3px;

}

.keyboard-key {

    flex: 1;

    min-width: 0;

    height: 28px;

    border: none;

    border-radius: 5px;

    background: #f5f5f7;

    color: #111;

    font-size: 9px;

    font-weight: 700;

}

.keyboard-key:active {

    transform: scale(.88);

    background: #cfcfd4;

}

.keyboard-space {

    flex: 5;

}

/* =========================================================
   PAGE INDICATOR
========================================================= */

#page-dots {

    position: absolute;

    left: 50%;

    bottom: 2.2%;

    transform: translateX(-50%);

    z-index: 450;

    color: rgba(255,255,255,.85);

    font-size: 9px;

    pointer-events: none;

}

/* =========================================================
   SPECIAL APP STYLES
========================================================= */

.camera-preview {

    height: 135px;

    border-radius: 9px;

    background:
        radial-gradient(
            circle,
            #777 0 13%,
            #222 14% 20%,
            #555 21% 100%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-weight: bold;

}

.shutter {

    display: block;

    width: 52px;

    height: 52px;

    margin: 8px auto;

    border-radius: 50%;

    border: 5px solid #aaa;

    background: white;

}

.social-image {

    height: 90px;

    border-radius: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    background: #dce9ff;

    margin: 5px 0;

}

.weather-main {

    text-align: center;

}

.weather-temperature {

    font-size: 35px;

    font-weight: bold;

}

.music-art {

    height: 110px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 55px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #111,
            #777
        );

}

.dial-grid {

    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 5px;

}

.dial-grid button {

    height: 32px;

    border: none;

    border-radius: 50%;

    background: #ddd;

    font-weight: bold;

}

.dial-number {

    text-align: center;

    height: 30px;

    font-size: 20px;

}

.compass-circle {

    width: 125px;

    height: 125px;

    margin: 5px auto 10px;

    border: 5px solid #222;

    border-radius: 50%;

    position: relative;

    background: white;

}

.compass-circle .n {

    position: absolute;

    top: 4px;

    left: 50%;

}

.compass-circle .e {

    position: absolute;

    right: 5px;

    top: 47%;

}

.compass-circle .s {

    position: absolute;

    bottom: 4px;

    left: 48%;

}

.compass-circle .w {

    position: absolute;

    left: 5px;

    top: 47%;

}

.compass-needle {

    position: absolute;

    left: 50%;

    top: 20px;

    width: 3px;

    height: 80px;

    background: red;

    transform-origin: center;

}

.game-button {

    width: 100px;

    height: 100px;

    display: block;

    margin: 15px auto;

    border: none;

    border-radius: 50%;

    background: #ffe16b;

    font-size: 50px;

}

.warp-box {

    height: 120px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            45deg,
            #111,
            #888,
            #eee,
            #222
        );

    color: white;

    font-size: 20px;

    font-weight: bold;

    transition: .45s;

}

.photo-grid {

    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 4px;

}

.photo-tile {

    aspect-ratio: 1;

    border-radius: 7px;

    background: #ddd;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

}

.chart {

    height: 75px;

    display: flex;

    align-items: end;

    gap: 3px;

    background: white;

    border-radius: 8px;

    padding: 5px;

}

.chart-bar {

    flex: 1;

    background: #43a86b;

    border-radius: 3px 3px 0 0;

}

/* =========================================================
   DARK MODE
========================================================= */

.dark-app {

    background: #1c1c1e !important;

    color: white !important;

}

.dark-app .app-header {

    background: rgba(30,30,32,.96);

    color: white;

    border-color: #444;

}

.dark-app .app-card {

    background: #2c2c2e;

    border-color: #555;

}

.dark-app input,
.dark-app textarea {

    background: #2c2c2e;

    color: white;

    border-color: #555;

}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    #phone-container {

        width: 135vw;

    }

    #overlay {

        left: 29%;

        top: 21%;

        width: 42%;

        height: 49%;

    }

    .keyboard-key {

        height: 25px;

        font-size: 8px;

    }

}

</style>
</head>
