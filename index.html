<script>
/* =========================================================
   PEAR PHONE OS
   EVERYTHING IS INSIDE THIS FILE.
   NO APP.JS.
========================================================= */

const phone = document.getElementById("phone-container");
const overlay = document.getElementById("overlay");
const appWindow = document.getElementById("app-window");

let currentPage = 1;
let cameraStream = null;
let cameraFacing = "user";

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   PAGE SWITCHING
========================================================= */

function showPage(page){

  if(page === currentPage) return;

  currentPage = page;

  phone.classList.toggle(
    "page-two",
    page === 2
  );

  closeApp();

}

document.addEventListener("keydown",function(e){

  if(
    e.target.matches("input,textarea,select")
  ) return;

  if(e.key === "ArrowUp" && currentPage === 1){

    e.preventDefault();
    showPage(2);

  }

  if(e.key === "ArrowDown" && currentPage === 2){

    e.preventDefault();
    showPage(1);

  }

});

/* =========================================================
   TOUCH SWIPING
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

phone.addEventListener("touchstart",function(e){

  if(overlay.classList.contains("open")) return;

  if(!e.touches[0]) return;

  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;

},{passive:true});

phone.addEventListener("touchend",function(e){

  if(overlay.classList.contains("open")) return;

  if(!e.changedTouches[0]) return;

  const dx =
    e.changedTouches[0].clientX - touchStartX;

  const dy =
    e.changedTouches[0].clientY - touchStartY;

  if(
    Math.abs(dy) < 60 ||
    Math.abs(dy) <= Math.abs(dx)
  ) return;

  if(dy < 0 && currentPage === 1){
    showPage(2);
  }

  if(dy > 0 && currentPage === 2){
    showPage(1);
  }

},{passive:true});

/* =========================================================
   MOUSE / TRACKPAD SWIPE
========================================================= */

let mouseStartY = 0;
let mouseDragging = false;

phone.addEventListener("mousedown",function(e){

  if(overlay.classList.contains("open")) return;

  mouseStartY = e.clientY;
  mouseDragging = true;

});

phone.addEventListener("mouseup",function(e){

  if(!mouseDragging) return;

  mouseDragging = false;

  if(overlay.classList.contains("open")) return;

  const dy = e.clientY - mouseStartY;

  if(Math.abs(dy) < 60) return;

  if(dy < 0 && currentPage === 1){
    showPage(2);
  }

  if(dy > 0 && currentPage === 2){
    showPage(1);
  }

});

/* =========================================================
   APP SYSTEM
========================================================= */

function openApp(title,content){

  stopCamera();
  hideKeyboard(true);

  appWindow.innerHTML = `
    <div class="window-header">
      <button
        class="back"
        type="button"
        id="app-back"
      >‹</button>

      <strong>${escapeHTML(title)}</strong>
    </div>

    <div class="window-body">
      ${content}
    </div>
  `;

  overlay.classList.add("open");

  document
    .getElementById("app-back")
    .onclick = closeApp;

  setupKeyboard();

}

function closeApp(){

  stopCamera();
  hideKeyboard(true);

  overlay.classList.remove("open");

  appWindow.innerHTML = "";

}

/* =========================================================
   CAMERA
========================================================= */

function cameraApp(){

  openApp(
    "Camera",
    `
      <div class="card">

        <video
          id="camera-video"
          autoplay
          playsinline
          muted
        ></video>

        <div class="row">

          <button
            class="button"
            onclick="startCamera()"
          >
            📷 Start Camera
          </button>

          <button
            class="button"
            onclick="capturePhoto()"
          >
            ⭕ Take Photo
          </button>

          <button
            class="button"
            onclick="flipCamera()"
          >
            🔄 Flip Camera
          </button>

        </div>

        <div id="camera-photo"></div>

        <canvas
          id="camera-canvas"
          style="display:none"
        ></canvas>

      </div>
    `
  );

}

async function startCamera(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      alert(
        "Camera access requires HTTPS or localhost."
      );

      return;

    }

    stopCamera();

    const video =
      document.getElementById("camera-video");

    if(!video) return;

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          width:{ideal:1280},
          height:{ideal:720},
          facingMode:cameraFacing
        },

        audio:false

      });

    video.srcObject = cameraStream;

    await video.play().catch(()=>{});

    /*
      Try to use the Freenove / USB camera
      when one is connected.
    */

    try{

      const devices =
        await navigator.mediaDevices.enumerateDevices();

      const cameras =
        devices.filter(
          d => d.kind === "videoinput"
        );

      const usbCamera =
        cameras.find(
          d => /freenove/i.test(d.label)
        ) ||
        cameras.find(
          d => /usb|webcam|camera/i.test(d.label)
        );

      const currentTrack =
        cameraStream.getVideoTracks()[0];

      const currentId =
        currentTrack
          ?.getSettings?.()
          ?.deviceId || "";

      if(
        usbCamera &&
        usbCamera.deviceId &&
        usbCamera.deviceId !== currentId
      ){

        currentTrack.stop();

        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video:{
              deviceId:{
                exact:usbCamera.deviceId
              },
              width:{ideal:1280},
              height:{ideal:720}
            },

            audio:false

          });

        video.srcObject = cameraStream;

        await video.play().catch(()=>{});

      }

    }catch(error){

      console.log(
        "Using currently selected camera."
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "Camera access was not available. " +
      "Check your camera connection and browser permission."
    );

  }

}

function stopCamera(){

  if(!cameraStream) return;

  cameraStream
    .getTracks()
    .forEach(track => track.stop());

  cameraStream = null;

}

function flipCamera(){

  cameraFacing =
    cameraFacing === "user"
      ? "environment"
      : "user";

  startCamera();

}

function capturePhoto(){

  const video =
    document.getElementById("camera-video");

  const canvas =
    document.getElementById("camera-canvas");

  const photo =
    document.getElementById("camera-photo");

  if(!video || !canvas || !photo) return;

  if(!video.videoWidth){

    alert("Start the camera first.");
    return;

  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  photo.innerHTML = `
    <img
      src="${canvas.toDataURL("image/png")}"
    >
  `;

}

/* =========================================================
   MESSAGES
========================================================= */

const chats = {
  Chloe:[
    "Heyyy 👋",
    "What are you doing?",
    "HAHA wait 😭"
  ],
  Sam:[
    "Yo!",
    "Are you free later?",
    "That's actually crazy 😂"
  ],
  Cat:[
    "meow",
    "feed me",
    "MEOWWW 😼"
  ]
};

function messagesApp(){

  openApp(
    "Messages",
    `
      <div class="card">

        <h2>💬 Messages</h2>

        ${Object.keys(chats).map(name => `
          <button
            onclick="openChat('${name}')"
          >
            💬 ${name}
          </button>
        `).join("")}

        <button onclick="newMessage()">
          ✏️ New Message
        </button>

      </div>
    `
  );

}

function openChat(name){

  openApp(
    name,
    `
      <div class="card">

        <div id="chat-box">

          ${chats[name].slice(0,2).map(
            msg => `
              <div class="message received">
                ${escapeHTML(msg)}
              </div>
            `
          ).join("")}

        </div>

        <input
          id="message-input"
          placeholder="Message..."
        >

        <button
          onclick="sendMessage('${name}')"
        >
          Send
        </button>

        <button
          onclick="randomReply('${name}')"
        >
          🤖 Random Reply
        </button>

      </div>
    `
  );

}

function sendMessage(name){

  const input =
    document.getElementById("message-input");

  const chat =
    document.getElementById("chat-box");

  if(!input || !chat || !input.value.trim())
    return;

  chat.innerHTML += `
    <div class="message sent">
      ${escapeHTML(input.value)}
    </div>
  `;

  input.value = "";

  setTimeout(
    ()=>randomReply(name),
    500
  );

}

function randomReply(name){

  const chat =
    document.getElementById("chat-box");

  if(!chat) return;

  const list = chats[name];

  const reply =
    list[Math.floor(Math.random()*list.length)];

  chat.innerHTML += `
    <div class="message received">

document.addEventListener(
  "pointerup",
  function(e){

    const button =
      e.target.closest(".hotspot");

    if(!button) return;

    if(!phone.contains(button)) return;

    e.preventDefault();
    e.stopPropagation();

    if(overlay.classList.contains("open")){
      return;
    }

    const id = button.id;

    let app = null;

    if(currentPage === 1){

      if(!button.classList.contains("page1-hotspot"))
        return;

      app = page1Apps[id];

    }else{

      if(!button.classList.contains("page2-hotspot"))
        return;

      app = page2Apps[id];

    }

    if(typeof app === "function"){
      app();
    }

  },
  true
);

/* =========================================================
   CUSTOM KEYBOARD
========================================================= */

let keyboardTarget = null;
let keyboardShift = false;
let keyboardNumbers = false;

function setupKeyboard(){

  appWindow
    .querySelectorAll(
      "input,textarea"
    )
    .forEach(field=>{

      field.addEventListener(
        "focus",
        ()=>showKeyboard(field)
      );

      field.addEventListener(
        "click",
        ()=>showKeyboard(field)
      );

    });

}

function showKeyboard(field){

  keyboardTarget = field;

  let keyboard =
    document.getElementById("pear-keyboard");

  if(!keyboard){

    keyboard =
      document.createElement("div");

    keyboard.id = "pear-keyboard";

    keyboard.innerHTML = `
      <div class="keyboard-row" id="key-row1"></div>
      <div class="keyboard-row" id="key-row2"></div>
      <div class="keyboard-row" id="key-row3"></div>
      <div class="keyboard-row" id="key-row4"></div>
    `;

    appWindow.appendChild(keyboard);

  }

  renderKeyboard();

  keyboard.style.display = "block";

  requestAnimationFrame(()=>{
    keyboard.classList.add(
      "keyboard-show"
    );
  });

}

function hideKeyboard(immediate=false){

  const keyboard =
    document.getElementById("pear-keyboard");

  keyboardTarget = null;

  if(!keyboard) return;

  keyboard.classList.remove(
    "keyboard-show"
  );

  if(immediate){

    keyboard.style.display = "none";

  }else{

    setTimeout(()=>{
      keyboard.style.display = "none";
    },250);

  }

}

function renderKeyboard(){

  const keyboard =
    document.getElementById("pear-keyboard");

  if(!keyboard) return;

  const rows = [
    document.getElementById("key-row1"),
    document.getElementById("key-row2"),
    document.getElementById("key-row3"),
    document.getElementById("key-row4")
  ];

  rows.forEach(r=>r.innerHTML="");

  function key(row,text,fn,extra=""){

    const b =
      document.createElement("button");

    b.type="button";
    b.className =
      "pear-key "+extra;

    b.textContent=text;

    b.addEventListener(
      "pointerdown",
      e=>{
        e.preventDefault();
        e.stopPropagation();
      }
    );

    b.addEventListener(
      "pointerup",
      e=>{
        e.preventDefault();
        e.stopPropagation();
        fn();
      }
    );

    row.appendChild(b);

  }

  if(keyboardNumbers){

    "1234567890"
      .split("")
      .forEach(x=>
        key(rows[0],x,()=>typeKey(x))
      );

    "-/:;()$&@\""
      .split("")
      .forEach(x=>
        key(rows[1],x,()=>typeKey(x))
      );

    ".,?!'+=%*#"
      .split("")
      .forEach(x=>
        key(rows[2],x,()=>typeKey(x))
      );

  }else{

    const row1 =
      keyboardShift
        ? "QWERTYUIOP"
        : "qwertyuiop";

    const row2 =
      keyboardShift
        ? "ASDFGHJKL"
        : "asdfghjkl";

    const row3 =
      keyboardShift
        ? "ZXCVBNM"
        : "zxcvbnm";

    row1.split("").forEach(x=>
      key(
        rows[0],
        x.toUpperCase(),
        ()=>typeKey(x)
      )
    );

    row2.split("").forEach(x=>
      key(
        rows[1],
        x.toUpperCase(),
        ()=>typeKey(x)
      )
    );

    key(
      rows[2],
      "⇧",
      ()=>{
        keyboardShift=!keyboardShift;
        renderKeyboard();
      },
      "wide"
    );

    row3.split("").forEach(x=>
      key(
        rows[2],
        x.toUpperCase(),
        ()=>typeKey(x)
      )
    );

    key(
      rows[2],
      "⌫",
      backspace,
      "wide"
    );

  }

  key(
    rows[3],
    keyboardNumbers ? "ABC" : "123",
    ()=>{
      keyboardNumbers=!keyboardNumbers;
      keyboardShift=false;
      renderKeyboard();
    },
    "wide"
  );

  key(
    rows[3],
    "SPACE",
    ()=>typeKey(" "),
    "space"
  );

  key(
    rows[3],
    "↵",
    ()=>{
      if(keyboardTarget)
        keyboardTarget.blur();

      hideKeyboard();

    },
    "enter"
  );

}

function typeKey(char){

  if(!keyboardTarget) return;

  const field =
    keyboardTarget;

  const start =
    field.selectionStart ??
    field.value.length;

  const end =
    field.selectionEnd ??
    start;

  const value =
    keyboardNumbers
      ? char
      : keyboardShift
        ? char.toUpperCase()
        : char.toLowerCase();

  field.value =
    field.value.substring(0,start) +
    value +
    field.value.substring(end);

  field.setSelectionRange(
    start + value.length,
    start + value.length
  );

  field.dispatchEvent(
    new Event(
      "input",
      {bubbles:true}
    )
  );

  if(
    keyboardShift &&
    !keyboardNumbers
  ){

    keyboardShift=false;
    renderKeyboard();

  }

}

function backspace(){

  if(!keyboardTarget) return;

  const field =
    keyboardTarget;

  const start =
    field.selectionStart ??
    field.value.length;

  const end =
    field.selectionEnd ??
    start;

  if(start === end && start > 0){

    field.value =
      field.value.substring(0,start-1) +
      field.value.substring(end);

    field.setSelectionRange(
      start-1,
      start-1
    );

  }else{

    field.value =
      field.value.substring(0,start) +
      field.value.substring(end);

    field.setSelectionRange(
      start,
      start
    );

  }

  field.dispatchEvent(
    new Event(
      "input",
      {bubbles:true}
    )
  );

}
