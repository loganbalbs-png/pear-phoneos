<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pear Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .phone-container {
            position: relative;
            width: 380px;
            max-width: 90vw;
        }

        .phone-image {
            width: 100%;
            display: block;
        }

        /*
        APP BUTTONS
        Change these positions if your Pear Phone image
        has the apps in different locations.
        */

        .app {
            position: absolute;
            border: none;
            background: transparent;
            cursor: pointer;
            width: 55px;
            height: 55px;
            border-radius: 14px;
        }

        .app:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Row 1 */
        .app1 {
            left: 21%;
            top: 27%;
        }

        .app2 {
            left: 39%;
            top: 27%;
        }

        .app3 {
            left: 57%;
            top: 27%;
        }

        .app4 {
            left: 75%;
            top: 27%;
        }

        /* Row 2 */
        .app5 {
            left: 21%;
            top: 40%;
        }

        .app6 {
            left: 39%;
            top: 40%;
        }

        .app7 {
            left: 57%;
            top: 40%;
        }

        .app8 {
            left: 75%;
            top: 40%;
        }

        /* Row 3 */
        .app9 {
            left: 21%;
            top: 53%;
        }

        .app10 {
            left: 39%;
            top: 53%;
        }

        .app11 {
            left: 57%;
            top: 53%;
        }

        .app12 {
            left: 75%;
            top: 53%;
        }

        /* Popup */
        .app-window {
            display: none;
            position: absolute;
            left: 10%;
            top: 15%;
            width: 80%;
            height: 70%;
            background: white;
            border-radius: 20px;
            z-index: 20;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }

        .app-window.active {
            display: block;
        }

        .app-header {
            height: 55px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        .close-button {
            margin-right: 12px;
            border: none;
            background: #eee;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .app-content {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="phone-container">

        <!-- YOUR PEAR PHONE IMAGE -->
        <img
            src="images/pear-phone.png"
            class="phone-image"
            alt="Pear Phone"
        >

        <!-- CLICKABLE APPS -->

        <button class="app app1" onclick="openApp('Pear Mail')"></button>
        <button class="app app2" onclick="openApp('Pear Music')"></button>
        <button class="app app3" onclick="openApp('Pear Camera')"></button>
        <button class="app app4" onclick="openApp('Pear Maps')"></button>

        <button class="app app5" onclick="openApp('Pear Messages')"></button>
        <button class="app app6" onclick="openApp('Pear Photos')"></button>
        <button class="app app7" onclick="openApp('Pear Browser')"></button>
        <button class="app app8" onclick="openApp('Pear TV')"></button>

        <button class="app app9" onclick="openApp('Pear Games')"></button>
        <button class="app app10" onclick="openApp('Pear Notes')"></button>
        <button class="app app11" onclick="openApp('Pear Weather')"></button>
        <button class="app app12" onclick="openApp('Settings')"></button>


        <!-- APP WINDOW -->

        <div id="appWindow" class="app-window">

            <div class="app-header">

                <button
                    class="close-button"
                    onclick="closeApp()"
                >
                    ×
                </button>

                <span id="appTitle">App</span>

            </div>

            <div
                id="appContent"
                class="app-content"
            ></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
