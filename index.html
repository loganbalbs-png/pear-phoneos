<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

/* =========================================================
   PHONE — LARGE / ORIGINAL LOOK
   ========================================================= */

#phone{
  position:relative;

  width:min(86vw,760px);
  aspect-ratio:1212/1188;

  background:
    url("pear-phone.jpg") center/contain no-repeat,
    radial-gradient(#20252b,#000);

  /*
    KEEP THE PHONE SIDEWAYS.
    DO NOT animate or change this transform.
  */
  transform:rotate(90deg) scale(.78);
  transform-origin:center center;

  touch-action:none;

  flex:none;
}

/* =========================================================
   PAGE 1
   ========================================================= */

#page1{
  position:absolute;
  inset:0;
  z-index:20;
}

.hotspot{
  position:absolute;

  border:0;
  background:transparent;

  padding:0;
  margin:0;

  border-radius:50%;

  z-index:30;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-appearance:none;
  appearance:none;

  pointer-events:auto;
}

.hotspot:active{
  background:#ffffff18;
  transform:scale(.92);
}

/* =========================================================
   PAGE 2
   ========================================================= */

#page2{
  display:none;

  position:absolute;

  left:30%;
  right:25%;
  top:22%;
  bottom:22%;

  z-index:40;

  grid-template-columns:repeat(3,1fr);
  grid-auto-rows:1fr;

  gap:5%;
}

#page2 button{
  border:0;
  background:transparent;
  border-radius:50%;

  cursor:pointer;
}

#page2 button:active{
  background:#fff2;
  transform:scale(.92);
}

/* =========================================================
   HOME
   ========================================================= */

#home{
  position:absolute;

  left:46%;
  top:78.8%;

  width:8.2%;
  aspect-ratio:1;

  border:0;
  background:transparent;

  border-radius:50%;

  cursor:pointer;

  z-index:60;

  touch-action:manipulation;
}

/* =========================================================
   APP OVERLAY
   ========================================================= */

/*
   IMPORTANT:
   This is INSIDE the phone.
   It does not move the phone.
   It does not rotate separately.
*/

#overlay{
  position:absolute;

  left:20%;
  top:18%;

  width:60%;
  height:59%;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  background:#0006;

  border-radius:22px;

  overflow:hidden;

  /*
    Prevents the overlay from causing the phone
    to visually jump when opened.
  */
  transform:none;
}

#overlay.open{
  display:flex;
}

/* =========================================================
   APP
   ========================================================= */

#app{
  width:94%;
  height:94%;

  background:#f4f5f7;
  color:#111;

  border:2px solid #333;

  border-radius:17px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  transform:none;
}

/* =========================================================
   APP HEADER
   ========================================================= */

.head{
  height:42px;

  flex:none;

  display:flex;
  align-items:center;

  gap:8px;

  padding:5px 8px;

  background:linear-gradient(#fff,#e5e5e5);

  border-bottom:1px solid #bbb;

  font-weight:900;
}

.head button{
  width:30px;
  height:30px;

  border-radius:50%;

  border:1px solid #aaa;

  background:#ddd;

  font-size:20px;

  cursor:pointer;
}

/* =========================================================
   APP BODY
   ========================================================= */

.body{
  flex:1;

  min-height:0;

  overflow:auto;

  padding:10px;

  -webkit-overflow-scrolling:touch;
}

.body button{
  border:1px solid #aaa;

  border-radius:9px;

  background:linear-gradient(#fff,#ddd);

  padding:8px;

  font-weight:700;

  cursor:pointer;
}

.body input,
.body textarea{
  font-size:16px;

  padding:8px;

  border:1px solid #aaa;

  border-radius:9px;

  outline:none;
}

.body textarea{
  width:100%;
  min-height:110px;
}

.row{
  display:flex;
  gap:6px;
}

.bubble{
  background:#ddd;

  border-radius:15px;

  padding:8px 10px;

  margin-bottom:6px;

  width:max-content;

  max-width:85%;
}

.me{
  margin-left:auto;

  background:#168ee8;

  color:#fff;
}

.photos{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:5px;
}

.photos img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  border-radius:7px;
}

.video{
  width:100%;

  background:#000;

  border-radius:10px;
}

.stock{
  display:flex;

  justify-content:space-between;

  background:#fff;

  border:1px solid #ddd;

  border-radius:9px;

  padding:8px;

  margin-bottom:5px;
}

.big{
  text-align:center;

  font-size:42px;

  font-weight:900;

  padding:20px;
}

.map{
  height:150px;

  display:grid;

  place-items:center;

  border-radius:10px;

  background:linear-gradient(
    135deg,
    #d8e8ca,
    #e8dfb5
  );

  font-size:45px;
}

/* =========================================================
   KEYBOARD
   ========================================================= */

#keyboard{
  position:absolute;

  left:3%;
  right:3%;

  bottom:2%;

  z-index:500;

  display:none;

  grid-template-columns:repeat(10,1fr);

  gap:3px;

  padding:6px;

  background:#202329ee;

  border-radius:13px;

  transform:translateY(120%);

  transition:transform .2s ease;
}

#keyboard.show{
  display:grid;

  transform:translateY(0);
}

#keyboard button{
  height:26px;

  border:0;

  border-radius:5px;

  font-size:9px;

  font-weight:800;

  cursor:pointer;
}

.space{
  grid-column:span 5;
}

.wide{
  grid-column:span 2;
}

/* =========================================================
   FLASH
   ========================================================= */

#flash{
  position:absolute;

  inset:0;

  z-index:600;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle,
      #fff8,
      #267dff4d,
      transparent 70%
    );
}

#flash.go{
  animation:f .4s ease;
}

@keyframes f{
  0%{
    opacity:0;
    transform:scale(.7);
  }

  35%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:scale(1.15);
  }
}

/* =========================================================
   IMPORTANT:
   NO MOBILE .66 SCALE
   ========================================================= */

/*
   The old code was shrinking the phone to .66 here.
   That is what made it look zoomed out.

   Keep the same large .78 scale everywhere.
*/

@media(max-width:700px){

  #phone{
    width:min(86vw,760px);

    transform:rotate(90deg) scale(.78);

    transform-origin:center center;
  }
}

@media(max-height:700px){

  #phone{
    width:min(86vw,760px);

    transform:rotate(90deg) scale(.78);

    transform-origin:center center;
  }
}
