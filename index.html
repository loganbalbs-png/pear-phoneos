html,body{

/* =========================
   PEAR PHONE
========================= */

#phone-container{
  position:relative;

  width:min(170vh,1500px);

  aspect-ratio:1212 / 1188;

  background:url("pear-phone.png") center/contain no-repeat;

  transform:rotate(90deg);

  transform-origin:center center;

  touch-action:none;
  user-select:none;
}

/* =========================
   PAGE 2 IMAGE
========================= */

#page2{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  background:url("page2.png") center/contain no-repeat;

  z-index:50;

  pointer-events:none;

  opacity:0;

  transform:translateY(100%) scale(.96);

  transition:
    transform .45s cubic-bezier(.22,.8,.25,1),
    opacity .3s ease;
}

#phone-container.page-two #page2{
  opacity:1;

  transform:translateY(0) scale(1);
}

/* =========================
   HOTSPOTS
========================= */

.hotspot{
  position:absolute;

  border:0 !important;
  outline:none !important;

  background:transparent !important;

  padding:0;
  margin:0;

  border-radius:50%;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-appearance:none;
  appearance:none;

  box-shadow:none !important;

  z-index:200;
}

.hotspot:hover,
.hotspot:focus,
.hotspot:focus-visible{
  background:transparent !important;
  outline:none !important;
  box-shadow:none !important;
}

.hotspot:active{
  transform:scale(.93);
}

/* =========================
   APP HEADER
========================= */

.app-header{
  flex:0 0 auto;

  display:flex;
  align-items:center;

  gap:8px;

  padding:8px 10px;

  background:linear-gradient(#fff,#e7e8ea);

  border-bottom:1px solid #ccc;

}

  font-size:23px;

  line-height:25px;

  cursor:pointer;

  padding:0;
}

/* =========================

========================= */

  overflow-y:auto;

  padding:12px;

  padding-bottom:15px;

  -webkit-overflow-scrolling:touch;
}

}

}

.app-content p{

}

  margin-bottom:9px;
}

  border-radius:11px;

  border:1px solid #bbb;

  background:linear-gradient(#fff,#ddd);

  color:#111;

  font-weight:700;

  cursor:pointer;

  margin:3px;

  font-family:inherit;
}

.app-button:active,
.button:active{
  transform:scale(.96);
}

.row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

input,
textarea,
select{
  width:100%;

  font-family:inherit;

  font-size:16px;

  padding:9px;

  border:1px solid #bbb;

  border-radius:10px;

  outline:none;

  background:#fff;

  color:#111;
}

textarea{

}

.bubble{

  width:max-content;
  max-width:82%;

  background:#dedfe3;

  border-radius:17px;

  margin-bottom:7px;
}

.bubble.me{
  margin-left:auto;

  background:linear-gradient(#58b9ff,#1389df);

  color:#fff;
}

.stock{
  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:10px;

  margin-bottom:7px;

  background:#fff;

  border:1px solid #ddd;

  border-radius:12px;
}

.photos{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:6px;
}

.photos img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  border-radius:10px;
}

.camera-video{
  width:100%;

  border-radius:14px;

  background:#000;
}

.map{
  height:180px;

  border-radius:15px;

  background:linear-gradient(135deg,#d6e5c7,#e7dfb9);

  align-items:center;
  justify-content:center;

  font-size:55px;
}

.big-display{
  text-align:center;

  font-size:38px;

  font-weight:900;

  padding:20px 5px;
}

.progress{
  height:12px;

  border-radius:20px;

  overflow:hidden;

  background:#ddd;

  margin:10px 0;
}

.progress-bar{
  height:100%;

  width:50%;

  background:#55a9ef;

  transition:width .2s ease;
}

  border-radius:10px;

  background:#eef0f2;

  border:0;

/*

<script>

/* ============================================================
   CORE
============================================================ */

const phone = document.getElementById("phone-container");
const overlay = document.getElementById("overlay");
const appWindow = document.getElementById("app-window");

let currentPage = 1;
let cameraStream = null;
let audioContext = null;
let typingInterval = null;
let keyboardTarget = null;
let keyboardShift = false;

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showPage(page){

  if(overlay.classList.contains("open")){
    closeApp();
  }

  currentPage = page;

  if(page === 2){
    phone.classList.add("page-two");
  }else{
    phone.classList.remove("page-two");
  }
}

function goHome(){
  closeApp();
  showPage(1);
}

/* ============================================================
   PAGE SWITCHING
============================================================ */

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowUp"){
    e.preventDefault();
    showPage(2);
  }

  if(e.key === "ArrowDown"){
    e.preventDefault();
    showPage(1);
  }

  if(e.key === "Escape"){
    closeApp();
  }

});

let touchStartX = 0;
let touchStartY = 0;

phone.addEventListener("touchstart",function(e){

  if(!e.touches.length) return;

  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;

},{passive:true});

phone.addEventListener("touchend",function(e){

  if(!e.changedTouches.length) return;

  if(overlay.classList.contains("open")) return;

  const x = e.changedTouches[0].clientX;
  const y = e.changedTouches[0].clientY;

  const dx = x - touchStartX;
  const dy = y - touchStartY;

  if(Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx)){

    if(dy < 0){
      showPage(2);
    }else{
      showPage(1);
    }

  }

},{passive:true});

let mouseStartX = 0;
let mouseStartY = 0;
let mouseDown = false;

phone.addEventListener("mousedown",function(e){

  if(e.button !== 0) return;

  mouseDown = true;
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;

});

phone.addEventListener("mouseup",function(e){

  if(!mouseDown) return;

  mouseDown = false;

  if(overlay.classList.contains("open")) return;

  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;

  if(Math.abs(dy) > 80 && Math.abs(dy) > Math.abs(dx)){

    if(dy < 0){
      showPage(2);
    }else{
      showPage(1);
    }

  }

});

/* ============================================================
   APP WINDOW
============================================================ */

function openApp(title,content){

  stopCamera();

  if(typingInterval){
    clearInterval(typingInterval);
    typingInterval = null;
  }

  appWindow.innerHTML = `
    <div class="app-header">
      <button class="back-button" id="app-back">‹</button>
      <strong>${escapeHTML(title)}</strong>
    </div>

    <div class="app-content">
      ${content}
    </div>
  `;

  overlay.classList.add("open");

  document.getElementById("app-back").onclick = closeApp;

  setupKeyboardFields();
}

function closeApp(){

  stopCamera();

  if(typingInterval){
    clearInterval(typingInterval);
    typingInterval = null;
  }

  hidePearKeyboard();

  overlay.classList.remove("open");

  appWindow.innerHTML = "";
}

/* ============================================================
   CUSTOM KEYBOARD
============================================================ */

function setupKeyboardFields(){

  document.querySelectorAll(
    "#app-window input, #app-window textarea"
  ).forEach(field => {

    field.addEventListener("focus",function(){
      keyboardTarget = this;
      showPearKeyboard(this);
    });

    field.addEventListener("blur",function(){
      setTimeout(() => {

        if(
          document.activeElement !== keyboardTarget
        ){
          hidePearKeyboard();
        }

      },80);
    });

  });

}

function showPearKeyboard(field){

  keyboardTarget = field;

  let keyboard = document.getElementById("pear-keyboard");

  if(!keyboard){

    keyboard = document.createElement("div");

    keyboard.id = "pear-keyboard";

    keyboard.innerHTML = `
      <div class="pear-keyboard-row">
        ${"QWERTYUIOP".split("").map(x =>
          `<button type="button" data-key="${x}">${x}</button>`
        ).join("")}
      </div>

      <div class="pear-keyboard-row">
        ${"ASDFGHJKL".split("").map(x =>
          `<button type="button" data-key="${x}">${x}</button>`
        ).join("")}
      </div>

      <div class="pear-keyboard-row">
        <button type="button" id="pear-shift">⇧</button>
        ${"ZXCVBNM".split("").map(x =>
          `<button type="button" data-key="${x}">${x}</button>`
        ).join("")}
        <button type="button" id="pear-backspace">⌫</button>
      </div>

      <div class="pear-keyboard-row bottom">
        <button type="button" id="pear-number">123</button>
        <button type="button" id="pear-space">SPACE</button>
        <button type="button" id="pear-enter">↵</button>
      </div>
    `;

    overlay.appendChild(keyboard);

    keyboard.querySelectorAll("[data-key]").forEach(btn => {

      btn.addEventListener("pointerdown",function(e){

        e.preventDefault();

        if(!keyboardTarget) return;

        insertText(
          keyboardTarget,
          keyboardShift
            ? this.dataset.key
            : this.dataset.key.toLowerCase()
        );

        keyboardShift = false;

      });

    });

    document.getElementById("pear-shift").onclick = function(){
      keyboardShift = !keyboardShift;
      this.style.background = keyboardShift
        ? "#9fd3ff"
        : "#f5f5f7";
    };

    document.getElementById("pear-backspace").onclick =
      keyboardBackspace;

    document.getElementById("pear-space").onclick =
      keyboardSpace;

    document.getElementById("pear-enter").onclick =
      keyboardEnter;

    document.getElementById("pear-number").onclick =
      keyboardNumber;

  }

  keyboard.style.display = "block";

  requestAnimationFrame(() => {
    keyboard.classList.add("keyboard-show");
  });
}

function hidePearKeyboard(){

  const keyboard =
    document.getElementById("pear-keyboard");

  if(!keyboard) return;

  keyboard.classList.remove("keyboard-show");

  setTimeout(() => {

    if(!keyboard.classList.contains("keyboard-show")){
      keyboard.style.display = "none";
    }

  },280);

  keyboardTarget = null;
}

function insertText(field,text){

  if(!field) return;

  const start = field.selectionStart ?? field.value.length;
  const end = field.selectionEnd ?? field.value.length;

  field.value =
    field.value.substring(0,start) +
    text +
    field.value.substring(end);

  field.selectionStart =
    field.selectionEnd =
    start + text.length;

  field.dispatchEvent(
    new Event("input",{bubbles:true})
  );
}

function keyboardSpace(){

  if(keyboardTarget){
    insertText(keyboardTarget," ");
  }

}

function keyboardEnter(){

  /*
    ENTER NOW CLOSES THE KEYBOARD.
    It does NOT insert a newline.
  */

  if(keyboardTarget){
    keyboardTarget.blur();
  }

  hidePearKeyboard();
}

function keyboardBackspace(){

  const field = keyboardTarget;

  if(!field) return;

  const start = field.selectionStart;
  const end = field.selectionEnd;

  if(start !== end){

    field.value =
      field.value.substring(0,start) +
      field.value.substring(end);

    field.selectionStart =
      field.selectionEnd =
      start;

  }else if(start > 0){

    field.value =
      field.value.substring(0,start - 1) +
      field.value.substring(end);

    field.selectionStart =
      field.selectionEnd =
      start - 1;
  }

  field.dispatchEvent(
    new Event("input",{bubbles:true})
  );
}

function keyboardNumber(){

  if(!keyboardTarget) return;

  insertText(
    keyboardTarget,
    "1234567890"
  );
}

/* ============================================================
   SOUND
============================================================ */

function playTone(freq=440,duration=.12){

  try{

    if(localStorage.getItem("pear-sound") === "false"){
      return;
    }

    audioContext =
      audioContext ||
      new (window.AudioContext ||
           window.webkitAudioContext)();

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
      .08,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(
      audioContext.currentTime + duration
    );

  }catch(e){}

}

async function cameraApp(){

  openApp(
    "Camera",
    `
      <video
        id="camera-preview"
        class="camera-video"
        autoplay
        playsinline
      ></video>

      <div class="row">

        <button class="app-button" id="camera-start">
          📷 Start Camera
        </button>

        <button class="app-button" id="camera-capture">
          ⭕ Capture
        </button>

      </div>

      <canvas
        id="camera-canvas"
        style="display:none"
      ></canvas>

      <div id="camera-result"></div>
    `
  );

  document.getElementById("camera-start").onclick =
    startCamera;

  document.getElementById("camera-capture").onclick =
    captureCamera;

  await startCamera();
}

async function startCamera(){

  const video =
    document.getElementById("camera-preview");

  if(!video) return;

  try{

    stopCamera();

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"environment"
        },
        audio:false
      });

    video.srcObject = cameraStream;

  }catch(error){

    video.parentElement.insertAdjacentHTML(
      "beforeend",
      `
        <div class="result">
          Camera access was blocked or unavailable.
          Check your browser's camera permission.
        </div>
      `
    );

  }
}

function captureCamera(){

  const video =
    document.getElementById("camera-preview");

  const canvas =
    document.getElementById("camera-canvas");

  if(!video || !canvas || !video.videoWidth){
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d")
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  const image =
    document.createElement("img");

  image.src =
    canvas.toDataURL("image/jpeg",.9);

  image.style.width = "100%";
  image.style.borderRadius = "12px";

  document.getElementById("camera-result")
    .innerHTML = "<p>📸 Captured!</p>";

  document.getElementById("camera-result")
    .appendChild(image);

  playTone(900,.08);
}

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(track => track.stop());

    cameraStream = null;
  }

}

    clearInterval(window.pearMusicTimer);
  }

  window.pearMusicTimer =
    setInterval(() => {

      progress += 5;

      const bar =
        document.getElementById("music-progress");

      if(!bar){
        clearInterval(window.pearMusicTimer);
        return;

      bar.style.width =
        Math.min(progress,100) + "%";

      if(progress >= 100){
        clearInterval(window.pearMusicTimer);

  playTone(520,.15);

    clearInterval(window.pearMusicTimer);

  );

  document.getElementById("compass-start").onclick =
    async function(){

      if(
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ){

        try{

          const permission =
            await DeviceOrientationEvent
              .requestPermission();

          if(permission !== "granted"){
            alert("Compass permission was not granted.");
            return;
          }

        }catch(e){}

      }

      window.addEventListener(
        "deviceorientation",
        updateCompass
      );

    };

}

function updateCompass(event){

  let heading =
    event.webkitCompassHeading;

  if(heading == null){

    heading =
      event.alpha == null
        ? 0
        : 360 - event.alpha;

  }

  const headingEl =
    document.getElementById("heading");

  const compass =
    document.getElementById("compass-display");

  if(headingEl){
    headingEl.textContent =
      Math.round(heading) + "°";
  }

  if(compass){
    compass.style.transform =
      `rotate(${-heading}deg)`;
  }

}

function chronoApp(){

  openApp(
    "Chrono",
    `
      <div class="card">

        <h2>⏱️ Chrono</h2>

        <div
          class="big-display"
          id="chrono-display"
        >
          00:00.0
        </div>

        <div class="row">

          <button
            class="app-button"
            id="chrono-start"
          >
            ▶ Start
          </button>

          <button
            class="app-button"
            id="chrono-stop"
          >
            ⏸ Stop
          </button>

          <button
            class="app-button"
            id="chrono-reset"
          >
            ↺ Reset
          </button>

        </div>

      </div>
    `
  );

  let startTime = 0;
  let elapsed = 0;
  let timer = null;

  function render(){

    const total =
      elapsed +
      (
        timer
          ? Date.now()-startTime
          : 0
      );

    const seconds =
      Math.floor(total/1000);

    const tenths =
      Math.floor((total%1000)/100);

    const minutes =
      Math.floor(seconds/60);

    const secs =
      seconds%60;

    document.getElementById("chrono-display")
      .textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(secs).padStart(2,"0") +
        "." +
        tenths;

  }

  document.getElementById("chrono-start").onclick =
    function(){

      if(timer) return;

      startTime = Date.now();

      timer =
        setInterval(render,50);

    };

  document.getElementById("chrono-stop").onclick =
    function(){

      if(!timer) return;

      elapsed += Date.now()-startTime;

      clearInterval(timer);

      timer = null;

      render();

    };

  document.getElementById("chrono-reset").onclick =
    function(){

      if(timer){
        clearInterval(timer);
      }

      timer = null;
      elapsed = 0;

      render();

    };

}

document.querySelectorAll(".hotspot").forEach(button => {

  button.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    const id = this.id;

    /*
      Don't allow Page 1 apps while Page 2 is active.
    */

    if(
      this.classList.contains("page1-hotspot") &&
      currentPage === 2
    ){
      return;
    }

    /*
      Don't allow Page 2 apps while Page 1 is active.
    */

    if(
      this.classList.contains("page2-hotspot") &&
      currentPage !== 2
    ){
      return;
    }

    const app = appMap[id];

    if(typeof app === "function"){

      playTone(520,.05);

      app();

    }

  });

});
