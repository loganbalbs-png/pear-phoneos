<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #111;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================================
   PEAR PHONE
   ========================================================= */

#phone-container {

    position: relative;

    /* VERY ZOOMED IN */
    width: min(180vh, 1600px);

    height: auto;

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    /* TURN THE PHONE SIDEWAYS */
    transform: rotate(90deg);
}


/* =========================================================
   APP WINDOW
   ========================================================= */

#overlay {

    position: absolute;

    left: 31%;
    top: 22%;

    width: 38%;
    height: 47%;

    background: white;

    z-index: 100;

    display: none;

    overflow: hidden;

    border-radius: 8px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.45);
}

#overlay.open {
    display: block;
}


/* =========================================================
   APP
   ========================================================= */

#app {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* =========================================================
   APP HEADER
   ========================================================= */

#app-header {

    min-height: 38px;

    background: #eee;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 6px 9px;

    font-size: 14px;

    font-weight: bold;

    flex-shrink: 0;
}

#app-title {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

#close-app {

    border: none;

    background: #ff5f57;

    color: white;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    cursor: pointer;

    font-weight: bold;
}


/* =========================================================
   APP CONTENT
   ========================================================= */

#app-content {

    flex: 1;

    overflow: auto;

    padding: 10px;

    font-size: 13px;
}


/* =========================================================
   APP BUTTONS
   ========================================================= */

button {
    cursor: pointer;
}

.app-button {

    border: none;

    border-radius: 7px;

    padding: 7px 10px;

    margin: 3px;

    background: #ddd;

    font-size: 12px;
}

.app-button:active {
    transform: scale(.95);
}


/* =========================================================
   INPUTS
   ========================================================= */

input,
textarea,
select {

    width: 100%;

    padding: 7px;

    margin: 4px 0;

    border: 1px solid #bbb;

    border-radius: 6px;

    font-family: inherit;
}

textarea {

    resize: vertical;

    min-height: 60px;
}


/* =========================================================
   CARDS
   ========================================================= */

.card {

    background: #f2f2f2;

    border-radius: 8px;

    padding: 9px;

    margin-bottom: 7px;
}

.small {

    font-size: 11px;

    opacity: .7;
}


/* =========================================================
   ROWS
   ========================================================= */

.row {

    display: flex;

    gap: 5px;

    align-items: center;
}

.row > * {

    flex: 1;
}


/* =========================================================
   INVISIBLE CLICKABLE ICONS
   ========================================================= */

.hotspot {

    position: absolute;

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    z-index: 50;
}

.hotspot:active {

    transform: scale(.90);
}


/* =========================================================
   PEAR PHONE ICON POSITIONS
   ========================================================= */

#messages {

    left: 43.1%;
    top: 25.7%;

    width: 9.6%;

    aspect-ratio: 1;
}

#camera {

    left: 54%;
    top: 25.7%;

    width: 9.6%;

    aspect-ratio: 1;
}

#splashface {

    left: 38%;
    top: 36.1%;

    width: 9.6%;

    aspect-ratio: 1;
}

#stocks {

    left: 47.5%;
    top: 36.1%;

    width: 9.6%;

    aspect-ratio: 1;
}

#maps {

    left: 57%;
    top: 36.1%;

    width: 9.6%;

    aspect-ratio: 1;
}

#photos {

    left: 38%;
    top: 46.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#weather {

    left: 47.5%;
    top: 46.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#notes {

    left: 57%;
    top: 46.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#peartunes {

    left: 32%;
    top: 55.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#settings {

    left: 42%;
    top: 55.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#clock {

    left: 52%;
    top: 55.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#videos {

    left: 62%;
    top: 55.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#phone {

    left: 32%;
    top: 65.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#mail {

    left: 42%;
    top: 65.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#compass {

    left: 52%;
    top: 65.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#music {

    left: 62%;
    top: 65.9%;

    width: 9.6%;

    aspect-ratio: 1;
}

#home {

    left: 46%;
    top: 78.8%;

    width: 8.2%;

    aspect-ratio: 1;
}


/* =========================================================
   KEEP PHONE SIDEWAYS + VERY ZOOMED IN
   ========================================================= */

@media (orientation: portrait) {

    #phone-container {

        width: min(180vh, 1600px);

        transform: rotate(90deg);
    }

}


@media (orientation: landscape) {

    #phone-container {

        width: min(180vh, 1600px);

        transform: rotate(90deg);
    }

}

</style>

</head>


<body>


<div id="phone-container">


    <!-- =====================================================
         INVISIBLE CLICKABLE APP ICONS
         ===================================================== -->


    <button
        class="hotspot"
        id="messages"
        onclick="openApp('messages')">
    </button>


    <button
        class="hotspot"
        id="camera"
        onclick="openApp('camera')">
    </button>


    <button

    <button

    <button

    <button

        id="videos"
        onclick="openApp('videos')">
    </button>


    <button

        id="phone"
        onclick="openApp('phone')">
    </button>


    <button
        class="hotspot"
        id="mail"
        onclick="openApp('mail')">
    </button>


    <button
        class="hotspot"
        id="compass"
        onclick="openApp('compass')">
    </button>


    <button
        class="hotspot"
        id="music"
        onclick="openApp('peartunes')">
    </button>


    <button
        class="hotspot"
        id="home"
        onclick="closeApp()">
    </button>


    <!-- =====================================================
         APP BOX
         ===================================================== -->


    <div id="overlay">

        <div id="app">

            <div id="app-header">

                <span id="app-title">
                    Pear Phone
                </span>


                <button
                    id="close-app"
                    onclick="closeApp()">
                    ×
                </button>

            </div>


            <div id="app-content"></div>

        </div>

    </div>


</div>


<!-- =========================================================
     INTERACTIVE APPS
     ========================================================= -->

<script src="app.js"></script>


</body>
</html>
