<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  font-family:Arial,sans-serif
}

/* PEAR PHONE */

#phone{
  position:relative;
  width:min(82vw,760px);
  aspect-ratio:1212/1188;
  background:url('pear-phone.jpg') center/contain no-repeat,radial-gradient(#20252b,#000);
  transform:rotate(90deg) scale(.92);
  transform-origin:center center;
  touch-action:none;
}

/* HOTSPOTS */

.hotspot{
  position:absolute;
  border:0;
  background:transparent;
  padding:0;
  border-radius:50%;
  z-index:20;
  cursor:pointer
}

.hotspot:active{
  background:#ffffff18;
  transform:scale(.92)
}

/* PAGE 1 */

#page1 button:nth-child(1){
  left:43.1%;
  top:25.7%;
  width:8.3%;
  aspect-ratio:1
}

  width:8.3%;
  aspect-ratio:1
}

  width:8.3%;
  aspect-ratio:1
}

  width:8.3%;
  aspect-ratio:1
}

  aspect-ratio:1
}

  aspect-ratio:1
}

  width:8.3%;
  aspect-ratio:1
}

#page1 button:nth-child(8){
  left:57%;

  aspect-ratio:1
}

#page1 button:nth-child(9){
  left:32%;

  width:8.3%;
  aspect-ratio:1
}

  left:42%;
  top:55.9%;
  width:8.3%;
  aspect-ratio:1
}

#page1 button:nth-child(11){
  left:52%;
  top:55.9%;
  width:8.3%;
  aspect-ratio:1
}

#page1 button:nth-child(12){
  left:62%;
  top:55.9%;
  width:8.3%;
  aspect-ratio:1
}

#page1 button:nth-child(13){
  left:32%;
  top:65.9%;
  width:8.3%;
  aspect-ratio:1
}

#page1 button:nth-child(14){
  left:42%;

}

#page1 button:nth-child(15){
  left:52%;

}

#page1 button:nth-child(16){
  left:62%;

  width:8.3%;
  aspect-ratio:1
}

/* PAGE 2 */

#page2{
  display:none;
  position:absolute;

  /* keeps the entire Page 2 inside the actual phone screen */
  left:31%;
  right:30%;
  top:24%;
  bottom:24%;

  z-index:21;

  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);

  column-gap:8%;
  row-gap:8%;

  align-items:center;
  justify-items:center;
}

#page2 button{
  width:100%;
  max-width:65px;
  aspect-ratio:1;

  border:0;
  background:transparent;
  border-radius:50%;

  cursor:pointer;
}

#page2 button:active{
  background:#fff2;
  transform:scale(.92)
}

/* HOME */

#home{
  position:absolute;
  left:46%;
  top:78.8%;
  width:8.2%;
  aspect-ratio:1;
  border:0;
  background:transparent;
  border-radius:50%;
  z-index:30
}

/* APP WINDOW */

#overlay{
  position:absolute;
  left:20%;
  top:18%;
  width:60%;
  height:59%;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  background:#0006;
  border-radius:22px;
  overflow:hidden
}

#overlay.open{
  display:flex
}

#app{
  width:94%;
  height:94%;

  background:#f4f5f7;
  color:#111;

  border:2px solid #333;
  border-radius:17px;

  display:flex;
  flex-direction:column;

  overflow:hidden
}

.head{
  height:42px;
  flex:none;

  display:flex;
  align-items:center;
  gap:8px;

  padding:5px 8px;

  background:linear-gradient(#fff,#e5e5e5);
  border-bottom:1px solid #bbb;

  font-weight:900
}

.head button{
  width:30px;
  height:30px;

  border-radius:50%;
  border:1px solid #aaa;

  background:#ddd;

  font-size:20px
}

.body{
  flex:1;
  overflow:auto;
  padding:10px
}

.body button{
  border:1px solid #aaa;
  border-radius:9px;
  background:linear-gradient(#fff,#ddd);
  padding:8px;
  font-weight:700
}

.body input,
.body textarea{
  font-size:16px;
  padding:8px;

  border:1px solid #aaa;
  border-radius:9px
}

.body textarea{
  width:100%;
  min-height:110px
}

.row{
  display:flex;
  gap:6px
}

.bubble{
  background:#ddd;
  border-radius:15px;

  padding:8px 10px;
  margin-bottom:6px;

  width:max-content;
  max-width:85%
}

.me{
  margin-left:auto;
  background:#168ee8;
  color:#fff
}

.photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px
}

.photos img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:7px
}

.video{
  width:100%;
  background:#000;
  border-radius:10px
}

.stock{
  display:flex;
  justify-content:space-between;

  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;

  padding:8px;
  margin-bottom:5px
}

.big{
  text-align:center;
  font-size:42px;
  font-weight:900;
  padding:20px
}

.map{
  height:150px;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:linear-gradient(135deg,#d8e8ca,#e8dfb5);

  font-size:45px
}

/* KEYBOARD */

#keyboard{
  position:absolute;

  left:3%;
  right:3%;
  bottom:2%;

  z-index:500;

  display:none;

  grid-template-columns:repeat(10,1fr);

  gap:3px;

  padding:6px;

  background:#202329ee;

  border-radius:13px;

  transform:translateY(120%);

  transition:.2s
}

#keyboard.show{
  display:grid;
  transform:translateY(0)
}

#keyboard button{
  height:26px;

  border:0;
  border-radius:5px;

  font-size:9px;
  font-weight:800
}

.space{
  grid-column:span 5
}

.wide{
  grid-column:span 2
}

/* PAGE SWITCH EFFECT */

#flash{
  position:absolute;
  inset:0;

  z-index:600;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle,
      #fff8,
      #267dff4d,
      transparent 70%
    )
}

#flash.go{
  animation:f .4s ease
}

@keyframes f{
  0%{
    opacity:0;
    transform:scale(.7)
  }

  35%{
    opacity:1
  }

  100%{
    opacity:0;
    transform:scale(1.15)
  }
}

/* SMALLER SCREENS */

@media(max-width:700px){

  #phone{
    width:min(90vw,760px);

    transform:
      rotate(90deg)
      scale(.84);

    transform-origin:center center;
  }

  #page2{
    left:30%;
    right:29%;
    top:23%;
    bottom:23%;

    column-gap:6%;
    row-gap:6%;
  }

  #page2 button{
    max-width:58px;
  }
}
</style>
</head>

<body>

<div id="phone">

  <!-- PAGE 1 -->

  <div id="page1">

    <button class="hotspot" data-app="messages"></button>
    <button class="hotspot" data-app="camera"></button>
    <button class="hotspot" data-app="splashface"></button>
    <button class="hotspot" data-app="stocks"></button>
    <button class="hotspot" data-app="maps"></button>
    <button class="hotspot" data-app="photos"></button>
    <button class="hotspot" data-app="weather"></button>
    <button class="hotspot" data-app="notes"></button>
    <button class="hotspot" data-app="peartunes"></button>
    <button class="hotspot" data-app="settings"></button>
    <button class="hotspot" data-app="clock"></button>
    <button class="hotspot" data-app="videos"></button>
    <button class="hotspot" data-app="phone"></button>
    <button class="hotspot" data-app="mail"></button>
    <button class="hotspot" data-app="compass"></button>
    <button class="hotspot" data-app="music"></button>

  <div id="page2">
