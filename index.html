<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #111;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================================
   PEAR PHONE
   ========================================================= */

#phone-container {

    position: relative;

    /* BIG BUT SLIGHTLY SMALLER THAN 180VH */
    width: min(170vh, 1500px);

    height: auto;

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    /* TURN THE PHONE SIDEWAYS */
    transform: rotate(90deg);

}


/* =========================================================
   CLICKABLE ICONS
   ========================================================= */

.hotspot {

    position: absolute;

    display: block;

    border: none;

    outline: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    z-index: 200;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

}


/* Make the actual clickable area a little larger */

.hotspot::after {

    content: "";

    position: absolute;

    left: -15%;

    top: -15%;

    width: 130%;

    height: 130%;

    background: transparent;

}


/* Touch feedback */

.hotspot:active {

    transform: scale(.90);

}


/* =========================================================
   APP WINDOW
   ========================================================= */

#overlay {

    position: absolute;

    left: 31%;

    top: 22%;

    width: 38%;

    height: 47%;

    background: #f2f2f7;

    z-index: 500;

    display: none;

    overflow: hidden;

    border-radius: 9px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.5);

}


/* App is open */

#overlay.open {

    display: block;

}


/* =========================================================
   IMPORTANT:
   app.js expects this exact ID:
   app-window
   ========================================================= */

#app-window {

    width: 100%;

    height: 100%;

    overflow: auto;

    background: #f2f2f7;

    color: #111;

}


/* =========================================================
   APP HEADER
   ========================================================= */

.header {

    height: 38px;

    min-height: 38px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 5px 8px;

    background: #eee;

    border-bottom: 1px solid #ccc;

    font-weight: bold;

    position: sticky;

    top: 0;

    z-index: 5;

}


/* Back button */

.back {

    border: none;

    background: #ddd;

    border-radius: 6px;

    width: 30px;

    height: 28px;

    font-size: 20px;

    line-height: 20px;

    cursor: pointer;

}


/* =========================================================
   APP CONTENT
   ========================================================= */

.content {

    padding: 10px;

    font-size: 13px;

}


/* =========================================================
   APP BUTTONS
   ========================================================= */

.button {

    border: none;

    background: #ddd;

    color: #111;

    border-radius: 7px;

    padding: 8px 11px;

    margin: 3px;

    font-size: 12px;

    cursor: pointer;

    touch-action: manipulation;

}


.button:active {

    transform: scale(.94);

}


/* =========================================================
   INPUTS
   ========================================================= */

input,
textarea,
select {

    width: 100%;

    padding: 8px;

    margin: 4px 0;

    border: 1px solid #bbb;

    border-radius: 6px;

    font-family: inherit;

    font-size: 13px;

}


textarea {

    min-height: 65px;

    resize: vertical;

}


/* =========================================================
   CARDS
   ========================================================= */

.card {

    background: #fff;

    border-radius: 9px;

    padding: 10px;

    margin-bottom: 8px;

    box-shadow:
        0 1px 4px rgba(0,0,0,.12);

    cursor: pointer;

}


.card:active {

    transform: scale(.98);

}


/* =========================================================
   GRID
   ========================================================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 7px;

}


/* =========================================================
   LARGE ICON
   ========================================================= */

.big-icon {

    font-size: 55px;

    text-align: center;

    margin: 8px;

}


/* =========================================================
   MESSAGE STYLES
   ========================================================= */

.message {

    background: #e5e5ea;

    padding: 7px 10px;

    border-radius: 12px;

    margin: 5px 0;

    max-width: 85%;

}


.message.me {

    margin-left: auto;

    background: #cfe8ff;

}


/* =========================================================
   STOCK PROGRESS
   ========================================================= */

.progress {

    height: 10px;

    background: #ddd;

    border-radius: 10px;

    overflow: hidden;

}


.progress div {

    height: 100%;

    background: #5cb85c;

}


/* =========================================================
   ICON POSITIONS
   ========================================================= */


/* Messages */

#messages {

    left: 43.1%;

    top: 25.7%;

    width: 10%;

    aspect-ratio: 1;

}


/* Camera */

#camera {

    left: 54%;

    top: 25.7%;

    width: 10%;

    aspect-ratio: 1;

}


/* SplashFace */

#splashface {

    left: 38%;

    top: 36.1%;

    width: 10%;

    aspect-ratio: 1;

}


/* Stocks */

#stocks {

    left: 47.5%;

    top: 36.1%;

    width: 10%;

    aspect-ratio: 1;

}


/* Maps */

#maps {

    left: 57%;

    top: 36.1%;

    width: 10%;

    aspect-ratio: 1;

}


/* Photos */

#photos {

    left: 38%;

    top: 46.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Weather */

#weather {

    left: 47.5%;

    top: 46.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Notes */

#notes {

    left: 57%;

    top: 46.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* PearTunes */

#peartunes {

    left: 32%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Settings */

#settings {

    left: 42%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Clock */

#clock {

    left: 52%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Videos */

#videos {

    left: 62%;

    top: 55.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Phone */

#phone {

    left: 32%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Mail */

#mail {

    left: 42%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Compass */

#compass {

    left: 52%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Music */

#music {

    left: 62%;

    top: 65.9%;

    width: 10%;

    aspect-ratio: 1;

}


/* Home */

#home {

    left: 46%;

    top: 78.8%;

    width: 9%;

    aspect-ratio: 1;

}


/* =========================================================
   PHONE SIZE
   ========================================================= */

@media (orientation: portrait) {

    #phone-container {

        width: min(170vh, 1500px);

        transform: rotate(90deg);

    }

}


@media (orientation: landscape) {

    #phone-container {

        width: min(170vh, 1500px);

        transform: rotate(90deg);

    }

}

</style>

</head>


<body>
