<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pear Phone OS</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

/* PHONE */

#phone-container {
  position: relative;
  width: min(82vw, 520px);
  aspect-ratio: 1212 / 1188;
  background: url("pear-phone.png") center / contain no-repeat;
}

/* CLICKABLE ICONS */

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  cursor: pointer;
  z-index: 20;
  touch-action: manipulation;
}

/* ICON POSITIONS */

#messages {
  left: 43.1%;
  top: 25.7%;
  width: 9.6%;
  aspect-ratio: 1;
}

#camera {
  left: 54%;
  top: 25.7%;
  width: 9.6%;
  aspect-ratio: 1;
}

#splashface {
  left: 38%;
  top: 36.1%;
  width: 9.6%;
  aspect-ratio: 1;
}

#stocks {
  left: 47.5%;
  top: 36.1%;
  width: 9.6%;
  aspect-ratio: 1;
}

#maps {
  left: 57%;
  top: 36.1%;
  width: 9.6%;
  aspect-ratio: 1;
}

#photos {
  left: 38%;
  top: 46.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#weather {
  left: 47.5%;
  top: 46.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#notes {
  left: 57%;
  top: 46.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#peartunes {
  left: 32%;
  top: 55.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#settings {
  left: 42%;
  top: 55.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#clock {
  left: 52%;
  top: 55.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#videos {
  left: 62%;
  top: 55.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#phone {
  left: 32%;
  top: 65.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#mail {
  left: 42%;
  top: 65.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#compass {
  left: 52%;
  top: 65.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

#music {
  left: 62%;
  top: 65.9%;
  width: 9.6%;
  aspect-ratio: 1;
}

/* HOME BUTTON */

#home {
  position: absolute;
  left: 46%;
  top: 78.8%;
  width: 8.2%;
  aspect-ratio: 1;
  border: 0;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  z-index: 30;
}

/* APP WINDOW
   THIS STAYS INSIDE THE PHONE */

#overlay {
  position: absolute;
  left: 25.5%;
  top: 18.5%;
  width: 49%;
  height: 58%;
  z-index: 100;
  display: none;
  overflow: hidden;
  border-radius: 12%;
}

#overlay.open {
  display: block;
}

#app-window {
  width: 100%;
  height: 100%;
  background: #f2f2f7;
  color: #111;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* APP HEADER */

.header {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 42px;
  padding: 6px 8px;
  background: linear-gradient(#ffffff, #e5e5e5);
  border-bottom: 1px solid #bbb;
  font-size: 13px;
  font-weight: bold;
}

.back {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #aaa;
  background: linear-gradient(#fff, #ddd);
  font-size: 20px;
  line-height: 20px;
  cursor: pointer;
}

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
  font-size: 12px;
}

.content h1 {
  font-size: 20px;
}

.content h2 {
  font-size: 16px;
}

.content h3 {
  font-size: 14px;
}

.button {
  padding: 7px 10px;
  border-radius: 9px;
  border: 1px solid #aaa;
  background: linear-gradient(#fff, #ddd);
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}

input,
textarea {
  width: 100%;
  padding: 8px;
  border: 1px solid #aaa;
  border-radius: 9px;
  font-size: 12px;
}

textarea {
  min-height: 100px;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 9px;
  margin-bottom: 7px;
}

.message {
  padding: 7px 10px;
  width: max-content;
  max-width: 80%;
  background: #ddd;
  border-radius: 14px;
  margin-bottom: 6px;
}

.message.me {
  margin-left: auto;
  background: #1689e8;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

/* KEEP NORMAL SIZE ON PHONES */

@media (max-width: 600px) {
  #phone-container {
    width: 90vw;
  }
}
</style>
</head>

<body>

<div id="phone-container">

  <button class="hotspot" id="messages"></button>
  <button class="hotspot" id="camera"></button>

  <button class="hotspot" id="splashface"></button>
  <button class="hotspot" id="stocks"></button>
  <button class="hotspot" id="maps"></button>

  <button class="hotspot" id="photos"></button>
  <button class="hotspot" id="weather"></button>
  <button class="hotspot" id="notes"></button>

  <button class="hotspot" id="peartunes"></button>
  <button class="hotspot" id="settings"></button>
  <button class="hotspot" id="clock"></button>
  <button class="hotspot" id="videos"></button>

  <button class="hotspot" id="phone"></button>
  <button class="hotspot" id="mail"></button>
  <button class="hotspot" id="compass"></button>
  <button class="hotspot" id="music"></button>

  <button id="home"></button>

  <!-- APP SCREEN IS INSIDE PHONE -->
  <div id="overlay">
    <div id="app-window"></div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
