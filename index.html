<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pear Phone OS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}


/* =====================================================
   PEAR PHONE
===================================================== */

#phone-container {
    position: relative;

    width: min(82vw, 520px);

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================================
   CLICKABLE APPS
===================================================== */

.hotspot {
    position: absolute;

    border: none;
    background: transparent;

    padding: 0;
    margin: 0;

    border-radius: 50%;

    cursor: pointer;

    z-index: 50;

    touch-action: manipulation;

    -webkit-appearance: none;
    appearance: none;
}


/* =====================================================
   APP POSITIONS
===================================================== */

#messages {
    left: 43.1%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#camera {
    left: 54%;
    top: 25.7%;
    width: 9.6%;
    aspect-ratio: 1;
}

#splashface {
    left: 38%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#stocks {
    left: 47.5%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#maps {
    left: 57%;
    top: 36.1%;
    width: 9.6%;
    aspect-ratio: 1;
}

#photos {
    left: 38%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#weather {
    left: 47.5%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#notes {
    left: 57%;
    top: 46.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#peartunes {
    left: 32%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#settings {
    left: 42%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#clock {
    left: 52%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#videos {
    left: 62%;
    top: 55.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#phone {
    left: 32%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#mail {
    left: 42%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#compass {
    left: 52%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}

#music {
    left: 62%;
    top: 65.9%;
    width: 9.6%;
    aspect-ratio: 1;
}


/* =====================================================
   HOME BUTTON
===================================================== */

#home {
    position: absolute;

    left: 46%;
    top: 78.8%;

    width: 8.2%;
    aspect-ratio: 1;

    border: none;
    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    z-index: 60;
}


/* =====================================================
   APP WINDOW
   THIS IS THE PEAR PHONE SHAPE
===================================================== */

#overlay {

    position: absolute;

    /*
       The overlay uses the FULL
       Pear Phone container.
    */

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 100;

    display: none;

    overflow: hidden;

    /*
       Smooth Pear Phone silhouette.
       No polygon.
       No weird corners.
    */

    clip-path: url("#pearPhoneShape");
}


#overlay.open {
    display: block;
}


/* =====================================================
   APP SCREEN
===================================================== */

#app-window {

    width: 100%;
    height: 100%;

    background: #f2f2f7;

    color: #111;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    align-items: center;

    gap: 10px;

    min-height: 52px;

    padding: 10px 15px;

    background:
        linear-gradient(
            #ffffff,
            #e5e5e5
        );

    border-bottom: 1px solid #aaa;

    font-size: 17px;

    font-weight: bold;
}


.back {

    width: 34px;
    height: 34px;

    border-radius: 50%;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 23px;

    cursor: pointer;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 18px;

    font-size: 14px;
}


.content h1 {
    font-size: 25px;
}

.content h2 {
    font-size: 20px;
}

.content h3 {
    font-size: 16px;
}


/* =====================================================
   BUTTONS
===================================================== */

.button {

    padding: 9px 14px;

    border-radius: 11px;

    border: 1px solid #aaa;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   INPUTS
===================================================== */

input,
textarea {

    width: 100%;

    padding: 10px;

    border: 1px solid #aaa;

    border-radius: 11px;

    font-size: 14px;
}


textarea {
    min-height: 140px;
}


/* =====================================================
   CARDS
===================================================== */

.card {

    background: white;

    border: 1px solid #ddd;

    border-radius: 13px;

    padding: 13px;

    margin-bottom: 10px;
}


/* =====================================================
   MESSAGES
===================================================== */

.message {

    width: max-content;

    max-width: 80%;

    padding: 9px 12px;

    background: #ddd;

    border-radius: 17px;

    margin-bottom: 8px;
}


.message.me {

    margin-left: auto;

    background: #1689e8;

    color: white;
}


/* =====================================================
   GRID
===================================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;
}


/* =====================================================
   PHONE SIZE
===================================================== */

@media (max-width: 600px) {

    #phone-container {
        width: 90vw;
    }

}


/* =====================================================
   THE ACTUAL PEAR SHAPE
===================================================== */

#pear-shape-definitions {

    position: absolute;

    width: 0;
    height: 0;

}

</style>
</head>


<body>

                C 0.28 0.24,
                  0.24 0.30,
                  0.20 0.37

                C 0.14 0.47,
                  0.10 0.59,
                  0.12 0.70

                C 0.14 0.83,
                  0.23 0.92,
                  0.34 0.97

                C 0.44 1.01,
                  0.56 1.01,
                  0.66 0.97

                C 0.77 0.92,
                  0.86 0.83,
                  0.88 0.70

                C 0.90 0.59,
                  0.86 0.47,
                  0.80 0.37

                C 0.76 0.30,
                  0.72 0.24,
                  0.71 0.16

                C 0.69 0.05,
                  0.61 0.00,
                  0.50 0.00

                Z
                "
            />

        </clipPath>

    </defs>

</svg>


<div id="phone-container">


    <!-- APPS -->

    <button
        class="hotspot"
        id="messages"
        aria-label="Messages">
    </button>


    <button

        id="camera"
        aria-label="Camera">
    </button>


    <button
        class="hotspot"
        id="splashface"
        aria-label="SplashFace">
    </button>


    <button
        class="hotspot"
        id="stocks"
        aria-label="Stocks">
    </button>


    <button
        class="hotspot"
        id="maps"
        aria-label="Maps">
    </button>


    <button
        class="hotspot"
        id="photos"
        aria-label="Photos">
    </button>


    <button
        class="hotspot"
        id="weather"
        aria-label="Weather">
    </button>


    <button
        class="hotspot"
        id="notes"
        aria-label="Notes">
    </button>


    <button
        class="hotspot"
        id="peartunes"
        aria-label="PearTunes">
    </button>


    <button
        class="hotspot"
        id="settings"
        aria-label="Settings">
    </button>


    <button
        class="hotspot"
        id="clock"
        aria-label="Clock">
    </button>


    <button
        class="hotspot"
        id="videos"
        aria-label="Videos">
    </button>


    <button
        class="hotspot"
        id="phone"
        aria-label="Phone">
    </button>


    <button
        class="hotspot"
        id="mail"
        aria-label="Mail">
    </button>


    <button
        class="hotspot"
        id="compass"
        aria-label="Compass">
    </button>


    <button
        class="hotspot"
        id="music"
        aria-label="Music">
    </button>


    <!-- HOME -->

    <button
        id="home"
        aria-label="Home">
    </button>


    <!-- =================================================
         APP WINDOW
    ================================================= -->

    <div id="overlay">

        <div id="app-window"></div>

    </div>


</div>


<script src="app.js"></script>

</body>
</html>
