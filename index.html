<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Pear Phone OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   PHONE
   ========================================================= */

#phone-container{
  position:relative;

  width:min(82vw,520px);
  aspect-ratio:1212 / 1188;

  background-image:url("pear-phone.jpg");
  background-position:center;
  background-repeat:no-repeat;
  background-size:contain;

  transform:rotate(90deg) scale(.78);
  transform-origin:center center;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;
}

/* =========================================================
   INVISIBLE ICON HIT AREAS

   These are intentionally smaller than the old hitboxes.
   They do NOT overlap neighboring apps.
   ========================================================= */

.hotspot{
  position:absolute;

  width:8.0%;
  aspect-ratio:1;

  border:0;
  padding:0;
  margin:0;

  background:transparent;

  border-radius:50%;

  cursor:pointer;

  z-index:20;

  touch-action:manipulation;

  -webkit-appearance:none;
  appearance:none;
}

.hotspot:active{
  background:rgba(255,255,255,.08);
  transform:scale(.92);
}

/* PAGE 1 */

#messages{
  left:43.9%;
  top:26.5%;
}

#camera{
  left:53.2%;
  top:26.5%;
}

#splashface{
  left:38.8%;
  top:36.9%;
}

#stocks{
  left:47.9%;
  top:36.9%;
}

#maps{
  left:57.0%;
  top:36.9%;
}

#photos{
  left:38.8%;
  top:47.7%;
}

#weather{
  left:47.9%;
  top:47.7%;
}

#notes{
  left:57.0%;
  top:47.7%;
}

#peartunes{
  left:32.8%;
  top:56.7%;
}

#settings{
  left:42.8%;
  top:56.7%;
}

#clock{
  left:52.8%;
  top:56.7%;
}

#videos{
  left:62.0%;
  top:56.7%;
}

#phone{
  left:32.8%;
  top:66.7%;
}

#mail{
  left:42.8%;
  top:66.7%;
}

#compass{
  left:52.8%;
  top:66.7%;
}

#music{
  left:62.0%;
  top:66.7%;
}

/* HOME BUTTON */

#home{
  position:absolute;

  left:46%;
  top:78.8%;

  width:8.2%;
  aspect-ratio:1;

  border:0;
  background:transparent;

  border-radius:50%;

  cursor:pointer;

  z-index:30;

  touch-action:manipulation;
}

/* =========================================================
   APP WINDOW
   ========================================================= */

#app-overlay{
  position:absolute;

  /*
    This is INSIDE the phone image.
    It is NOT fixed to the browser.
  */

  left:20%;
  top:18%;

  width:60%;
  height:59%;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#app-overlay.open{
  display:flex;
  pointer-events:auto;
}

/* =========================================================
   APP WINDOW
   ========================================================= */

#app-window{
  width:100%;
  height:100%;

  overflow:hidden;

  background:#f4f5f7;

  color:#111;

  border:2px solid rgba(0,0,0,.55);

  border-radius:22px;

  box-shadow:
    0 10px 25px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.9);

  display:flex;
  flex-direction:column;

  animation:appOpen .18s ease-out;
}

@keyframes appOpen{
  from{
    opacity:0;
    transform:scale(.88);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================================================
   APP HEADER
   ========================================================= */

.app-header{
  flex:0 0 auto;

  height:42px;

  display:flex;
  align-items:center;

  gap:8px;

  padding:5px 8px;

  background:linear-gradient(#fff,#e3e5e8);

  border-bottom:1px solid #bbb;

  font-size:14px;
  font-weight:900;
}

.back-button{
  width:30px;
  height:30px;

  border-radius:50%;

  border:1px solid #aaa;

  background:linear-gradient(#fff,#ddd);

  font-size:22px;

  line-height:25px;

  padding:0;

  cursor:pointer;

  flex:none;
}

.window-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* =========================================================
   APP CONTENT
   ========================================================= */

.app-content{
  flex:1;

  min-height:0;

  overflow:auto;

  -webkit-overflow-scrolling:touch;

  padding:10px;

  font-size:13px;
}

.app-content h2{
  margin:0 0 8px;
  font-size:19px;
}

.app-content h3{
  margin:8px 0;
}

.app-content p{
  margin:6px 0;
}

.app-content button{
  font:inherit;
}

.button{
  border:1px solid #aaa;

  border-radius:10px;

  padding:8px 11px;

  background:linear-gradient(#fff,#ddd);

  font-weight:700;

  cursor:pointer;
}

.button:active{
  transform:scale(.96);
}

/* =========================================================
   MESSAGES
   ========================================================= */

.chat-list{
  display:flex;
  flex-direction:column;
  gap:6px;

  margin-bottom:8px;
}

.chat-bubble{
  max-width:82%;

  padding:8px 10px;

  background:#dedfe3;

  border-radius:16px;

  width:max-content;
}

.chat-bubble.me{
  margin-left:auto;

  color:white;

  background:linear-gradient(#54b9ff,#1488df);
}

.compose-row{
  display:flex;
  gap:5px;
}

.compose-row input{
  min-width:0;
  flex:1;

  border:1px solid #aaa;

  border-radius:14px;

  padding:8px;
}

/* =========================================================
   CAMERA
   ========================================================= */

.camera-container{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.camera-video{
  width:100%;

  aspect-ratio:4/3;

  object-fit:cover;

  display:block;

  background:#050505;

  border-radius:14px;

  border:2px solid #222;
}

.camera-controls{
  display:flex;

  gap:5px;

  flex-wrap:wrap;
}

.camera-status{
  font-size:11px;

  color:#666;

  min-height:15px;
}

.camera-select{
  width:100%;

  padding:7px;

  border-radius:9px;

  border:1px solid #aaa;

  background:white;
}

.captured-photo{
  width:100%;

  margin-top:4px;

  border-radius:12px;

  display:none;
}

/* =========================================================
   PHOTOS
   ========================================================= */

.photo-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:5px;
}

.photo-grid img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  border-radius:8px;

  background:#ddd;

  cursor:pointer;
}

.empty{
  text-align:center;

  color:#777;

  padding:25px 5px;
}

/* =========================================================
   NOTES
   ========================================================= */

.note-title{
  width:100%;

  padding:8px;

  border:1px solid #aaa;

  border-radius:9px;

  margin-bottom:5px;
}

.note-body{
  width:100%;

  min-height:110px;

  resize:none;

  padding:8px;

  border:1px solid #aaa;

  border-radius:9px;

  font-family:inherit;
}

.note-list{
  display:flex;

  flex-direction:column;

  gap:5px;

  margin-bottom:8px;
}

.saved-note{
  padding:8px;

  border:1px solid #d0d0d0;

  border-radius:9px;

  background:#fff;

  cursor:pointer;
}

/* =========================================================
   STOCKS
   ========================================================= */

.stock-list{
  display:flex;

  flex-direction:column;

  gap:5px;
}

.stock-row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px;

  border:1px solid #ddd;

  border-radius:9px;

  background:#fff;
}

.positive{
  color:#07952b;
}

.negative{
  color:#d52525;
}

/* =========================================================
   WEATHER
   ========================================================= */

.weather-card{
  text-align:center;

  padding:8px;
}

.weather-icon{
  font-size:55px;
}

.temperature{
  font-size:42px;

  font-weight:900;
}

/* =========================================================
   MAPS
   ========================================================= */

.map{
  position:relative;

  height:150px;

  border-radius:12px;

  overflow:hidden;

  background:
    linear-gradient(35deg,transparent 0 40%,#fff 40% 44%,transparent 44%),
    linear-gradient(145deg,transparent 0 55%,#fff 55% 59%,transparent 59%),
    #cfe3bb;
}

.map-pin{
  position:absolute;

  left:55%;
  top:40%;

  font-size:40px;

  transform:translate(-50%,-50%);
}

/* =========================================================
   CLOCK
   ========================================================= */

.big-clock{
  text-align:center;

  font-size:34px;

  font-weight:900;

  padding:25px 0 5px;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-row{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:9px 0;

  border-bottom:1px solid #ddd;
}

/* =========================================================
   CUSTOM KEYBOARD
   ========================================================= */

#pear-keyboard{
  position:absolute;

  left:20%;
  bottom:18%;

  width:60%;

  z-index:500;

  display:none;

  padding:5px;

  background:rgba(28,30,34,.96);

  border-radius:12px;

  box-shadow:
    0 7px 20px rgba(0,0,0,.55);

  animation:keyboardIn .16s ease-out;
}

#pear-keyboard.show{
  display:block;
}

@keyframes keyboardIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.keyboard-row{
  display:flex;

  gap:3px;

  margin-bottom:3px;
}

.keyboard-key{
  flex:1;

  min-width:0;

  height:25px;

  border:0;

  border-radius:5px;

  background:#555;

  color:white;

  font-size:9px;

  font-weight:700;

  padding:0;

  cursor:pointer;
}

.keyboard-key:active{
  background:#888;
}

.keyboard-space{
  flex:5;
}

.keyboard-wide{
  flex:1.7;
}

/* =========================================================
   PAGE SWIPE ANIMATION
   ========================================================= */

#page-transition{
  position:absolute;

  inset:0;

  z-index:80;

  pointer-events:none;

  opacity:0;

  background:rgba(255,255,255,.08);
}

#page-transition.animate-up{
  animation:pageUp .38s ease;
}

#page-transition.animate-down{
  animation:pageDown .38s ease;
}

@keyframes pageUp{
  0%{
    opacity:0;
    transform:translateY(100%);
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translateY(-100%);
  }
}

@keyframes pageDown{
  0%{
    opacity:0;
    transform:translateY(-100%);
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translateY(100%);
  }
}

/* =========================================================
   SMALL SCREENS
   ========================================================= */

@media(max-width:700px){

  #phone-container{
    width:100vw;

    transform:rotate(90deg) scale(.68);
  }

  #app-overlay{
    left:20%;
    top:18%;

    width:60%;
    height:59%;
  }
}

@media(max-height:700px){

  #phone-container{
    width:100vw;

    transform:rotate(90deg) scale(.68);
  }
}
</style>
</head>
