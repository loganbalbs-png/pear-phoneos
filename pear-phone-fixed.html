<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pear Phone OS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#phone-container{position:relative;width:min(82vw,520px);aspect-ratio:1212 / 1188;background:url("pear-phone.jpg") center/contain no-repeat;background-color:#fff;z-index:10}
.hotspot{position:absolute;display:block;border:0;background:transparent;padding:0;margin:0;border-radius:50%;cursor:pointer;touch-action:manipulation;pointer-events:auto!important;-webkit-appearance:none;appearance:none;z-index:100}
.hotspot:hover{background:rgba(255,255,255,.05)}
.hotspot:active{transform:scale(.93);background:rgba(255,255,255,.10)}
#messages{left:43.1%;top:25.7%;width:9.6%;aspect-ratio:1}
#camera{left:54%;top:25.7%;width:9.6%;aspect-ratio:1}
#splashface{left:38%;top:36.1%;width:9.6%;aspect-ratio:1}
#stocks{left:47.5%;top:36.1%;width:9.6%;aspect-ratio:1}
#maps{left:57%;top:36.1%;width:9.6%;aspect-ratio:1}
#photos{left:38%;top:46.9%;width:9.6%;aspect-ratio:1}
#weather{left:47.5%;top:46.9%;width:9.6%;aspect-ratio:1}
#notes{left:57%;top:46.9%;width:9.6%;aspect-ratio:1}
#peartunes{left:32%;top:55.9%;width:9.6%;aspect-ratio:1}
#settings{left:42%;top:55.9%;width:9.6%;aspect-ratio:1}
#clock{left:52%;top:55.9%;width:9.6%;aspect-ratio:1}
#videos{left:62%;top:55.9%;width:9.6%;aspect-ratio:1}
#phone{left:32%;top:65.9%;width:9.6%;aspect-ratio:1}
#mail{left:42%;top:65.9%;width:9.6%;aspect-ratio:1}
#compass{left:52%;top:65.9%;width:9.6%;aspect-ratio:1}
#music{left:62%;top:65.9%;width:9.6%;aspect-ratio:1}
#home{position:absolute;left:46%;top:78.8%;width:8.2%;aspect-ratio:1;border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:100;touch-action:manipulation}
#overlay{position:fixed;inset:0;z-index:1000;display:none;background:#f4f5f7}
#overlay.open{display:block}
#app-window{width:100%;height:100dvh;overflow:hidden;background:#f4f5f7;color:#111}
#app-window .window-header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 11px) 13px 11px;background:linear-gradient(#fff,#e7e8ea);border-bottom:1px solid #ccc;font-size:18px;font-weight:900}
#app-window .window-body{height:calc(100dvh - 65px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.back{width:34px;height:34px;border-radius:50%;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-size:25px;cursor:pointer;flex:none}
.button{padding:10px 14px;border-radius:12px;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-weight:700;cursor:pointer}
.button:active{transform:scale(.96)}
.bubble{padding:10px 13px;width:max-content;max-width:82%;background:#dedfe3;border-radius:18px;margin-bottom:8px}.bubble.me{margin-left:auto;background:linear-gradient(#58b9ff,#1389df);color:#fff}
.row{display:flex;gap:8px} input,textarea{font-size:16px;padding:10px;border:1px solid #bbb;border-radius:12px;outline:none}textarea{width:100%;min-height:180px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.camera-video{width:100%;border-radius:18px;background:#000}.stock{display:flex;justify-content:space-between;padding:12px;margin-bottom:8px;background:#fff;border:1px solid #ddd;border-radius:14px}
@media(max-width:600px){#phone-container{width:78vw}}
@media(max-height:700px){#phone-container{width:66vw}}
</style>
</head>
<body>
<div id="phone-container">
<button class="hotspot" id="messages" aria-label="Messages"></button>
<button class="hotspot" id="camera" aria-label="Camera"></button>
<button class="hotspot" id="splashface" aria-label="SplashFace"></button>
<button class="hotspot" id="stocks" aria-label="Stocks"></button>
<button class="hotspot" id="maps" aria-label="Maps"></button>
<button class="hotspot" id="photos" aria-label="Photos"></button>
<button class="hotspot" id="weather" aria-label="Weather"></button>
<button class="hotspot" id="notes" aria-label="Notes"></button>
<button class="hotspot" id="peartunes" aria-label="PearTunes"></button>
<button class="hotspot" id="settings" aria-label="Settings"></button>
<button class="hotspot" id="clock" aria-label="Clock"></button>
<button class="hotspot" id="videos" aria-label="Videos"></button>
<button class="hotspot" id="phone" aria-label="Phone"></button>
<button class="hotspot" id="mail" aria-label="Mail"></button>
<button class="hotspot" id="compass" aria-label="Compass"></button>
<button class="hotspot" id="music" aria-label="Music"></button>
<button id="home" aria-label="Home"></button>
</div>
<div id="overlay"><div id="app-window"></div></div>
<script src="app.js?v=5"></script>
</body>
</html>
