/* =========================================================

   PHONE

   ========================================================= */

#phone-container {

    position: relative;

    width: min(170vh, 1500px);

    height: auto;

    aspect-ratio: 1212 / 1188;

    background-image: url("pear-phone.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;

    /* KEEP PHONE FACING THE SAME WAY */

    touch-action: none;

}

    pointer-events: none;

}

}

   HOTSPOTS

   ========================================================= */

    position: absolute;

    border: none;

    outline: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    z-index: 200;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

}

.hotspot::after {

    content: "";

    position: absolute;

    left: -15%;

    top: -15%;

    width: 130%;

    height: 130%;

    background: transparent;

}

.hotspot:active {

    transform: scale(.90);

}

<script>

/* =========================================================

   PAGE SWIPING

   ========================================================= */

let currentPage = 1;

let swipeStartX = 0;

let swipeStartY = 0;

const phone = document.getElementById("phone-container");

const overlay = document.getElementById("overlay");

const dots = document.getElementById("page-dots");

function showPage(page) {

    currentPage = page;

    if (page === 2) {

        phone.classList.add("page-two");

        dots.textContent = "○ ●";

    } else {

        phone.classList.remove("page-two");

        dots.textContent = "● ○";

    }

    if (overlay.classList.contains("open")) {

        if (typeof closeApp === "function") {

            closeApp();

        }

    }

}

/* Touch */

phone.addEventListener("touchstart", function(event) {

    if (overlay.classList.contains("open")) return;

    const touch = event.touches[0];

    swipeStartX = touch.clientX;

    swipeStartY = touch.clientY;

}, { passive: true });


phone.addEventListener("touchend", function(event) {

    if (overlay.classList.contains("open")) return;

    const touch = event.changedTouches[0];

    const differenceX =

        touch.clientX - swipeStartX;

    const differenceY =

        touch.clientY - swipeStartY;

    if (Math.abs(differenceX) < 60) return;

    if (Math.abs(differenceX) <

        Math.abs(differenceY)) return;

    if (differenceX < 0) {

        showPage(2);

    } else {

        showPage(1);

    }

}, { passive: true });


/* Mouse drag support too */

let mouseStartX = 0;

phone.addEventListener("mousedown", function(event) {

    if (overlay.classList.contains("open")) return;

    mouseStartX = event.clientX;

});

phone.addEventListener("mouseup", function(event) {

    if (overlay.classList.contains("open")) return;

    const difference =

        event.clientX - mouseStartX;

    if (Math.abs(difference) < 70) return;

    if (difference < 0) {

        showPage(2);

    } else {

        showPage(1);

    }

});

</script>
