<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pear Phone OS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#phone-container{
  position:relative;
  width:min(82vw,520px);
  height:min(86vh,920px);
  max-width:520px;
  max-height:920px;
  background:url("pear-phone.jpg") center/contain no-repeat;
  background-color:#fff;
}
.hotspot{position:absolute;border:0;background:transparent;padding:0;margin:0;border-radius:50%;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
.hotspot:active{transform:scale(.93);background:rgba(255,255,255,.08)}
/* These positions match the phone image. */
#messages{left:43.1%;top:25.7%;width:9.6%;aspect-ratio:1}
#camera{left:54.0%;top:25.7%;width:9.6%;aspect-ratio:1}
#splashface{left:38.0%;top:36.1%;width:9.6%;aspect-ratio:1}
#stocks{left:47.5%;top:36.1%;width:9.6%;aspect-ratio:1}
#maps{left:57.0%;top:36.1%;width:9.6%;aspect-ratio:1}
#photos{left:38.0%;top:46.9%;width:9.6%;aspect-ratio:1}
#weather{left:47.5%;top:46.9%;width:9.6%;aspect-ratio:1}
#notes{left:57.0%;top:46.9%;width:9.6%;aspect-ratio:1}
#peartunes{left:32.0%;top:55.9%;width:9.6%;aspect-ratio:1}
#settings{left:42.0%;top:55.9%;width:9.6%;aspect-ratio:1}
#clock{left:52.0%;top:55.9%;width:9.6%;aspect-ratio:1}
#videos{left:62.0%;top:55.9%;width:9.6%;aspect-ratio:1}
#phone{left:32.0%;top:65.9%;width:9.6%;aspect-ratio:1}
#mail{left:42.0%;top:65.9%;width:9.6%;aspect-ratio:1}
#compass{left:52.0%;top:65.9%;width:9.6%;aspect-ratio:1}
#music{left:62.0%;top:65.9%;width:9.6%;aspect-ratio:1}
#home{position:absolute;left:46%;top:78.8%;width:8.2%;aspect-ratio:1;border:0;background:transparent;border-radius:50%;cursor:pointer}
#overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:stretch;justify-content:stretch;padding:0;background:#f4f5f7;backdrop-filter:none}
#overlay.open{display:flex}
#app-window{width:100vw;height:100dvh;max-width:none;max-height:none;overflow:hidden;background:#f4f5f7;color:#111;border-radius:0;box-shadow:none;display:flex;flex-direction:column}
#app-window .window-header{flex:0 0 auto;position:relative;z-index:2;padding-top:calc(env(safe-area-inset-top) + 10px)!important}
#app-window .window-body{flex:1 1 auto;min-height:0;max-height:none!important;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)!important}
#app-window .button{transition:transform .12s ease,filter .12s ease}
#app-window .button:active{transform:scale(.96);filter:brightness(.96)}
.header{display:flex;align-items:center;gap:10px;padding:11px 13px;background:linear-gradient(#fff,#e7e8ea);border-bottom:1px solid #ccc;font-size:18px;font-weight:900}
.back{width:34px;height:34px;border-radius:50%;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-size:25px;cursor:pointer}
.content{padding:16px;max-height:calc(100dvh - 95px);overflow:auto}
.bubble{padding:10px 13px;width:max-content;max-width:82%;background:#dedfe3;border-radius:18px;margin-bottom:8px}
.bubble.me{margin-left:auto;background:linear-gradient(#58b9ff,#1389df);color:#fff}
.row{display:flex;gap:8px}
.button{padding:10px 14px;border-radius:12px;border:1px solid #bbb;background:linear-gradient(#fff,#ddd);font-weight:700;cursor:pointer}
input,textarea{font-size:16px;padding:10px;border:1px solid #bbb;border-radius:12px;outline:none}
textarea{width:100%;min-height:180px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.camera-video{width:100%;border-radius:18px;background:#000}
.stock{display:flex;justify-content:space-between;padding:12px;margin-bottom:8px;background:#fff;border:1px solid #ddd;border-radius:14px}
.map{height:245px;border-radius:18px;background:linear-gradient(135deg,#d6e5c7,#e7dfb9);display:flex;align-items:center;justify-content:center;font-size:65px}
@media(max-width:600px){#phone-container{width:74vw;height:80vh}}
@media(max-height:700px){#phone-container{width:68vw;height:72vh}}
</style>
</head>
<body>
<div id="phone-container">
  <button class="hotspot" id="messages" aria-label="Messages"></button>
  <button class="hotspot" id="camera" aria-label="Camera"></button>
  <button class="hotspot" id="splashface" aria-label="SplashFace"></button>
  <button class="hotspot" id="stocks" aria-label="Stocks"></button>
  <button class="hotspot" id="maps" aria-label="Maps"></button>
  <button class="hotspot" id="photos" aria-label="Photos"></button>
  <button class="hotspot" id="weather" aria-label="Weather"></button>
  <button class="hotspot" id="notes" aria-label="Notes"></button>
  <button class="hotspot" id="peartunes" aria-label="PearTunes"></button>
  <button class="hotspot" id="settings" aria-label="Settings"></button>
  <button class="hotspot" id="clock" aria-label="Clock"></button>
  <button class="hotspot" id="videos" aria-label="Videos"></button>
  <button class="hotspot" id="phone" aria-label="Phone"></button>
  <button class="hotspot" id="mail" aria-label="Mail"></button>
  <button class="hotspot" id="compass" aria-label="Compass"></button>
  <button class="hotspot" id="music" aria-label="Music"></button>
  <button id="home" aria-label="Home"></button>
</div>
<div id="overlay"><div id="app-window"></div></div>
<script src="app.js"></script>
</body>
</html>
